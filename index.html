<title>Blue Stone คุมการตัดเงิน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* Layout: app shell — navy bar + tab nav, one content column max 1180, ledger tables scroll inside their own box */
:root{
  --page:#f0f0f8; --card:#ffffff; --sunken:#e8e8f4; --field:#f5f5fd;
  --brand:#2a3b96; --deep:#0b1c57; --mid:#3a46ad; --accent:#5a4fd6;
  --tint:#e4e4fb; --tint-weak:#f3f3fd;
  --ink:#16183a; --head:#0b1c57; --muted:#5d5d7e; --faint:#716f93; --on-brand:#ffffff;
  --line:#d7d6e8; --line-soft:#e9e9f4; --line-field:#c8c6e2;
  --grad:linear-gradient(155deg,#0b1c57 0%,#2a3b96 45%,#7b5ad0 100%);
  --shadow:0 1px 2px rgba(16,14,70,.05),0 10px 28px rgba(16,14,70,.06);
  --ok:#0a5c3e; --ok-bg:#f1f9f5; --ok-bd:#a9d4bf;
  --warn:#8a5300; --warn-bg:#fdf6ea; --warn-bd:#e8c99a;
  --bad:#b3261e; --bad-bg:#fdf2f1; --bad-bd:#e3a6a1;
  --ring:#5a4fd6;
  --ui:'IBM Plex Sans Thai','Segoe UI',system-ui,-apple-system,sans-serif;
  --num:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0b0b1c; --card:#14152b; --sunken:#0e0f22; --field:#1b1c38;
    --brand:#4451c2; --deep:#161b4e; --mid:#2e3a8f; --accent:#8e85ee;
    --tint:#1f2048; --tint-weak:#171833;
    --ink:#e9e8f6; --head:#dcdcf8; --muted:#a0a0c0; --faint:#8481a6; --on-brand:#ffffff;
    --line:#282a4a; --line-soft:#1f2040; --line-field:#363860;
    --grad:linear-gradient(155deg,#0a0f33 0%,#232c7a 45%,#5a4fd6 100%);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.25);
    --ok:#5fd3a6; --ok-bg:#10291f; --ok-bd:#2e6b4e;
    --warn:#e0a33f; --warn-bg:#2a2008; --warn-bd:#6b5420;
    --bad:#f08a82; --bad-bg:#2e1513; --bad-bd:#74322c;
    --ring:#8e85ee;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0a1020; --card:#121b2e; --sunken:#0d1526; --field:#19233c;
  --brand:#2b57b5; --deep:#132a63; --mid:#1b3f8f; --accent:#6c9bf0;
  --tint:#1b2a4c; --tint-weak:#151f37;
  --ink:#e8edf8; --head:#dce6fa; --muted:#9aa9c4; --faint:#7d8ca8; --on-brand:#ffffff;
  --line:#26314a; --line-soft:#1d2740; --line-field:#32415f;
  --grad:linear-gradient(160deg,#0a1a40 0%,#132a63 50%,#2b57b5 100%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.25);
  --ok:#5fd3a6; --ok-bg:#10291f; --ok-bd:#2e6b4e;
  --warn:#e0a33f; --warn-bg:#2a2008; --warn-bd:#6b5420;
  --bad:#f08a82; --bad-bg:#2e1513; --bad-bd:#74322c;
  --ring:#8e85ee;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--deep)}
.num,td.n,th.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:19px;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
  font-variation-settings:'opsz' 24;-webkit-font-feature-settings:'liga';user-select:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---- app bar ---- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--grad);color:var(--on-brand);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
.bar-in{max-width:1180px;margin:0 auto;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:18px;min-height:64px}
.brandmark{display:flex;align-items:center;gap:11px;min-width:0}
.brandmark img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:10px;padding:3px;flex:0 0 auto;
  box-shadow:0 2px 8px rgba(0,0,0,.18)}
.brandmark b{display:block;font-size:14.5px;font-weight:700;letter-spacing:.1em;white-space:nowrap;line-height:1.3}
.brandmark small{display:block;font-size:10.5px;font-weight:400;letter-spacing:0;color:#c6c2f2;white-space:nowrap}
nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;min-width:0}
nav a{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 11px;border-radius:var(--r-md);
  color:#d2cef7;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
nav a .ms{font-size:18px;opacity:.9}
nav a:hover{background:rgba(255,255,255,.12)}
nav a[aria-current="page"]{background:#fff;color:var(--deep);font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.14)}
nav a[aria-current="page"] .ms{opacity:1}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#dedaf9}
.who span.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  background:var(--accent);color:#fff;font-weight:600}
.tbtn{min-height:34px;padding:0 10px;border:1px solid rgba(255,255,255,.35);border-radius:var(--r-md);
  background:transparent;color:#fff;font-family:inherit;font-size:12px;cursor:pointer}

/* ---- shell ---- */
main{max-width:1180px;margin:0 auto;padding-block:22px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0 0 6px;font-size:25px;line-height:1.45;font-weight:700;color:var(--head);text-wrap:balance}
h2{margin:0;font-size:16.5px;line-height:1.55;font-weight:700;color:var(--head)}
h3{margin:0;font-size:14px;line-height:1.55;font-weight:700;color:var(--head)}
p{margin:0}
.lede{color:var(--muted);font-size:13.5px;max-width:72ch}
.head-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:14px}
.head-row>div:first-child{flex:1 1 320px;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.card-h>div:first-child{flex:1 1 220px;min-width:0}
.card-b{padding:18px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g4{grid-template-columns:minmax(0,1fr)}}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);color:var(--muted);
  font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--tint-weak)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sec{border-color:var(--brand);color:var(--brand)}
.btn.sm{min-height:36px;padding:0 12px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.fl{display:block;margin-bottom:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;min-height:44px;padding:0 11px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--card);color:var(--ink);font-family:inherit;font-size:13.5px}
textarea{padding:10px 11px;min-height:70px;line-height:1.6;resize:vertical}
input.n{background:var(--field);border-color:var(--line-field);text-align:right;font-family:var(--num);
  font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px}
input.n.sm{min-height:38px;border-radius:var(--r-sm);font-size:13.5px}
input.warnf{background:var(--warn-bg);border-color:var(--warn-bd)}
.hint{margin-top:5px;font-size:11.5px;color:var(--muted)}
.hint.w{color:var(--warn);font-weight:600}

fieldset{margin:0;padding:0;border:0;min-width:0}
legend{padding:0 0 6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);color:var(--muted);
  font-size:13.5px;font-weight:600;cursor:pointer}
.seg.fill label{flex:1 1 0;min-width:0;text-align:center}
.seg input{accent-color:var(--brand);width:15px;height:15px;margin:0}
.seg label:has(input:checked){border-color:var(--brand);background:var(--tint);color:var(--head)}
.chk{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--r-md);cursor:pointer}
.chk input{accent-color:var(--brand);width:17px;height:17px;margin-top:3px;flex:0 0 auto}
.chk b{display:block;font-size:13.5px;font-weight:600}
.chk em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.chk:has(input:checked){border-color:var(--brand);background:var(--tint-weak)}

.tbox{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.card,.card-b,.stack>*{min-width:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:10px 11px;text-align:left}
thead th{background:var(--brand);color:#fff;font-weight:600;white-space:nowrap}
thead th.d{background:var(--deep)}
thead th.m{background:var(--mid)}
thead th.sub{font-weight:500;color:#cfcbf4}
.n{text-align:right}
.c{text-align:center}
tbody tr{border-bottom:1px solid var(--line-soft)}
tbody td{vertical-align:top}
tfoot tr{background:var(--sunken);border-top:2px solid var(--brand)}
tfoot th,tfoot td{font-weight:700;color:var(--head);padding:12px 11px}
.sep{border-right:2px solid var(--card)}
tbody .sep,tfoot .sep{border-right:2px solid var(--line-soft)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.pos{color:var(--ok);font-weight:600}
.neg{color:var(--bad);font-weight:600}
.str{font-weight:600}

.badge{display:inline-block;padding:2px 9px;border-radius:var(--r-pill);font-size:10.5px;font-weight:600;
  white-space:nowrap;font-family:var(--ui)}
.b-n{background:var(--sunken);color:var(--muted)}
.b-i{background:var(--tint);color:var(--brand)}
.b-s{background:var(--ok-bg);color:var(--ok)}
.b-w{background:var(--warn-bg);color:var(--warn)}
.b-d{background:var(--bad-bg);color:var(--bad)}

.kpi .t{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.kpi .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:29px;line-height:1.25;font-weight:600;color:var(--head)}
.kpi .u{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.track{height:7px;border-radius:var(--r-pill);background:var(--tint);overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent)}
.track.w{background:var(--warn-bg)}
.track.w>i{background:var(--warn)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px;font-size:12.5px}
.dl dt{color:var(--muted);margin:0}
.dl dd{margin:1px 0 0;font-weight:600;font-family:var(--num);font-variant-numeric:tabular-nums}
.foot-line{margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft);font-size:12.5px;font-weight:600}

.alert{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;border:1px solid;border-radius:var(--r-lg);padding:14px 16px}
.alert svg,.alert .ms{flex:0 0 auto;margin-top:1px}
.alert .ms{font-size:23px}
.alert .bd{flex:1 1 240px;min-width:0}
.alert .bd b{display:block;font-size:14px;margin-bottom:2px}
.alert .bd p{font-size:13px;color:var(--ink)}
.a-w{background:var(--warn-bg);border-color:var(--warn-bd)} .a-w b{color:var(--warn)}
.a-s{background:var(--ok-bg);border-color:var(--ok-bd)} .a-s b{color:var(--ok)}
.a-d{background:var(--bad-bg);border-color:var(--bad-bd)} .a-d b{color:var(--bad)}
.a-i{background:var(--tint);border-color:var(--accent)} .a-i b{color:var(--brand)}

.note{font-size:11.5px;color:var(--muted)}
.demo{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);background:var(--tint);color:var(--brand);
  font-size:11.5px;font-weight:600}
.secnum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:var(--brand);color:#fff;font-size:13px;font-weight:700;flex:0 0 auto}
pre.out{margin:0;max-height:260px;overflow:auto;padding:12px;background:var(--sunken);border:1px solid var(--line);
  border-radius:var(--r-md);font-family:var(--num);font-size:11.5px;line-height:1.7;white-space:pre;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  z-index:40;background:var(--deep);color:#fff;padding:11px 18px;border-radius:var(--r-pill);font-size:13px;font-weight:600;
  box-shadow:0 10px 28px rgba(14,12,60,.3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

      w.fBal = fBal; w.jBal = jBal;
      w.stockP = stock.powder; w.stockB = stock.bag;
      rows.push(w);
    });

    var revenue = T.revBuyer + T.revOther;
    var grossBeforeShip = revenue - T.soldCost;

    return {
      rows: rows, T: T, fBal: fBal, jBal: jBal, stock: stock,
      shipTotal: T.ship + T.scan + T.shipThai,
      shipLaoTotal: T.ship + T.scan,
      revenue: revenue, grossBeforeShip: grossBeforeShip,
      gross: grossBeforeShip - (T.ship + T.scan),
      capF: r.fPowder > 0 ? fBal / r.fPowder : 0,
      capJ: r.jPowder > 0 ? jBal / r.jPowder : 0
    };
  }

  function monthKey(iso) { return String(iso).slice(0, 7); }
  function monthTH(key) {
    var pp = key.split('-');
    if (pp.length < 2) { return key; }
    return TH_M[parseInt(pp[1], 10) - 1] + ' ' + String(parseInt(pp[0], 10) + 543).slice(2);
  }

  function monthlyRollup(rows) {
    var map = {}, order = [];
    rows.forEach(function (w) {
      var k = monthKey(w.date);
      if (!map[k]) { map[k] = { k: k, fIn: 0, fCut: 0, jIn: 0, jCut: 0, fEnd: 0, jEnd: 0 }; order.push(k); }
      var m = map[k];
      m.fIn += w.fIn; m.fCut += w.fAmt; m.jIn += w.jIn; m.jCut += w.jAmt;
      m.fEnd = w.fBal; m.jEnd = w.jBal;
    });
    order.sort();
    var cf = 0, cj = 0;
    return order.map(function (k) {
      var m = map[k];
      cf += m.fIn; cj += m.jIn;
      m.fInCum = cf; m.jInCum = cj;
      return m;
    });
  }

  /* ================= แดชบอร์ดหน้าคุมการตัดเงิน ================= */

  var dashMode = 'd1';   // d1 โดนัท · d2 แท่งรายเดือน · d3 ทั้งสอง · off ปิด

  function donutSVG(used, left, cUsed, cLeft) {
    var tot = used + left;
    var pct = tot > 0 ? left / tot : 0;
    var R = 52, C = 2 * Math.PI * R;
    var dash = C * pct;
    return '<svg viewBox="0 0 140 140" style="width:100%;height:auto;display:block" role="img" ' +

      '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + cUsed + '" stroke-width="18"></circle>' +

            '<label><input type="radio" name="kind" value="saleBuyer"' + (K === 'saleBuyer' ? ' checked' : '') +

            : '<p class="hint">หากไม่เลือกข้อใด ระบบจะบันทึกเป็นการรับปูนเข้าตามปกติ · รายการรับ-จ่ายเงินให้บันทึกที่หน้าคุมการตัดเงิน</p>') +

      var key = path[path.length - 1];
      var redraw = (key === 'type' || key === 'nation' || key === 'scan' || key === 'tons');
      function target() {
        var t = form.trucks[i];
        return path.length > 1 ? t[path[0]] : t;
      }
      inp.addEventListener('change', function () {
        var o = target();
        o[key] = inp.type === 'checkbox' ? inp.checked : inp.value;
        if (key === 'driver') {
          var known = book().drivers[(inp.value || '').trim()];

            if (pe) { pe.value = known; }
          }
        }
        if (redraw) { softRedraw(); }
      });
      if (!redraw && inp.type !== 'checkbox') {

        cusM.q = ''; cusM.open = true;
        renderModals();

    });
    Array.prototype.forEach.call(el('v-entry').querySelectorAll('[data-rm]'), function (b) {

        return;

      var nid = S.entries.reduce(function (m, e) { return Math.max(m, e.id); }, 0) + 1;
      if (K === 'import') {
        S.entries.push({ id: nid, date: form.date, kind: 'import',

              return { company: (o.company || '').trim(), plate: (o.plate || '').trim(),
                       driver: (o.driver || '').trim(), phone: (o.phone || '').trim(), tons: num(o.tons) };
            }
            return { type: t.type || 'powder', brand: (t.brand || '').trim(), nation: t.nation || 'thai',
                     scan: t.scan === undefined ? true : !!t.scan, dest: (t.dest || '').trim(),
                     destId: t.destId || '', job: t.job || '', tok: t.tok || null,
                     tLoad: t.tLoad || '', tSend: t.tSend || '', tDeliver: t.tDeliver || '',
                     lao: side(t.lao), thai: side(t.thai) };
          }) });
      } else if (isSale) {
        var sP = 0, sB = 0;
        form.trucks.forEach(function (t) {
          var q = num(t.thai.tons);
          if ((t.type || 'powder') === 'bag') { sB += q; } else { sP += q; }
        });
        if (sP + sB <= 0) { toast('ยังไม่มีน้ำหนัก กดปุ่มบันทึกทะเบียนรถเพื่อกรอกก่อน'); return; }
        var rP = form.priceP === '' ? S.rates.jPowder : num(form.priceP);
        var rB = form.priceB === '' ? num(S.rates.jBag) : num(form.priceB);
        if (sP > 0) {
          S.entries.push({ id: nid, date: form.date, kind: K, cementType: 'powder', tons: sP, price: rP, who: form.who });
          nid += 1;
        }
        if (sB > 0) {
          S.entries.push({ id: nid, date: form.date, kind: K, cementType: 'bag', tons: sB, price: rB, who: form.who });
        }
        form.priceP = ''; form.priceB = ''; form.who = '';
      } else {
        var a = num(form.amount);
        if (a <= 0) { toast('กรุณาใส่จำนวนเงิน'); return; }
        S.entries.push({ id: nid, date: form.date, kind: K, amount: a,
          note: form.note || (K === 'depositF' ? 'โอนเงินให้' + nm.factory : 'รับเงินจาก ' + nm.buyer) });
        form.amount = ''; form.note = '';
      }
      S.demo = false; save();
      if (K === 'import') {
        logIt('บันทึกปูนเข้า', form.trucks.length + ' คู่รถ · ' + thDate(form.date));
      } else if (isSale) {
        logIt(K === 'saleBuyer' ? 'บันทึกส่งมอบให้ ' + nm.buyer : 'บันทึกจำหน่ายลูกค้ารายอื่น', thDate(form.date));
      }
      location.hash = '#ledger';
      toast('บันทึกรายการแล้ว');
    });
  }

  /* ประวัติการนำเข้าปูนและการส่งมอบ รายวัน */
  function importHistory(c) {
    var by = {}, order = [];
    c.rows.forEach(function (w) {
      var e = w.e;
      if (e.kind !== 'import' && e.kind !== 'saleBuyer') { return; }
      if (!by[w.date]) {
        by[w.date] = { date: w.date, trucks: 0, lp: 0, lb: 0, tp: 0, tb: 0, f: 0, jt: 0, j: 0 };
        order.push(w.date);
      }
      var d = by[w.date];
      if (e.kind === 'import') {
        d.trucks += w.trucks;
        d.lp += w.byTypeL.powder; d.lb += w.byTypeL.bag;
        d.tp += w.byType.powder;  d.tb += w.byType.bag;
        d.f += w.fAmt;
      } else {
        d.jt += w.tons; d.j += w.jAmt;
      }
    });
    var keys = ['trucks', 'lp', 'lb', 'tp', 'tb', 'f', 'jt', 'j'];
    var tot = { trucks: 0, lp: 0, lb: 0, tp: 0, tb: 0, f: 0, jt: 0, j: 0 };
    var rows = order.map(function (k) {
      var d = by[k];
      keys.forEach(function (x) { tot[x] += d[x]; });
      return '<tr><td class="muted" style="white-space:nowrap">' + thDate(d.date) + '</td>' +
        '<td class="n str">' + (d.trucks || dash()) + '</td>' +
        '<td class="n">' + (d.lp ? t2(d.lp) : dash()) + '</td>' +
        '<td class="n muted">' + (d.tp ? t2(d.tp) : dash()) + '</td>' +
        '<td class="n">' + (d.lb ? t2(d.lb) : dash()) + '</td>' +
        '<td class="n muted">' + (d.tb ? t2(d.tb) : dash()) + '</td>' +
        '<td class="n str sep">' + (d.f ? m2(d.f) : dash()) + '</td>' +
        '<td class="n">' + (d.jt ? t2(d.jt) : dash()) + '</td>' +
        '<td class="n str">' + (d.j ? m2(d.j) : dash()) + '</td></tr>';
    }).join('');

    return '<section class="card" style="margin-top:16px">' +
      '<div class="card-h"><div><h2>ประวัติการนำเข้าปูนและการส่งมอบรายวัน</h2>' +
      '<p class="note">' + order.length + ' วันทำการ · รวม ' + tot.trucks + ' คู่รถ · ' +
      'น้ำหนักฝั่งลาวใช้ตัดเงินโรงงาน น้ำหนักฝั่งไทยคือปูนที่รับเข้าคงคลัง</p></div>' +
      '<a class="btn sm" href="#export">ส่งออกข้อมูล</a></div>' +
      '<div class="tbox"><table><thead>' +
        '<tr><th rowspan="2">วันที่</th><th rowspan="2" class="n">คู่รถ</th>' +
        '<th colspan="2" class="c">ปูนผง (ตัน)</th><th colspan="2" class="c">ปูนถุง (ตัน)</th>' +
        '<th rowspan="2" class="n sep">ตัดเงินโรงงาน</th>' +
        '<th colspan="2" class="m c">ส่งมอบให้ ' + esc(nm.buyer) + '</th></tr>' +
        '<tr><th class="sub n">ฝั่งลาว</th><th class="sub n">ฝั่งไทย</th>' +
        '<th class="sub n">ฝั่งลาว</th><th class="sub n">ฝั่งไทย</th>' +
        '<th class="m sub n">ตัน</th><th class="m sub n">ตัดเงิน</th></tr>' +
      '</thead><tbody>' +
      (rows || '<tr><td colspan="9" class="muted" style="padding:28px;text-align:center">ยังไม่มีประวัติการนำเข้า</td></tr>') +
      '</tbody><tfoot><tr><th>รวมทั้งหมด</th><td class="n">' + tot.trucks + '</td>' +
        '<td class="n">' + t2(tot.lp) + '</td><td class="n">' + t2(tot.tp) + '</td>' +
        '<td class="n">' + t2(tot.lb) + '</td><td class="n">' + t2(tot.tb) + '</td>' +
        '<td class="n sep">' + m2(tot.f) + '</td>' +

  var pick = { balance: true, ledger: true, sales: true, shipping: true, trucks: true, analysis: true };

  function analysis() {
    var c = compute(), r = S.rates, T = c.T;
    var sold = T.soldPowder + T.soldBag;
    var avgShip = T.inTons ? c.shipTotal / T.inTons : 0;
    var rev = c.revenue;
    function per(type) {
      var tons = type === 'powder' ? T.soldPowder : T.soldBag;
      var cost = costOf(type);
      var price = type === 'powder' ? r.jPowder : r.jBag;
      return { tons: tons, cost: cost, price: price, before: price - cost, after: price - cost - avgShip };
    }
    return {
      c: c, T: T, avgShip: avgShip, sold: sold,
      powder: per('powder'), bag: per('bag'),
      shareBuyer: rev ? T.revBuyer / rev : 0,
      shareOther: rev ? T.revOther / rev : 0,
      turn: T.inTons ? sold / T.inTons : 0,
      costShare: rev ? T.soldCost / rev : 0,
      shipShare: rev ? c.shipTotal / rev : 0,
      marginPct: rev ? c.gross / rev : 0
    };
  }

  function csvCell(v) {
    var s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function formatSets(sets, fmt) {
    if (!sets.length) { return ''; }
    if (fmt === 'json') {
      return JSON.stringify(sets.map(function (s) {
        return { title: s.title, rows: s.rows.map(function (r) {
          var o = {}; s.header.forEach(function (h, i) { o[h] = r[i]; }); return o;
        }) };
      }), null, 2);
    }
    if (fmt === 'md') {
      return sets.map(function (s) {
        var out = ['## ' + s.title, '', '| ' + s.header.join(' | ') + ' |',
          '| ' + s.header.map(function () { return '---'; }).join(' | ') + ' |'];
        s.rows.forEach(function (r) { out.push('| ' + r.map(function (c) { return String(c === '' || c == null ? '—' : c); }).join(' | ') + ' |'); });
        return out.join('\n');
      }).join('\n\n');
    }
    var sep = fmt === 'csv' ? ',' : '\t';
    var cell = fmt === 'csv' ? csvCell : function (v) { return String(v); };
    return sets.map(function (s) {
      var out = ['[ ' + s.title + ' ]', s.header.map(cell).join(sep)];
      s.rows.forEach(function (r) { out.push(r.map(cell).join(sep)); });
      return out.join('\n');
    }).join('\n\n');
  }

  /* ================= โปรไฟล์บนแถบบน ================= */
  /* ---- ย่อรูปโปรไฟล์ ----
     รูปจากกล้องมือถือมักใหญ่หลายเมกะไบต์ ถ้าเก็บทั้งไฟล์จะกินพื้นที่ในเบราว์เซอร์จนเต็ม
     หน้าเว็บแสดงรูปนี้ใหญ่สุด 48 จุด ย่อด้านยาวเหลือ 320 จุดจึงเกินพอแม้บนจอความละเอียดสูง */
  var PIC_MAX = 320;       /* ด้านยาวสุดหลังย่อ หน่วยเป็นจุดภาพ */
  var PIC_BYTES = 120000;  /* ขนาดที่ยอมให้เก็บหลังย่อ ประมาณ 120 KB */

  function shrinkPic(file, done) {
    var fr = new FileReader();
    fr.onerror = function () { done(new Error('อ่านไฟล์ไม่สำเร็จ')); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { done(new Error('ไฟล์นี้เปิดเป็นรูปภาพไม่ได้')); };
      img.onload = function () {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) { done(new Error('อ่านขนาดรูปไม่ได้')); return; }
        var k = Math.min(1, PIC_MAX / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var cx = cv.getContext('2d');
        /* ลงพื้นขาวก่อน กัน PNG พื้นโปร่งใสกลายเป็นพื้นดำตอนแปลงเป็น JPEG */
        cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, cw, ch);
        cx.drawImage(img, 0, 0, cw, ch);
        var q = 0.82, out = cv.toDataURL('image/jpeg', q);
        while (out.length * 0.75 > PIC_BYTES && q > 0.4) {
          q -= 0.12; out = cv.toDataURL('image/jpeg', q);
        }
        done(null, { url: out, w: cw, h: ch, ow: w, oh: h, bytes: Math.round(out.length * 0.75) });
      };
      img.src = String(fr.result);
    };
    fr.readAsDataURL(file);
  }

  /* '2026-11-05T08:29' -> {y,m,d,hh,mm} ; คืน null ถ้าว่าง */
  function dtParse(v) {
    var s = String(v || '').trim();
    if (!s) { return null; }
    var p = s.split('T'), a = p[0].split('-');
    if (a.length < 3) { return null; }
    var t = (p[1] || '').split(':');
    return { y: parseInt(a[0], 10), m: parseInt(a[1], 10) - 1, d: parseInt(a[2], 10),
             hh: parseInt(t[0] || '0', 10) || 0, mm: parseInt(t[1] || '0', 10) || 0 };
  }
  function dtJoin(o, withTime) {
    var base = o.y + '-' + pad2(o.m + 1) + '-' + pad2(o.d);
    return withTime ? base + 'T' + pad2(o.hh) + ':' + pad2(o.mm) : base;
  }
  /* ข้อความไทยที่โชว์บนปุ่ม */
  function dtLabel(v, withTime) {
    var o = dtParse(v);
    if (!o) { return ''; }
    var txt = o.d + ' ' + TH_MON_S[o.m] + ' ' + pad2((o.y + 543) % 100);
    return withTime ? txt + ' เวลา ' + pad2(o.hh) + ':' + pad2(o.mm) + ' น.' : txt;
  }

    var today = new Date();

        'font:inherit;font-size:13px;font-weight:' + (sel ? '700' : '500') + ';' +

  function dtCommit(val) {
    var inp = el(dtP.key);
    var key = dtP.key, wt = dtP.withTime;
    dtClose();
    if (!inp) { return; }
    inp.value = val;
    var btn = document.querySelector('[data-dt="' + key + '"]');
    if (btn) {
      var lab = dtLabel(val, wt);
      var sp = btn.children[1];
      if (sp) { sp.textContent = lab || (wt ? 'เลือกวันและเวลา' : 'เลือกวันที่'); }
      btn.style.color = lab ? 'var(--ink)' : 'var(--muted)';
    }
    var ev;
    try { ev = new Event('change', { bubbles: true }); } catch (eE) {
      ev = document.createEvent('Event'); ev.initEvent('change', true, true);
    }
    inp.dispatchEvent(ev);

  function dtRender() {
    pickHost().innerHTML = dtPickerHTML();
    el('pkPrev').addEventListener('click', function () {
      dtP.m -= 1; if (dtP.m < 0) { dtP.m = 11; dtP.y -= 1; } dtRender();
    });
    el('pkNext').addEventListener('click', function () {
      dtP.m += 1; if (dtP.m > 11) { dtP.m = 0; dtP.y += 1; } dtRender();
    });
    Array.prototype.forEach.call(pickHost().querySelectorAll('[data-day]'), function (b) {
      b.addEventListener('click', function () {
        dtP.d = parseInt(b.getAttribute('data-day'), 10);
        if (!dtP.withTime) { dtCommit(dtJoin(dtP, false)); return; }
        dtRender();
      });
    });
    if (el('pkH')) {
      el('pkH').addEventListener('change', function () { dtP.hh = parseInt(this.value, 10); });
      el('pkM').addEventListener('change', function () { dtP.mm = parseInt(this.value, 10); });
    }
    el('pkNow').addEventListener('click', function () {
      var n = new Date();
      dtP.y = n.getFullYear(); dtP.m = n.getMonth(); dtP.d = n.getDate();
      if (dtP.withTime) { dtP.hh = n.getHours(); dtP.mm = n.getMinutes(); }

    el('pkClear').addEventListener('click', function () { dtCommit(''); });
    el('pkCancel').addEventListener('click', dtClose);
    el('pkOk').addEventListener('click', function () { dtCommit(dtJoin(dtP, dtP.withTime)); });

  function parseGeo(txt) {
    var s = String(txt || '');
    var m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
            s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) ||
            s.match(/[?&]q=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) ||
            s.match(/[?&]ll=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) ||
            s.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (!m) { return ''; }
    return parseFloat(m[1]).toFixed(6) + ', ' + parseFloat(m[2]).toFixed(6);
  }

  /* คำนวณตัวเลขของคู่รถหนึ่งคู่ ใช้ตรรกะเดียวกับหน้าบันทึก */
  function pairCalc(i) {
    var r = S.rates, t = form.trucks[i];
    if (!t) { return null; }
    var tnL = num(t.lao.tons), tnT = num(t.thai.tons);
    var ty = t.type || 'powder', na = t.nation || 'thai';
    var lane = laneOf(ty, na);
    var counts = {};
    form.trucks.forEach(function (q) {
      var k = (r.tierCount === 'all') ? '*'
        : (r.tierCount === 'type' ? (q.type || 'powder') : laneOf(q.type || 'powder', q.nation || 'thai'));
      counts[k] = (counts[k] || 0) + 1;
    });
    var key = (r.tierCount === 'all') ? '*' : (r.tierCount === 'type' ? ty : lane);
    var cnt = counts[key] || 1;
    var sRate = r.tiers[lane][Math.min(Math.max(cnt, 1), 5) - 1];
    var perTruck = ty === 'powder' ? num(r.tPowder) : num(r.tBag);
    var thai = (r.thaiBasis === 'ton')
      ? ((num(r.truckTon) > 0 ? perTruck / num(r.truckTon) : 0) * tnT) : perTruck;
    var fR = ty === 'powder' ? r.fPowder : r.fBag;
    return { tnL: tnL, tnT: tnT, loss: tnL - tnT, sRate: sRate, ship: sRate * tnL,
             thai: thai, fRate: fR, fAmt: fR * tnL, scan: t.scan === undefined ? true : !!t.scan };
  }

  /* วาดไทล์แผนที่รอบพิกัดกลาง ถ้าโหลดภาพไม่ได้ก็ยังใช้หมุดได้ */
  function mountPin() {
    var pane = el('pinPane');
    if (!pane) { return; }
    var g = pane.getAttribute('data-gps') || '';
    var parts = g.split(',');
    var lat = parseFloat(parts[0]), lon = parseFloat(parts[1]);
    if (isNaN(lat) || isNaN(lon)) { return; }
    var box = el('tiles');
    box.innerHTML = '';
    var z = 17, TS = 256, n = Math.pow(2, z);
    var la = lat * Math.PI / 180;
    var px = (lon + 180) / 360 * n * TS;
    var py = (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n * TS;
    var cw = pane.clientWidth || 320, ch = pane.clientHeight || 220;
    var cx = cw / 2, cy = ch / 2;
    var blocked = false;
    function flag() {
      if (blocked) { return; }
      blocked = true;
      var tn = el('tileNote');
      if (tn) { tn.style.display = 'block'; }
    }
    var x0 = Math.floor((px - cx) / TS), x1 = Math.floor((px + cx) / TS);
    var y0 = Math.floor((py - cy) / TS), y1 = Math.floor((py + cy) / TS);
    for (var X = x0; X <= x1; X++) {
      for (var Y = y0; Y <= y1; Y++) {
        if (Y < 0 || Y >= n) { continue; }
        var im = document.createElement('img');
        im.alt = '';
        im.style.cssText = 'position:absolute;width:' + TS + 'px;height:' + TS + 'px;left:' +
          (X * TS - px + cx) + 'px;top:' + (Y * TS - py + cy) + 'px';
        im.onerror = flag;
        im.src = 'https://tile.openstreetmap.org/' + z + '/' + ((X % n) + n) % n + '/' + Y + '.png';
        box.appendChild(im);
      }
    }
    setTimeout(function () {
      var any = false;
      Array.prototype.forEach.call(box.querySelectorAll('img'), function (q2) { if (q2.naturalWidth > 0) { any = true; } });
      if (!any) { flag(); }
    }, 3000);
  }

  function bindPin() {
    var pin = el('pinM'), pane = el('pinPane');
    if (!pin || !pane) { return; }
    var g = (pane.getAttribute('data-gps') || '').split(',');
    var lat0 = parseFloat(g[0]), lon0 = parseFloat(g[1]);
    if (isNaN(lat0) || isNaN(lon0)) { return; }
    var perPx = 360 / (256 * Math.pow(2, 17));
    var kLat = perPx * Math.cos(lat0 * Math.PI / 180);
    var drag = false, sx = 0, sy = 0, dx = 0, dy = 0;

    function coordAt(ddx, ddy) {
      return (lat0 - ddy * kLat).toFixed(6) + ', ' + (lon0 + ddx * perPx).toFixed(6);
    }
    pin.addEventListener('pointerdown', function (e) {
      drag = true; sx = e.clientX; sy = e.clientY;
      pin.style.cursor = 'grabbing';
      try { pin.setPointerCapture(e.pointerId); } catch (eC) { /* ไม่รองรับก็ข้ามไป */ }
      e.preventDefault();
    });
    pin.addEventListener('pointermove', function (e) {
      if (!drag) { return; }
      dx = e.clientX - sx; dy = e.clientY - sy;
      pin.style.left = 'calc(50% + ' + dx + 'px)';
      pin.style.top = 'calc(50% + ' + dy + 'px)';
      var t = el('pinTxt');
      if (t) { t.textContent = 'กำลังเลื่อนหมุด ' + coordAt(dx, dy) + ' · ปล่อยเพื่อบันทึก'; }
    });
    function done() {
      if (!drag) { return; }
      drag = false;
      pin.style.cursor = 'grab';
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) { return; }
      cusM.draft.gps = coordAt(dx, dy);
      soonModals();
      toast('ย้ายหมุดเป็น ' + cusM.draft.gps);
    }
    pin.addEventListener('pointerup', done);
    pin.addEventListener('pointercancel', done);
  }

          '<span class="ms" aria-hidden="true" style="font-size:19px;color:#1E7B3C">forward_to_inbox</span>' +
          'ข้อความแจ้งลูกค้า</button>' +
        '</div>' +
        ((form.trucks[i] && form.trucks[i].job)
          ? '<p class="hint" style="margin:-4px 0 0;text-align:center">เลขงาน ' + esc(form.trucks[i].job) + '</p>' : '') +
        '<div class="actions" style="justify-content:flex-end">' +
          (d.id ? '<button type="button" class="btn" id="cDel">ลบลูกค้ารายนี้</button>' : '') +
          '<button type="button" id="cKeep" ' +
          'style="display:flex;align-items:center;gap:8px;padding:11px 20px;border:0;border-radius:var(--r-md);' +
          'background:#1E7B3C;color:#fff;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer">' +
          '<span class="ms" aria-hidden="true" style="font-size:19px">save</span>บันทึกลูกค้า</button>' +
        '</div></div>';
    }

    var closeTxt = cusM.mode === 'msg' ? 'ย้อนกลับ' : 'ปิด';
    var title = cusM.mode === 'msg' ? 'ข้อความและเอกสาร'
      : (cusM.mode === 'list' ? 'เลือกลูกค้าปลายทาง' : 'ปลายทางลูกค้า');
    var sub = cusM.mode === 'msg' ? 'ข้อความแจ้งผู้รับจ้างขนส่ง · แก้ไขได้ก่อนคัดลอก'
      : 'คู่รถที่ ' + (i + 1) + ' · ข้อมูลที่บันทึกจะถูกจำไว้ใช้ครั้งต่อไป';

    return overlay(
      '<div class="card-h" style="position:sticky;top:0;background:var(--card);z-index:2">' +
      '<div><h2 style="margin:0">' + esc(title) + '</h2>' +
      '<p class="note" style="margin-top:3px">' + esc(sub) + '</p></div>' +
      '<button type="button" class="btn sm" id="cClose">' + closeTxt + '</button></div>' + body, 760);
  }

  function renderModals() {
    var h = modalHost();
    try {
      h.innerHTML = cusM.open ? cusModalHTML() : '';
    } catch (eR) {
      setTimeout(renderModals, 0);
      return;
    }
    if (cusM.open) { bindCus(); }
  }
  function soonModals() { setTimeout(renderModals, 0); }

  function closeModals() { cusM.open = false; renderModals(); }

  function bindCus() {
    el('cClose').addEventListener('click', function () {
      if (cusM.mode === 'msg') { cusM.mode = 'form'; renderModals(); return; }
      closeModals(); viewEntry();
    });

    if (cusM.mode === 'msg') {
      Array.prototype.forEach.call(modalHost().querySelectorAll('[data-mk]'), function (rb) {
        rb.addEventListener('change', function () {
          msgM.kind = rb.getAttribute('data-mk');
          msgM.text = buildMsg(cusM.idx, msgM.kind);
          msgM.orig = msgM.text;
          renderModals();
        });
      });
      el('msgTa').addEventListener('input', function () { msgM.text = this.value; });
      el('mCopy').addEventListener('click', function () {
        var ta = el('msgTa');
        ta.focus(); ta.select();
        var done = false;
        try { done = document.execCommand('copy'); } catch (e) { done = false; }
        if (!done && navigator.clipboard) {
          navigator.clipboard.writeText(ta.value).then(function () { toast('คัดลอกข้อความแล้ว'); },
            function () { toast('คัดลอกไม่สำเร็จ กด Ctrl+C อีกครั้ง'); });
          return;
        }
        toast(done ? 'คัดลอกข้อความแล้ว' : 'คัดลอกไม่สำเร็จ กด Ctrl+C อีกครั้ง');
      });
      return;
    }

    if (cusM.mode === 'list') {
      el('cq').addEventListener('input', function () { cusM.q = this.value; soonModals(); });
      el('cNew').addEventListener('click', function () { cusM.mode = 'form'; cusM.draft = newDraft(); renderModals(); });
      Array.prototype.forEach.call(modalHost().querySelectorAll('[data-pick]'), function (b) {
        b.addEventListener('click', function () {
          var c = cusById(b.getAttribute('data-pick'));
          if (!c) { return; }
          cusM.draft = JSON.parse(JSON.stringify(c));
          cusM.mode = 'form';
          renderModals();
        });
      });
      return;
    }

    /* โหมดฟอร์ม */
    Array.prototype.forEach.call(modalHost().querySelectorAll('[data-cd]'), function (inp) {
      var k = inp.getAttribute('data-cd');
      var dig = inp.getAttribute('data-dig');
      inp.addEventListener('input', function () {
        if (dig) {
          var cleaned = digits(inp.value, parseInt(dig, 10));
          if (cleaned !== inp.value) { inp.value = cleaned; }
        }
        cusM.draft[k] = inp.value;
        if (k === 'taxId') { setHint('hintTax', inp.value.length, 13, 'เลขนิติบุคคล', 13); }
        if (k === 'phone') { setHint('hintPhone', inp.value.length, 9, 'เบอร์โทร', 10); }
      });
      inp.addEventListener('change', function () {
        if (dig) { inp.value = digits(inp.value, parseInt(dig, 10)); }
        cusM.draft[k] = inp.value;
        if (k === 'province') {
          if (ampList(inp.value).indexOf(cusM.draft.amphoe) < 0) { cusM.draft.amphoe = ''; cusM.draft.tambon = ''; cusM.draft.zip = ''; }
          soonModals();
        }
        if (k === 'amphoe') {
          if (tamList(cusM.draft.province, inp.value).indexOf(cusM.draft.tambon) < 0) { cusM.draft.tambon = ''; cusM.draft.zip = ''; }
          soonModals();
        }
        if (k === 'tambon') {
          cusM.draft.zip = zipOf(cusM.draft.province, cusM.draft.amphoe, inp.value);
          soonModals();
        }
        if (k === 'gps') { soonModals(); }
      });
    });

    if (el('cPasteGo')) {
      el('cPasteGo').addEventListener('click', function () {
        var g = parseGeo(el('cPaste').value);
        if (!g) { toast('อ่านพิกัดจากข้อความนี้ไม่ได้ ลองคัดลอกลิงก์จาก Google Maps ใหม่'); return; }
        cusM.draft.gps = g; renderModals(); toast('ได้พิกัด ' + g);
      });
      el('cPaste').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); el('cPasteGo').click(); }
      });
    }
    if (el('cGpsClear')) {
      el('cGpsClear').addEventListener('click', function () { cusM.draft.gps = ''; cusM.sv = false; soonModals(); });
    }
    if (el('cSv')) {
      el('cSv').addEventListener('click', function () { cusM.sv = !cusM.sv; soonModals(); });
    }
    mountPin();
    bindPin();

    Array.prototype.forEach.call(modalHost().querySelectorAll('[data-tf]'), function (inp) {
      inp.addEventListener('change', function () {
        var t = form.trucks[cusM.idx];
        if (t) { t[inp.getAttribute('data-tf')] = inp.value; save(); }
      });
    });

    Array.prototype.forEach.call(modalHost().querySelectorAll('[data-map]'), function (f) {
      var ok = false;
      f.addEventListener('load', function () { ok = true; });
      setTimeout(function () {
        if (ok || !f.parentNode) { return; }
        var box = document.createElement('div');
        box.className = 'note';
        box.style.cssText = 'height:190px;display:flex;align-items:center;justify-content:center;text-align:center;' +
          'padding:14px;border:1px dashed var(--line);border-radius:var(--r-md);background:var(--sunken)';
        box.textContent = 'หน้านี้เปิดแผนที่ฝังจากภายนอกไม่ได้ · กดปุ่มแผนที่หรือสตรีทวิวด้านบนเพื่อเปิดในแท็บใหม่';
        f.parentNode.replaceChild(box, f);
      }, 3500);
    });

    if (el('cKeep')) {
      el('cKeep').addEventListener('click', function () {
        var dk = cusM.draft;
        if (!(dk.name || '').trim()) { toast('กรุณากรอกชื่อลูกค้าก่อน'); return; }
        if (dk.taxId && dk.taxId.length !== 13) { toast('เลขนิติบุคคลต้องครบ 13 หลัก'); return; }
        if (dk.phone && dk.phone.length < 9) { toast('เบอร์โทรยังไม่ครบ'); return; }
        if (!dk.id) { dk.id = 'c' + Date.now() + randTok(4); S.customers.push(dk); }
        else { S.customers = S.customers.map(function (x) { return x.id === dk.id ? dk : x; }); }
        var tkk = form.trucks[cusM.idx];
        if (tkk) { tkk.destId = dk.id; tkk.dest = dk.name; }
        save(); logIt('บันทึกลูกค้าปลายทาง', dk.name + (cusAddr(dk) ? ' · ' + cusAddr(dk) : ''));
        closeModals(); viewEntry();
        toast('บันทึกลูกค้าและตั้งเป็นปลายทางของคู่รถนี้แล้ว');
      });
    }

    Array.prototype.forEach.call(modalHost().querySelectorAll('[data-mk-open]'), function (bt) {
      bt.addEventListener('click', function () {
        var d2 = cusM.draft;
        if ((d2.name || '').trim()) {
          if (!d2.id) { d2.id = 'c' + Date.now() + randTok(4); S.customers.push(d2); }
          else { S.customers = S.customers.map(function (x) { return x.id === d2.id ? d2 : x; }); }
          var tk0 = form.trucks[cusM.idx];
          if (tk0) { tk0.destId = d2.id; tk0.dest = d2.name; }
          save();
        }
        msgM.kind = bt.getAttribute('data-mk-open');
        msgM.text = buildMsg(cusM.idx, msgM.kind);
        msgM.orig = msgM.text;
        cusM.mode = 'msg';
        renderModals();
      });
    });
    if (el('cLoad')) {
      el('cLoad').addEventListener('change', function () {
        var pickName = this.value.trim();
        var hit = null;
        S.customers.forEach(function (x) { if (x.name === pickName) { hit = x; } });
        if (!hit) { toast('ไม่พบลูกค้าชื่อนี้ในระบบ'); return; }
        cusM.draft = JSON.parse(JSON.stringify(hit));
        soonModals(); toast('เรียกข้อมูล ' + hit.name + ' แล้ว');
      });
    }
    if (el('cDel')) {
      el('cDel').addEventListener('click', function () {
        var id = cusM.draft.id;
        var gone = JSON.parse(JSON.stringify(cusM.draft || {}));
        S.customers = S.customers.filter(function (x) { return x.id !== id; });
        if (S.trash.customers.indexOf(id) < 0) { S.trash.customers.push(id); }
        form.trucks.forEach(function (t) { if (t.destId === id) { t.destId = ''; t.dest = ''; } });
        save();
        logIt('ลบลูกค้า', (gone.name || id) +
          (gone.taxId ? ' · เลขนิติบุคคล ' + gone.taxId : '') +
          (gone.phone ? ' · โทร ' + gone.phone : '') +
          ' · ' + [gone.tambon, gone.amphoe, gone.province].filter(function (x) { return !!x; }).join(' '));
        cusM.mode = 'list'; cusM.draft = newDraft(); renderModals(); viewEntry(); toast('ลบลูกค้าแล้ว');
      });
    }
  }

  /* ================= เชื่อมต่อฐานข้อมูล Supabase ================= */

  var SBKEY = 'bluestone-supabase';
  var SB = { url: '', key: '', client: null, status: 'ยังไม่ได้เชื่อมต่อ', busy: false, last: '',
             rev: '', conflict: false };

  var BSC = window.BS_CONFIG || {};
  SB.url = (BSC.url || '').trim();
  SB.key = (BSC.key || '').trim();
  try {
    var sbRaw = localStorage.getItem(SBKEY);
    if (sbRaw) {
      var sbCfg = JSON.parse(sbRaw);
      if (sbCfg.url) { SB.url = sbCfg.url; }
      if (sbCfg.key) { SB.key = sbCfg.key; }
    }
  } catch (eSB) { /* โหมดส่วนตัว ใช้งานต่อได้ */ }

  function sbSaveCfg() {
    try { localStorage.setItem(SBKEY, JSON.stringify({ url: SB.url, key: SB.key })); } catch (e) { /* ข้าม */ }
  }

  function sbConnect() {
    if (!SB.url || !SB.key) { SB.client = null; SB.status = 'ยังไม่ได้เชื่อมต่อ'; return null; }
    if (!window.supabase || !window.supabase.createClient) {
      SB.status = 'โหลดไลบรารี Supabase ไม่สำเร็จ'; return null;
    }
    try {
      SB.client = window.supabase.createClient(SB.url, SB.key);
      SB.status = 'เชื่อมต่อแล้ว';
      return SB.client;
    } catch (e2) {
      SB.client = null; SB.status = 'เชื่อมต่อไม่สำเร็จ: ' + e2.message; return null;
    }
  }

  function sbNow() {
    var d = new Date();
    return d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() +
      ':' + (d.getSeconds() < 10 ? '0' : '') + d.getSeconds();
  }

  /* ---- แปลงข้อมูลระหว่างรูปแบบในหน้าเว็บกับตารางในฐานข้อมูล ---- */
  function cusToRow(c) {
    return { id: c.id, name: c.name || '', tax_id: c.taxId || null, phone: c.phone || null,
             contact: c.contact || null, hno: c.hno || null, moo: c.moo || null, road: c.road || null,
             tambon: c.tambon || null, amphoe: c.amphoe || null, province: c.province || null,
             zip: c.zip || null, gps: c.gps || null, updated_at: new Date().toISOString() };
  }
  function rowToCus(r) {
    return { id: r.id, name: r.name || '', taxId: r.tax_id || '', phone: r.phone || '',
             contact: r.contact || '', hno: r.hno || '', moo: r.moo || '', road: r.road || '',
             tambon: r.tambon || '', amphoe: r.amphoe || '', province: r.province || '',
             zip: r.zip || '', gps: r.gps || '' };
  }
  function entToRow(e) {
    return { id: e.id, entry_date: e.date, kind: e.kind,
             amount: e.amount === undefined ? null : e.amount,
             note: e.note || null,
             cement_type: e.cementType || null,
             tons: e.tons === undefined ? null : e.tons,
             price: e.price === undefined ? null : e.price,
             who: e.who || null,
             trucks: e.trucks || null,
             updated_at: new Date().toISOString() };
  }
  function rowToEnt(r) {
    var e = { id: Number(r.id), date: r.entry_date, kind: r.kind };
    if (r.amount !== null && r.amount !== undefined) { e.amount = Number(r.amount); }
    if (r.note) { e.note = r.note; }
    if (r.cement_type) { e.cementType = r.cement_type; }
    if (r.tons !== null && r.tons !== undefined) { e.tons = Number(r.tons); }
    if (r.price !== null && r.price !== undefined) { e.price = Number(r.price); }
    if (r.who) { e.who = r.who; }
    if (r.trucks) { e.trucks = r.trucks; }
    return e;
  }

  /* ---- ดึงข้อมูลทั้งหมดลงมาทับของในเครื่อง ---- */
  function sbPull(cb) {
    var cl = SB.client || sbConnect();
    if (!cl) { if (cb) { cb(new Error(SB.status)); } return; }
    SB.busy = true; SB.status = 'กำลังดึงข้อมูล...';
    Promise.all([
      cl.from('app_settings').select('*').eq('id', 'default').maybeSingle(),
      cl.from('customers').select('*'),
      cl.from('entries').select('*').order('entry_date', { ascending: true }),
      cl.from('app_users').select('*'),
      cl.from('activity_log').select('*').order('at', { ascending: false }).limit(500)
    ]).then(function (res) {
      SB.busy = false;
      var err = null;
      res.forEach(function (x) { if (x && x.error && !err) { err = x.error; } });
      if (err) { SB.status = 'ดึงข้อมูลไม่สำเร็จ: ' + err.message; if (cb) { cb(err); } return; }
      var st = res[0].data;
      SB.rev = (st && st.updated_at) || '';
      SB.conflict = false;
      if (st) {
        if (st.rates && Object.keys(st.rates).length) {
          Object.keys(st.rates).forEach(function (k) { S.rates[k] = st.rates[k]; });
        }
        /* ฐานข้อมูลเป็นตัวตั้งเรื่องรหัสล็อก ถ้าที่นั่นยกเลิกแล้ว เครื่องนี้ต้องยกเลิกตาม */
        if (st.rates && !st.rates.lkH) { delete S.rates.lkH; delete S.rates.lkS; }
        if (st.names && Object.keys(st.names).length) {
          Object.keys(st.names).forEach(function (k) { S.names[k] = st.names[k]; });
        }
      }
      S.customers = (res[1].data || []).map(rowToCus);
      var ents = (res[2].data || []).map(rowToEnt);
      if (ents.length) { S.entries = ents; S.demo = false; }
      S.users = (res[3].data || []).map(function (u) {
        return { id: u.id, name: u.name, role: u.role || '', email: u.email || '' };
      });
      S.log = (res[4].data || []).slice().reverse().map(function (g) {
        return { t: g.at, who: g.who || '', role: g.role || '', act: g.act || '', detail: g.detail || '' };
      });
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e3) { /* ข้าม */ }
      SB.status = 'ดึงข้อมูลล่าสุดแล้ว ' + sbNow();
      SB.last = SB.status;
      if (cb) { cb(null); }
    }, function (e4) {
      SB.busy = false; SB.status = 'ดึงข้อมูลไม่สำเร็จ: ' + e4.message;
      if (cb) { cb(e4); }
    });
  }

  /* ---- ส่งข้อมูลในเครื่องขึ้นฐานข้อมูล ---- */
  /* ส่งขึ้นจริง ข้ามการตรวจเวอร์ชัน (ใช้ตอนผู้ใช้ยืนยันว่าจะทับ) */
  function sbPush(cb) { sbPushGo(cb, true); }

  /* ตรวจก่อนว่ามีคนอื่นแก้ข้อมูลหลังจากเราดึงล่าสุดไหม */
  function sbPushSafe(cb) {
    var cl = SB.client || sbConnect();
    if (!cl) { if (cb) { cb(new Error(SB.status)); } return; }
    cl.from('app_settings').select('updated_at').eq('id', 'default').maybeSingle()
      .then(function (res) {
        var cur = (res && res.data && res.data.updated_at) || '';
        if (SB.rev && cur && cur !== SB.rev) {
          SB.conflict = true;
          SB.status = 'มีคนอื่นแก้ข้อมูลหลังจากคุณดึงล่าสุด · กดดึงข้อมูลลงก่อน';
          sbBadge();
          if (cb) { cb(new Error(SB.status)); }
          return;
        }
        sbPushGo(cb, false);
      }, function () { sbPushGo(cb, false); });
  }

  function sbPushGo(cb, forced) {
    var cl = SB.client || sbConnect();
    if (!cl) { if (cb) { cb(new Error(SB.status)); } return; }
    SB.busy = true; SB.status = forced ? 'กำลังบันทึกทับขึ้นฐานข้อมูล...' : 'กำลังบันทึกขึ้นฐานข้อมูล...';
    /* ส่งขึ้นแบบ "เพิ่มและอัปเดต" เท่านั้น
       ไม่ลบแถวที่ไม่มีในเครื่องนี้ เพราะเครื่องนี้อาจมีข้อมูลเก่ากว่าของคนอื่น
       จะลบเฉพาะรายการที่ผู้ใช้กดลบเองจริง ๆ ซึ่งเก็บไว้ใน S.trash */
    var trash = { customers: (S.trash.customers || []).slice(),
                  users: (S.trash.users || []).slice(),
                  entries: (S.trash.entries || []).slice() };
    var jobs = [
      cl.from('app_settings').upsert({ id: 'default', rates: S.rates, names: S.names,
                                       updated_at: new Date().toISOString() }),
      cl.from('entries').upsert(S.entries.map(entToRow)),
      cl.from('customers').upsert(S.customers.map(cusToRow)),
      cl.from('app_users').upsert(S.users.map(function (u) {
        return { id: u.id, name: u.name, role: u.role || null, email: u.email || null,
                 updated_at: new Date().toISOString() };
      }))
    ];
    if (trash.entries.length) { jobs.push(cl.from('entries').delete().in('id', trash.entries)); }
    if (trash.customers.length) { jobs.push(cl.from('customers').delete().in('id', trash.customers)); }
    if (trash.users.length) { jobs.push(cl.from('app_users').delete().in('id', trash.users)); }

    Promise.all(jobs).then(function (res) {
      SB.busy = false;
      var err = null;
      res.forEach(function (x) { if (x && x.error && !err) { err = x.error; } });
      if (!err) {
        /* ลบสำเร็จแล้วจึงล้างถังขยะ ถ้าพลาดจะเก็บไว้ลองใหม่รอบหน้า */
        ['customers', 'users', 'entries'].forEach(function (k) {
          S.trash[k] = (S.trash[k] || []).filter(function (id) { return trash[k].indexOf(id) < 0; });
        });
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (eT) { /* ข้าม */ }
      }
      if (!err) {
        SB.conflict = false;
        cl.from('app_settings').select('updated_at').eq('id', 'default').maybeSingle()
          .then(function (q) { SB.rev = (q && q.data && q.data.updated_at) || SB.rev; }, function () {});
      }
      SB.status = err ? ('บันทึกไม่สำเร็จ: ' + err.message) : ('บันทึกขึ้นฐานข้อมูลแล้ว ' + sbNow());
      SB.last = SB.status;
      if (cb) { cb(err || null); }
    }, function (e5) {
      SB.busy = false; SB.status = 'บันทึกไม่สำเร็จ: ' + e5.message;
      if (cb) { cb(e5); }
    });
  }

  /* ---- ส่งประวัติหนึ่งบรรทัดขึ้นฐานข้อมูลทันที ---- */
  function sbLog(row) {
    var cl = SB.client;
    if (!cl) { return; }
    cl.from('activity_log').insert({ at: row.t, who: row.who, role: row.role, act: row.act, detail: row.detail })
      .then(function () { /* เงียบไว้ ไม่ขัดจังหวะผู้ใช้ */ }, function () { /* เช่นกัน */ });
  }

  /* ---- ส่งขึ้นอัตโนมัติหลังบันทึก หน่วงไว้กันยิงถี่ ---- */
  var sbTimer = null;
  function sbQueue() {
    if (!SB.client) { return; }
    if (sbTimer) { clearTimeout(sbTimer); }
    sbTimer = setTimeout(function () { sbTimer = null; sbPushSafe(function () { sbBadge(); }); }, 1500);
  }

  function sbBadge() {
    var n = el('sbStatus');
    if (n) { n.textContent = SB.status; }
    var h = el('sbHead');
    if (h) {
      h.textContent = SB.conflict ? 'มีคนอื่นแก้ข้อมูล' : (SB.client ? 'ออนไลน์' : 'ออฟไลน์');
      h.style.background = SB.conflict ? 'var(--bad-bg)' : (SB.client ? 'var(--ok-bg)' : 'var(--sunken)');
      h.style.color = SB.conflict ? 'var(--bad)' : (SB.client ? 'var(--ok)' : 'var(--muted)');
    }
  }

  /* ---- ล็อกหัวข้อ 7 ด้วยรหัส ----
     เก็บเฉพาะค่าแฮชทางเดียว (SHA-256 + salt) ไว้ใน S.rates.lkH / lkS
     ซึ่งซิงก์ขึ้นฐานข้อมูลพร้อมกับอัตราอื่น ทุกเครื่องจึงล็อกตามกันเอง
     นี่เป็นการกันการแก้โดยไม่ตั้งใจ ไม่ใช่ระบบความปลอดภัยเต็มรูปแบบ */
  var SBU = { open: false, armed: false };

  function sbLockOn() { return !!(S.rates && S.rates.lkH); }

  function sbSalt() {
    var a = 'abcdefghijklmnopqrstuvwxyz0123456789', s = '', i;
    for (i = 0; i < 12; i += 1) { s += a.charAt(Math.floor(Math.random() * a.length)); }
    return s;
  }

  function sbHashWeak(txt) {
    var h1 = 2166136261, h2 = 16777619, i, c;
    for (i = 0; i < txt.length; i += 1) {
      c = txt.charCodeAt(i);
      h1 = ((h1 ^ c) * 16777619) >>> 0;
      h2 = ((h2 + c * (i + 7)) * 2654435761) >>> 0;
    }
    return 'w1:' + ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8);
  }

  function sbHash(pw, salt) {
    var txt = 'bluestone|' + salt + '|' + pw;
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      try {
        return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt))
          .then(function (buf) {
            var a = Array.prototype.slice.call(new Uint8Array(buf));
            return 's2:' + a.map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
          }, function () { return sbHashWeak(txt); });
      } catch (err) { /* เบราว์เซอร์ไม่รองรับ ใช้วิธีสำรอง */ }
    }
    return Promise.resolve(sbHashWeak(txt));
  }

  function sbLockBar() {
    var on = sbLockOn();
    return '<hr style="border:0;border-top:1px solid var(--line-soft);margin:14px 0">' +
      '<div class="grid g2">' +
        '<div><label class="fl" for="sbNewPw">' + (on ? 'เปลี่ยนรหัสล็อกหัวข้อนี้' : 'ตั้งรหัสล็อกหัวข้อนี้') + '</label>' +
        '<input id="sbNewPw" type="password" autocomplete="new-password" placeholder="รหัสใหม่ อย่างน้อย 4 ตัว"></div>' +
        '<div><label class="fl" for="sbNewPw2">พิมพ์รหัสใหม่อีกครั้ง</label>' +
        '<input id="sbNewPw2" type="password" autocomplete="new-password" placeholder="ให้ตรงกับช่องซ้าย"></div>' +
      '</div>' +
      '<div class="actions" style="margin-top:12px">' +
        '<button type="button" class="btn pri" id="sbLockSet">' + (on ? 'เปลี่ยนรหัส' : 'ตั้งรหัสและล็อก') + '</button>' +
        (on ? '<button type="button" class="btn" id="sbLockNow">ล็อกทันที</button>' +
              '<button type="button" class="btn" id="sbLockOff">ยกเลิกการล็อก</button>' : '') +
      '</div>' +
      '<p class="hint" style="margin-top:8px">' + (on
        ? 'หัวข้อนี้ล็อกอยู่ · เก็บเฉพาะค่าแฮชของรหัส ไม่ได้เก็บตัวรหัสจริง และซิงก์ให้ทุกเครื่องเมื่อส่งข้อมูลขึ้น'
        : 'ตั้งรหัสแล้วเครื่องที่ดึงข้อมูลลงจะล็อกหัวข้อนี้ตามด้วย · พนักงานทั่วไปจะไม่เห็นค่าเชื่อมต่อและไม่มีปุ่มบันทึกทับ') + '</p>' +
      '<p class="hint" style="margin-top:4px">การล็อกนี้กันการกดแก้โดยไม่ตั้งใจและกันคนในที่ไม่เกี่ยวข้อง ไม่ใช่ระบบความปลอดภัยเต็มรูปแบบ · ' +
      'คนที่เปิดเครื่องมือพัฒนาของเบราว์เซอร์ยังอ่านค่าที่เก็บในเครื่องได้ · ' +
      'ด่านกันคนนอกจริง ๆ คือการเข้าสู่ระบบและ Row Level Security บนฐานข้อมูล</p>';
  }

  function bindSBLock() {
    if (el('sbUnlock')) {
      var go = function () {
        var pw = el('sbPw').value;
        if (!pw) { toast('กรอกรหัสก่อน'); return; }
        sbHash(pw, S.rates.lkS || '').then(function (h) {
          if (h === S.rates.lkH) {
            SBU.open = true; viewRates(); toast('ปลดล็อกหัวข้อฐานข้อมูลแล้ว');
          } else {
            el('sbPw').value = ''; el('sbPw').focus(); toast('รหัสไม่ถูกต้อง');
          }
        });
      };
      el('sbUnlock').addEventListener('click', go);
      el('sbPw').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); go(); }
      });
    }
    if (el('sbLockSet')) {
      el('sbLockSet').addEventListener('click', function () {
        var p1 = el('sbNewPw').value, p2 = el('sbNewPw2').value;
        if (p1.length < 4) { toast('รหัสสั้นเกินไป ใส่อย่างน้อย 4 ตัว'); return; }
        if (p1 !== p2) { toast('รหัสสองช่องไม่ตรงกัน'); return; }
        var salt = sbSalt(), first = !sbLockOn();
        sbHash(p1, salt).then(function (h) {
          S.rates.lkS = salt; S.rates.lkH = h;
          SBU.open = true; SBU.armed = false;
          save(); logIt(first ? 'ตั้งรหัสล็อกหัวข้อฐานข้อมูล' : 'เปลี่ยนรหัสล็อกหัวข้อฐานข้อมูล', 'หัวข้อ 7 ฐานข้อมูลกลาง');
          viewRates();
          toast(first ? 'ตั้งรหัสแล้ว · เปิดหน้านี้ใหม่จะต้องใส่รหัสก่อน' : 'เปลี่ยนรหัสแล้ว');
        });
      });
    }
    if (el('sbLockNow')) {
      el('sbLockNow').addEventListener('click', function () {
        SBU.open = false; SBU.armed = false; viewRates(); toast('ล็อกหัวข้อฐานข้อมูลแล้ว');
      });
    }
    if (el('sbLockOff')) {
      el('sbLockOff').addEventListener('click', function () {
        var b = el('sbLockOff');
        if (!SBU.armed) {
          SBU.armed = true;
          b.textContent = 'กดอีกครั้งเพื่อยืนยันการยกเลิก';
          b.classList.add('pri');
          toast('ยกเลิกแล้วทุกคนที่เปิดหน้านี้จะแก้ค่าเชื่อมต่อได้ · กดอีกครั้งถ้าแน่ใจ');
          return;
        }
        delete S.rates.lkH; delete S.rates.lkS;
        SBU.open = true; SBU.armed = false;
        save(); logIt('ยกเลิกรหัสล็อกหัวข้อฐานข้อมูล', 'หัวข้อ 7 ฐานข้อมูลกลาง');
        viewRates(); toast('ยกเลิกการล็อกแล้ว');
      });
    }
  }

  function sbSection() {
    if (sbLockOn() && !SBU.open) {
      return section(7, 'ฐานข้อมูลกลาง Supabase', 'หัวข้อนี้ล็อกไว้ด้วยรหัส เฉพาะผู้ดูแลระบบที่รู้รหัสจึงเปิดดูและแก้ค่าเชื่อมต่อได้',
        '<div class="grid g2">' +
          '<div><label class="fl" for="sbPw">รหัสผู้ดูแลระบบ</label>' +
          '<input id="sbPw" type="password" autocomplete="off" placeholder="กรอกรหัสเพื่อเปิดหัวข้อนี้"></div>' +
          '<div style="align-self:end"><div class="actions">' +
            '<button type="button" class="btn pri" id="sbUnlock">ปลดล็อก</button>' +
            '<span class="badge b-n" id="sbHead" style="align-self:center">ออฟไลน์</span>' +
          '</div></div>' +
        '</div>' +
        '<p class="note" id="sbStatus" style="margin-top:9px">' + esc(SB.status) + '</p>' +
        '<p class="hint" style="margin-top:6px">การส่งขึ้นและดึงข้อมูลลงอัตโนมัติยังทำงานตามปกติแม้หัวข้อนี้จะล็อกอยู่ · ' +
        'ปลดล็อกแล้วจะเปิดไว้จนกดล็อกทันทีหรือปิดหน้าเว็บ · ' +
        'ถ้าลืมรหัส ให้เปิดเว็บ Supabase ไปที่ Table editor ตาราง app_settings แถว default ' +
        'แล้วลบคีย์ lkH กับ lkS ออกจากช่อง rates จากนั้นกลับมากดดึงข้อมูลลงที่เครื่องนี้</p>');
    }
    return section(7, 'ฐานข้อมูลกลาง Supabase', 'เชื่อมต่อแล้วข้อมูลจะถูกเก็บบนฐานข้อมูล ทุกเครื่องที่เปิดเว็บนี้เห็นชุดเดียวกัน',
      '<div class="grid g2">' +
        '<div><label class="fl" for="sbUrl">Project URL</label>' +
        '<input id="sbUrl" type="text" value="' + esc(SB.url) + '" placeholder="https://xxxxxxxx.supabase.co"></div>' +
        '<div><label class="fl" for="sbKey">Publishable key หรือ Anon public key</label>' +
        '<input id="sbKey" type="text" value="' + esc(SB.key) + '" placeholder="sb_publishable_... หรือ eyJhbGciOi..."></div>' +
      '</div>' +
      '<div class="actions" style="margin-top:12px">' +
        '<button type="button" class="btn pri" id="sbSave">เชื่อมต่อและบันทึกค่า</button>' +
        '<button type="button" class="btn" id="sbUp">ส่งข้อมูลขึ้น</button>' +
        '<button type="button" class="btn" id="sbDown">ดึงข้อมูลลง</button>' +
        '<button type="button" class="btn" id="sbForce" title="ใช้เมื่อแน่ใจว่าข้อมูลในเครื่องนี้ใหม่กว่า">บันทึกทับ</button>' +
        '<span class="badge b-n" id="sbHead" style="align-self:center">ออฟไลน์</span>' +
      '</div>' +
      '<p class="note" id="sbStatus" style="margin-top:9px">' + esc(SB.status) + '</p>' +
      '<p class="hint" style="margin-top:6px">ใช้ publishable key (sb_publishable_...) หรือ anon public key เท่านั้น ห้ามใส่ service_role หรือ secret key เด็ดขาด · ' +
      'ค่าที่กรอกเก็บไว้ในเบราว์เซอร์เครื่องนี้ ไม่ได้ฝังลงในโค้ด · ' +
      'ถ้ามีคนอื่นแก้ข้อมูลหลังจากคุณดึงล่าสุด ระบบจะไม่ส่งทับให้เอง · ' +
      'สคริปต์สร้างตารางอยู่ในไฟล์ supabase/schema.sql ของโปรเจกต์</p>' + sbLockBar());
  }

  function bindSB() {
    bindSBLock();
    if (!el('sbSave')) { return; }
    el('sbSave').addEventListener('click', function () {
      SB.url = el('sbUrl').value.trim();
      SB.key = el('sbKey').value.trim();
      sbSaveCfg();
      if (sbConnect()) {
        toast('เชื่อมต่อฐานข้อมูลแล้ว กำลังดึงข้อมูล');
        sbPull(function (err) { sbBadge(); if (!err) { render(); } });
      } else { toast(SB.status); }
      sbBadge();
    });
    el('sbUp').addEventListener('click', function () {
      sbPushSafe(function (err) {
        sbBadge();
        if (err && SB.conflict) {
          toast('มีคนอื่นแก้ข้อมูลหลังจากคุณดึงล่าสุด · กด "ดึงข้อมูลลง" ก่อน');
          return;
        }
        toast(err ? SB.status : 'ส่งข้อมูลขึ้นฐานข้อมูลแล้ว');
      });
    });
    if (el('sbForce')) {
      el('sbForce').addEventListener('click', function () {
        sbPush(function (err) {
          sbBadge();
          toast(err ? SB.status : 'บันทึกทับขึ้นฐานข้อมูลแล้ว');
        });
      });
    }
    el('sbDown').addEventListener('click', function () {
      sbPull(function (err) { sbBadge(); if (!err) { render(); toast('ดึงข้อมูลล่าสุดลงมาแล้ว'); } else { toast(SB.status); } });
    });
    sbBadge();
  }


  /* ================= เราเตอร์ ================= */
  var VIEWS = { ledger: viewLedger, entry: viewEntry, shipping: viewShipping,
                rates: viewRates, export: viewExport };

  function render() {
    var name = (location.hash || '#ledger').replace('#', '');
    if (!VIEWS[name]) { name = 'ledger'; }
    Object.keys(VIEWS).forEach(function (k) { el('v-' + k).hidden = (k !== name); });
    Array.prototype.forEach.call(el('nav').querySelectorAll('a'), function (a) {
      if (a.getAttribute('href') === '#' + name) { a.setAttribute('aria-current', 'page'); } else { a.removeAttribute('aria-current'); }
    });
    VIEWS[name]();
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);

  renderWho();
  render();

  if (SB.url && SB.key) {
    sbConnect();
    if (SB.client) {
      SB.client.auth.getSession().then(function (r) {
        var has = r && r.data && r.data.session;
        if (!has) { location.replace('login.html'); return; }
        SB.email = r.data.session.user ? r.data.session.user.email : '';
        renderWho();
        sbPull(function (err) { sbBadge(); if (!err) { render(); } });
      }, function () {
        sbPull(function (err) { sbBadge(); if (!err) { render(); } });
      });
    }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* ข้ามไป */ });
    });
  }
})();

</script>
