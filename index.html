<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- มุมมองเว็บเต็มบนมือถือ: หน้าเรนเดอร์ที่ความกว้าง 1180 แล้วมือถือย่อให้พอดีจอ ซูมสองนิ้วได้ -->
<meta name="viewport" content="width=1180,viewport-fit=cover">
<meta name="theme-color" content="#2a3b96">
<title>Blue Stone Import · ระบบคุมการตัดเงินและบันทึกปูนเข้า</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BS Import">

</head>
<body>
<title>Blue Stone คุมการตัดเงิน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,0..1,0&display=block">
<style>
/* Layout: app shell — navy bar + tab nav, one content column max 1180, ledger tables scroll inside their own box */
:root{
  --page:#f0f0f8; --card:#ffffff; --sunken:#e8e8f4; --field:#f5f5fd;
  --brand:#2a3b96; --deep:#0b1c57; --mid:#3a46ad; --accent:#5a4fd6;
  --tint:#e4e4fb; --tint-weak:#f3f3fd;
  --ink:#16183a; --head:#0b1c57; --muted:#5d5d7e; --faint:#716f93; --on-brand:#ffffff;
  --line:#d7d6e8; --line-soft:#e9e9f4; --line-field:#c8c6e2;
  --grad:linear-gradient(155deg,#0b1c57 0%,#2a3b96 45%,#7b5ad0 100%);
  --shadow:0 1px 2px rgba(16,14,70,.05),0 10px 28px rgba(16,14,70,.06);
  --ok:#0a5c3e; --ok-bg:#f1f9f5; --ok-bd:#a9d4bf;
  --warn:#8a5300; --warn-bg:#fdf6ea; --warn-bd:#e8c99a;
  --bad:#b3261e; --bad-bg:#fdf2f1; --bad-bd:#e3a6a1;
  --ring:#5a4fd6;
  --ui:'IBM Plex Sans Thai','Segoe UI',system-ui,-apple-system,sans-serif;
  --num:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0b0b1c; --card:#14152b; --sunken:#0e0f22; --field:#1b1c38;
    --brand:#4451c2; --deep:#161b4e; --mid:#2e3a8f; --accent:#8e85ee;
    --tint:#1f2048; --tint-weak:#171833;
    --ink:#e9e8f6; --head:#dcdcf8; --muted:#a0a0c0; --faint:#8481a6; --on-brand:#ffffff;
    --line:#282a4a; --line-soft:#1f2040; --line-field:#363860;
    --grad:linear-gradient(155deg,#0a0f33 0%,#232c7a 45%,#5a4fd6 100%);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.25);
    --ok:#5fd3a6; --ok-bg:#10291f; --ok-bd:#2e6b4e;
    --warn:#e0a33f; --warn-bg:#2a2008; --warn-bd:#6b5420;
    --bad:#f08a82; --bad-bg:#2e1513; --bad-bd:#74322c;
    --ring:#8e85ee;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0a1020; --card:#121b2e; --sunken:#0d1526; --field:#19233c;
  --brand:#2b57b5; --deep:#132a63; --mid:#1b3f8f; --accent:#6c9bf0;
  --tint:#1b2a4c; --tint-weak:#151f37;
  --ink:#e8edf8; --head:#dce6fa; --muted:#9aa9c4; --faint:#7d8ca8; --on-brand:#ffffff;
  --line:#26314a; --line-soft:#1d2740; --line-field:#32415f;
  --grad:linear-gradient(160deg,#0a1a40 0%,#132a63 50%,#2b57b5 100%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.25);
  --ok:#5fd3a6; --ok-bg:#10291f; --ok-bd:#2e6b4e;
  --warn:#e0a33f; --warn-bg:#2a2008; --warn-bd:#6b5420;
  --bad:#f08a82; --bad-bg:#2e1513; --bad-bd:#74322c;
  --ring:#8e85ee;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--deep)}
.num,td.n,th.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:19px;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;
  font-variation-settings:'opsz' 24;-webkit-font-feature-settings:'liga';user-select:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---- app bar ---- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--grad);color:var(--on-brand);
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
.bar-in{max-width:1180px;margin:0 auto;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:18px;min-height:64px}
.brandmark{display:flex;align-items:center;gap:11px;min-width:0}
.brandmark img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:10px;padding:3px;flex:0 0 auto;
  box-shadow:0 2px 8px rgba(0,0,0,.18)}
.brandmark b{display:block;font-size:14.5px;font-weight:700;letter-spacing:.1em;white-space:nowrap;line-height:1.3}
.brandmark small{display:block;font-size:10.5px;font-weight:400;letter-spacing:0;color:#c6c2f2;white-space:nowrap}
nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;min-width:0}
nav a{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 11px;border-radius:var(--r-md);
  color:#d2cef7;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
nav a .ms{font-size:18px;opacity:.9}
nav a:hover{background:rgba(255,255,255,.12)}
nav a[aria-current="page"]{background:#fff;color:var(--deep);font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.14)}
nav a[aria-current="page"] .ms{opacity:1}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#dedaf9}
.who span.av{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  background:var(--accent);color:#fff;font-weight:600}
.tbtn{min-height:34px;padding:0 10px;border:1px solid rgba(255,255,255,.35);border-radius:var(--r-md);
  background:transparent;color:#fff;font-family:inherit;font-size:12px;cursor:pointer}

/* ---- shell ---- */
main{max-width:1180px;margin:0 auto;padding-block:22px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0 0 6px;font-size:25px;line-height:1.45;font-weight:700;color:var(--head);text-wrap:balance}
h2{margin:0;font-size:16.5px;line-height:1.55;font-weight:700;color:var(--head)}
h3{margin:0;font-size:14px;line-height:1.55;font-weight:700;color:var(--head)}
p{margin:0}
.lede{color:var(--muted);font-size:13.5px;max-width:72ch}
.head-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:14px}
.head-row>div:first-child{flex:1 1 320px;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.card-h>div:first-child{flex:1 1 220px;min-width:0}
.card-b{padding:18px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g4{grid-template-columns:minmax(0,1fr)}}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);color:var(--muted);
  font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--tint-weak)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.sec{border-color:var(--brand);color:var(--brand)}
.btn.sm{min-height:36px;padding:0 12px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.fl{display:block;margin-bottom:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=password],input[type=date],select,textarea{width:100%;min-height:44px;padding:0 11px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--card);color:var(--ink);font-family:inherit;font-size:13.5px}
textarea{padding:10px 11px;min-height:70px;line-height:1.6;resize:vertical}
input.n{background:var(--field);border-color:var(--line-field);text-align:right;font-family:var(--num);
  font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px}
input.n.sm{min-height:38px;border-radius:var(--r-sm);font-size:13.5px}
input.warnf{background:var(--warn-bg);border-color:var(--warn-bd)}
.hint{margin-top:5px;font-size:11.5px;color:var(--muted)}
.hint.w{color:var(--warn);font-weight:600}

fieldset{margin:0;padding:0;border:0;min-width:0}
legend{padding:0 0 6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 14px;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);color:var(--muted);
  font-size:13.5px;font-weight:600;cursor:pointer}
.seg.fill label{flex:1 1 0;min-width:0;text-align:center}
.seg input{accent-color:var(--brand);width:15px;height:15px;margin:0}
.seg label:has(input:checked){border-color:var(--brand);background:var(--tint);color:var(--head)}
.chk{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--r-md);cursor:pointer}
.chk input{accent-color:var(--brand);width:17px;height:17px;margin-top:3px;flex:0 0 auto}
.chk b{display:block;font-size:13.5px;font-weight:600}
.chk em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.chk:has(input:checked){border-color:var(--brand);background:var(--tint-weak)}

.tbox{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.card,.card-b,.stack>*{min-width:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:10px 11px;text-align:left}
thead th{background:var(--brand);color:#fff;font-weight:600;white-space:nowrap}
thead th.d{background:var(--deep)}
thead th.m{background:var(--mid)}
thead th.sub{font-weight:500;color:#cfcbf4}
.n{text-align:right}
.c{text-align:center}
tbody tr{border-bottom:1px solid var(--line-soft)}
tbody td{vertical-align:top}
tfoot tr{background:var(--sunken);border-top:2px solid var(--brand)}
tfoot th,tfoot td{font-weight:700;color:var(--head);padding:12px 11px}
.sep{border-right:2px solid var(--card)}
tbody .sep,tfoot .sep{border-right:2px solid var(--line-soft)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.pos{color:var(--ok);font-weight:600}
.neg{color:var(--bad);font-weight:600}
.str{font-weight:600}

.badge{display:inline-block;padding:2px 9px;border-radius:var(--r-pill);font-size:10.5px;font-weight:600;
  white-space:nowrap;font-family:var(--ui)}
.b-n{background:var(--sunken);color:var(--muted)}
.b-i{background:var(--tint);color:var(--brand)}
.b-s{background:var(--ok-bg);color:var(--ok)}
.b-w{background:var(--warn-bg);color:var(--warn)}
.b-d{background:var(--bad-bg);color:var(--bad)}

.kpi .t{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.kpi .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:29px;line-height:1.25;font-weight:600;color:var(--head)}
.kpi .u{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.track{height:7px;border-radius:var(--r-pill);background:var(--tint);overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent)}
.track.w{background:var(--warn-bg)}
.track.w>i{background:var(--warn)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px;font-size:12.5px}
.dl dt{color:var(--muted);margin:0}
.dl dd{margin:1px 0 0;font-weight:600;font-family:var(--num);font-variant-numeric:tabular-nums}
.foot-line{margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft);font-size:12.5px;font-weight:600}

.alert{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;border:1px solid;border-radius:var(--r-lg);padding:14px 16px}
.alert svg,.alert .ms{flex:0 0 auto;margin-top:1px}
.alert .ms{font-size:23px}
.alert .bd{flex:1 1 240px;min-width:0}
.alert .bd b{display:block;font-size:14px;margin-bottom:2px}
.alert .bd p{font-size:13px;color:var(--ink)}
.a-w{background:var(--warn-bg);border-color:var(--warn-bd)} .a-w b{color:var(--warn)}
.a-s{background:var(--ok-bg);border-color:var(--ok-bd)} .a-s b{color:var(--ok)}
.a-d{background:var(--bad-bg);border-color:var(--bad-bd)} .a-d b{color:var(--bad)}
.a-i{background:var(--tint);border-color:var(--accent)} .a-i b{color:var(--brand)}

.note{font-size:11.5px;color:var(--muted)}
.demo{display:inline-block;padding:3px 10px;border-radius:var(--r-pill);background:var(--tint);color:var(--brand);
  font-size:11.5px;font-weight:600}
.secnum{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:var(--brand);color:#fff;font-size:13px;font-weight:700;flex:0 0 auto}
pre.out{margin:0;max-height:260px;overflow:auto;padding:12px;background:var(--sunken);border:1px solid var(--line);
  border-radius:var(--r-md);font-family:var(--num);font-size:11.5px;line-height:1.7;white-space:pre;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  z-index:40;background:var(--deep);color:#fff;padding:11px 18px;border-radius:var(--r-pill);font-size:13px;font-weight:600;
  box-shadow:0 10px 28px rgba(14,12,60,.3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* พิมพ์รายงาน ซ่อนเมนูและปุ่ม เหลือเฉพาะเนื้อรายงาน */
@media print{
  .no-print,nav,#nav,.topbar,.toast{display:none !important}
  .only-print{display:block !important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none !important;border:1px solid #ccc !important}
  table{font-size:10px}
}

/* ---------- จอใส่ PIN ชั้นที่ 2 ----------
   หน้านี้ตั้ง viewport ไว้ที่ 1180 จุด มือถือจึงย่อทั้งหน้าลงราวหนึ่งในสาม
   ถ้าใช้ขนาดเดียวกับจอคอม ปุ่มบนมือถือจะเล็กจนกดยาก
   จึงแยกขนาดด้วย pointer:coarse คือจอสัมผัส ให้ใหญ่ขึ้นประมาณสองเท่าครึ่ง */
.rl-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:18px 0}
.rl-card{width:100%;max-width:356px;border-radius:24px;padding:28px 22px 22px;
  background:var(--grad);color:#fff;text-align:center;box-shadow:0 24px 56px rgba(5,10,40,.30)}
.rl-ico{width:72px;height:72px;border-radius:50%;margin:0 auto;background:rgba(255,255,255,.14);
  border:3px solid #5a4fd6;display:flex;align-items:center;justify-content:center}
.rl-ico svg{width:30px;height:30px}
.rl-h{margin:14px 0 0;font-size:20px;color:#fff}
.rl-sub{margin:7px auto 0;font-size:12.5px;color:#c9d8f6;max-width:30ch;line-height:1.75}
.rl-dots{display:flex;gap:12px;justify-content:center;margin:16px 0 6px}
.rl-dot{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.22)}
.rl-dot.on{background:#fff}
.rl-note{margin:4px 0 14px;font-size:11px;color:#9fb6e4}
.rl-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rl-key{height:60px;border-radius:16px;cursor:pointer;color:#fff;font-family:inherit;font-weight:600;
  font-size:23px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18)}
.rl-key.fn{background:transparent;font-size:14px}
.rl-back{background:none;border:0;color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.rl-foot{margin:16px 0 0;font-size:12.5px}
.rl-help{margin:10px 0 0;font-size:10.5px;color:#9fb6e4;line-height:1.7}
@media (pointer:coarse){
  .rl-wrap{min-height:80vh;padding:30px 0}
  .rl-card{max-width:880px;border-radius:54px;padding:66px 52px 52px}
  .rl-ico{width:176px;height:176px;border-width:7px}
  .rl-ico svg{width:74px;height:74px}
  .rl-h{margin-top:32px;font-size:48px}
  .rl-sub{margin-top:18px;font-size:29px;max-width:26ch}
  .rl-dots{gap:28px;margin:36px 0 14px}
  .rl-dot{width:30px;height:30px}
  .rl-note{margin-bottom:34px;font-size:25px}
  .rl-pad{gap:24px}
  .rl-key{height:136px;border-radius:36px;font-size:52px}
  .rl-key.fn{font-size:31px}
  .rl-foot{margin-top:36px;font-size:30px}
  .rl-help{margin-top:24px;font-size:23px}
}
</style>

<header class="appbar">

  function jBagPerBag(rr) {

    var n = bagPerTon(o);
    return n > 0 ? num(o.jBag) / n : 0;
  }

  function laneOf(type, nation) {
    return type === 'bag' ? (nation === 'lao' ? 'bLao' : 'bThai') : (nation === 'lao' ? 'pLao' : 'pThai');
  }

  function costOf(type) { var r = S.rates; return type === 'powder' ? r.fPowder : r.fBag; }

  /* รายการที่ปิดงวดแล้วจะพกอัตราของตัวเองไว้ แก้อัตราวันนี้ไม่กระทบยอดเก่า */
  function ratesFor(e) {
    if (!e || !e.rates) { return S.rates; }
    var o = {}, k;
    for (k in S.rates) { if (Object.prototype.hasOwnProperty.call(S.rates, k)) { o[k] = S.rates[k]; } }
    for (k in e.rates) { if (Object.prototype.hasOwnProperty.call(e.rates, k)) { o[k] = e.rates[k]; } }
    /* งวดที่ปิดก่อนมีค่าขนส่งและประกันฝั่งลาว ต้องไม่ถูกบวกย้อนหลัง ยอดเก่าจะได้ไม่ขยับ */
    if (e.rates.frPowder === undefined) { o.frPowder = 0; o.frBag = 0; }
    return o;
  }
  function isLocked(date) { return !!(S.lockUpto && date && date <= S.lockUpto); }

  function compute() {
    var r = S.rates;
    var list = S.entries.filter(function (e) { return e.kind !== 'bin'; }).sort(function (a, b) {
      if (a.date === b.date) { return a.id - b.id; }
      return a.date < b.date ? -1 : 1;
    });

    var mode = r.tierCount || 'set';
    var rdDecl = {};
    list.forEach(function (e) {
      if (e.kind === 'round') { rdDecl[e.id] = num(e.trucks && e.trucks.fdTrucks); }
    });
    function cntKey(date, ty, na, rid) {
      /* นับแยกตามชุด: รถที่ผูกกับชุดนำเข้านับเฉพาะในชุดเดียวกัน รถเก่าที่ไม่มีชุดนับตามวันและชนิดเหมือนเดิม */
      if (mode === 'set') { return (rid && rdDecl[rid] !== undefined) ? 'R' + rid : date + '|' + ty; }
      if (mode === 'all') { return date; }
      if (mode === 'type') { return date + '|' + ty; }
      return date + '|' + laneOf(ty, na);
    }
    var perDay = {};
    list.forEach(function (e) {
      if (e.kind !== 'import') { return; }
      e.trucks.forEach(function (t) {
        var k = cntKey(e.date, t.type || 'powder', t.nation || 'thai', t.round);
        perDay[k] = (perDay[k] || 0) + 1;
      });
    });

    var fBal = 0, jBal = 0, crBal = {}, stock = { powder: 0, bag: 0 }, rows = [];
    var T = { fIn: 0, jIn: 0, fCut: 0, jCut: 0, inTons: 0, inTonsThai: 0, loss: 0, trucks: 0, ship: 0, shipThai: 0, scan: 0,
              inPowder: 0, inBag: 0, soldPowder: 0, soldBag: 0, revBuyer: 0, revOther: 0, soldCost: 0, negStock: false,
              crIn: {}, crCut: {} };

    list.forEach(function (e) {
      /* รอบนำเข้าเป็นข้อมูลเอกสาร ไม่ใช่รายการเงิน จึงข้ามไป
         ส่วนการจ่ายปูนออกจากโกดังถือเป็นการขาย จึงคิดเป็นรายได้ด้วย */
      if (e.kind === 'round') { return; }
      var r = ratesFor(e);               /* ทับตัวแปรด้านนอกเฉพาะในรอบนี้ */
      var w = { e: e, date: e.date, tons: 0, tonsThai: 0, loss: 0, trucks: 0, fRate: null, fAmt: 0,
                jRate: null, jAmt: 0, fIn: 0, jIn: 0, ship: 0, shipThai: 0, scan: 0, tier: 0, shipRate: 0,
                rev: 0, stockDelta: 0 };

      if (e.kind === 'depositF') { w.fIn = e.amount || 0; T.fIn += w.fIn; }
      if (e.kind === 'depositJ') {
        w.jIn = e.amount || 0; T.jIn += w.jIn;
        w.cid = crOf(e);
        if (w.cid) { T.crIn[w.cid] = (T.crIn[w.cid] || 0) + w.jIn; }
      }

      if (e.kind === 'import') {
        w.trucks = e.trucks.length;
        w.plates = e.trucks.map(function (t) { return t.plateThai || t.plateLao || t.plate || '—'; });
        w.items = [];
        var byType = { powder: 0, bag: 0 };
        var byTypeL = { powder: 0, bag: 0 };
        var fByType = { powder: 0, bag: 0 };

        e.trucks.forEach(function (t, k) {
          var tnL = num(t.lao.tons);
          var tnT = num(t.thai.tons);
          var tn = tnL;
          var ty = t.type || 'powder';
          var na = t.nation || 'thai';
          var lane = laneOf(ty, na);
          var cnt = perDay[cntKey(e.date, ty, na, t.round)] || 1;
          if (mode === 'set' && t.round && rdDecl[t.round] > 0) { cnt = rdDecl[t.round]; }
          var idx = Math.min(Math.max(cnt, 1), 5) - 1;
          /* บิลชิปปิ้งลาวคิดจากน้ำหนักตามเอกสารของชุด (dt) ถ้าเป็นรถเก่าที่ไม่มีชุดใช้น้ำหนักฝั่งลาวเหมือนเดิม */
          var frR = ty === 'powder' ? num(r.frPowder) : num(r.frBag);
          var tnS = num(t.dt) > 0 ? num(t.dt) : tnL;
          var fR = ty === 'powder' ? r.fPowder : r.fBag;
          var sR = r.tiers[lane][idx];
          var tTruck = ty === 'powder' ? num(r.tPowder) : num(r.tBag);
          var tTon = num(r.truckTon) > 0 ? tTruck / num(r.truckTon) : 0;
          var tAmt = (r.thaiBasis === 'ton') ? tTon * tnT : tTruck;
          var item = { seq: k + 1, lao: t.lao, thai: t.thai, dest: t.dest || '',
                       destId: t.destId || '', brand: t.brand || '',
                       plateLao: (t.lao.plate || '').trim(), plateThai: (t.thai.plate || '').trim(),
                       /* คันที่ยังไม่ได้ชั่งฝั่งไทย ยังไม่นับเป็นน้ำหนักสูญเสีย */
                       tons: tnL, tonsThai: tnT, loss: tnT > 0 ? tnL - tnT : 0,
                       type: ty, nation: na, lane: lane,
                       tier: Math.min(cnt, 5), count: cnt,
                       fRate: fR, fAmt: fR * tnL,
                       shipRate: sR + frR, tierRate: sR, freightRate: frR, shipTons: tnS,
                       shipAmt: (sR + frR) * tnS, freightAmt: frR * tnS, scan: t.scan ? r.scanner : 0,
                       thaiRateTruck: tTruck, thaiRateTon: tTon, thaiAmt: tAmt };
          w.items.push(item);
          w.tons += tnL; w.tonsThai += tnT; w.loss += item.loss;
          w.fAmt += item.fAmt; w.ship += item.shipAmt; w.scan += item.scan; w.shipThai += item.thaiAmt;
          byType[ty] += tnT;
          byTypeL[ty] += tnL;
          fByType[ty] += item.fAmt;
          stock[ty] += tnT;
          T.inTons += tnL; T.inTonsThai += tnT; T.loss += item.loss;
          T.ship += item.shipAmt; T.shipThai += item.thaiAmt;
          if (ty === 'powder') { T.shipThaiP = (T.shipThaiP || 0) + item.thaiAmt; }
          else { T.shipThaiB = (T.shipThaiB || 0) + item.thaiAmt; }
          T.freight = (T.freight || 0) + item.freightAmt;
          T.shipTons = (T.shipTons || 0) + tnS;
          if (ty === 'powder') { T.inPowder += tnT; } else { T.inBag += tnT; }
        });

        w.byType = byType;
        w.byTypeL = byTypeL;
        w.fByType = fByType;
        w.mixed = byType.powder > 0 && byType.bag > 0;
        w.fRate = w.mixed ? null : (byType.bag > 0 ? r.fBag : r.fPowder);
        w.shipRate = w.items.length ? w.items[0].shipRate : 0;
        w.tier = w.items.length ? w.items[0].tier : 0;
        w.stockDelta = w.tonsThai;
        T.fCut += w.fAmt; T.trucks += w.trucks; T.scan += w.scan;
      }

      if (e.kind === 'whOut' || e.kind === 'pwOut') {
        var wp = e.trucks || {};
        var wBags = num(wp.bags);
        w.tons = num(e.tons) || wBags / 20;
        w.jRate = e.kind === 'pwOut' ? num(e.price)
                                     : (w.tons > 0 ? (num(e.price) * wBags) / w.tons : 0);
        /* ระบบนี้คุมเฉพาะการนำเข้าและการตัดสตอกออก ไม่คิดรายได้
           รายการตัดสตอกจึงไม่ถูกนับเป็นยอดขาย ต้นทุนขาย หรือกำไรในหน้าใดเลย
           เว้นแต่ถ้าระบุว่าขายให้ผู้ซื้อที่วางเงินล่วงหน้า ยังต้องตัดเครดิตของผู้ซื้อตามเดิม เพราะเป็นเรื่องคุมเงิน */
        w.outAmt = e.kind === 'pwOut' ? num(e.price) * w.tons : num(e.price) * wBags;
        w.rev = 0;
        w.stockDelta = -w.tons;
        stock[e.cementType || 'bag'] -= w.tons;
        w.cid = crOf(e);
        if (w.cid) { w.jAmt = w.outAmt; T.jCut += w.jAmt; T.crCut[w.cid] = (T.crCut[w.cid] || 0) + w.jAmt; }
      }

      if (e.kind === 'saleBuyer' || e.kind === 'saleOther') {
        w.tons = num(e.tons);
        w.jRate = num(e.price);
        w.rev = w.jRate * w.tons;
        w.stockDelta = -w.tons;
        stock[e.cementType] -= w.tons;
        if (stock[e.cementType] < -0.001) { w.short = true; T.negStock = true; }
        if (e.kind === 'saleBuyer') {
          w.cid = crOf(e);
          w.jAmt = w.rev; T.jCut += w.jAmt; T.revBuyer += w.rev;
          if (w.cid) { T.crCut[w.cid] = (T.crCut[w.cid] || 0) + w.jAmt; }
        }
        else { T.revOther += w.rev; }
        if (e.cementType === 'powder') { T.soldPowder += w.tons; } else { T.soldBag += w.tons; }
        T.soldCost += costOf(e.cementType) * w.tons;
      }

      fBal = fBal + w.fIn - w.fAmt;
      jBal = jBal + w.jIn - w.jAmt;
      w.fBal = fBal;
      if (w.cid) {
        crBal[w.cid] = (crBal[w.cid] || 0) + w.jIn - w.jAmt;
        w.jBal = crBal[w.cid];
      } else { w.jBal = null; }
      w.stockP = stock.powder; w.stockB = stock.bag;
      rows.push(w);
    });

    var revenue = T.revBuyer + T.revOther;
    var grossBeforeShip = revenue - T.soldCost;

    return {
      rows: rows, T: T, fBal: fBal, jBal: jBal, crBal: crBal, stock: stock,
      shipTotal: T.ship + T.scan + T.shipThai,
      shipLaoTotal: T.ship + T.scan,
      revenue: revenue, grossBeforeShip: grossBeforeShip,
      gross: grossBeforeShip - (T.ship + T.scan),
      capF: r.fPowder > 0 ? fBal / r.fPowder : 0,
      capJ: r.jPowder > 0 ? jBal / r.jPowder : 0
    };
  }

  /* ================= หน้า 1 · คุมการตัดเงิน ================= */
  var mf = { open: false, kind: 'depositF', date: '2026-11-03', amount: '', note: '', cid: '' };
  var periodSel = 'all';

  function moneyPanel(c) {
    if (!mf.open) { return ''; }
    var amt = num(mf.amount);
    var isF = mf.kind === 'depositF';
    if (!isF && !crFind(mf.cid)) { mf.cid = (crOn()[0] || crFirst() || {}).id || ''; }
    var mCur = isF ? c.fBal : num(c.crBal[mf.cid]);
    var after = mCur + amt;
    function opt(id, label) {
      var on = mf.kind === id;
      return '<label style="flex:1 1 0;min-width:0;justify-content:center" class="' + (on ? 'seg-on' : '') + '">' +
        '<input type="radio" name="mk" value="' + id + '"' + (on ? ' checked' : '') + ' data-mk="' + id + '">' +
        '<span>' + esc(label) + '</span></label>';
    }
    return '<section class="card" style="margin-bottom:14px;border-color:var(--brand)">' +
      '<div class="card-h"><span class="ms" aria-hidden="true" style="font-size:20px;color:var(--brand)">payments</span>' +
      '<div><h2>บันทึกรายการเงิน</h2><p class="note">เงินโอนเข้าโรงงาน และเงินรับล่วงหน้าจากผู้ซื้อ</p></div>' +
      '<button type="button" class="btn sm" id="mClose" ' +
      'style="border:1.5px solid var(--brand);color:var(--brand);font-weight:700">ปิด</button></div>' +
      '<div class="card-b stack">' +
        '<fieldset><legend>ประเภทรายการเงิน</legend><div class="seg fill">' +
          opt('depositF', 'โอนเงินเข้า ' + nm.factory) + opt('depositJ', 'รับเงินจากคู่ค้าวางเงินล่วงหน้า') +
        '</div></fieldset>' +
        (isF ? '' : '<div class="grid g3">' + crSelect('mCid', mf.cid, 'รับเงินจากคู่ค้ารายไหน') +
          '<div style="grid-column:span 2;align-self:end"><p class="hint" style="margin:0">' +
          'เงินก้อนนี้จะไปเพิ่มเครดิตของรายที่เลือก · เพิ่มรายใหม่ได้ที่หน้าตั้งค่าอัตรา</p></div></div>') +
        '<div class="grid g3">' +
          '<div><span class="fl">วันที่</span>' +
          dtField('mDate', mf.date, false, 'data-mf="date"') + '</div>' +
          '<div><label class="fl" for="mAmt">จำนวนเงิน (บาท)</label>' +
          '<input id="mAmt" class="n" type="text" inputmode="decimal" placeholder="0.00" value="' + esc(mf.amount) + '" data-mf="amount"></div>' +
          '<div><label class="fl" for="mNote">หมายเหตุ</label>' +
          '<input id="mNote" type="text" placeholder="ไม่กรอกก็ได้ ระบบจะใส่วันที่ให้" value="' + esc(mf.note) + '" data-mf="note"></div>' +
        '</div>' +
        '<div class="alert a-i"><div class="bd"><p>' +
          (isF ? 'เพิ่มเฉพาะยอดที่' + esc(nm.factory) : 'เพิ่มเฉพาะยอดรับล่วงหน้าของ ' + esc(crName(mf.cid) || 'คู่ค้ารายนี้')) +
          ' จาก <b class="num">' + m2(mCur) + '</b> เป็น <b class="num">' + m2(after) + '</b> บาท' +
        '</p></div></div>' +
        '<div class="actions" style="justify-content:flex-end">' +
          '<button type="button" class="btn" id="mCancel">ยกเลิก</button>' +
          '<button type="button" class="btn pri" id="mSave">บันทึกรายการเงิน</button>' +
        '</div>' +
      '</div></section>';
  }

  function bindMoney() {
    if (!mf.open) { return; }
    Array.prototype.forEach.call(el('v-ledger').querySelectorAll('[data-mk]'), function (inp) {
      inp.addEventListener('change', function () { mf.kind = inp.getAttribute('data-mk'); viewLedger(); });
    });
    Array.prototype.forEach.call(el('v-ledger').querySelectorAll('[data-mf]'), function (inp) {
      var k = inp.getAttribute('data-mf');
      var ev = (inp.type === 'date' || inp.type === 'hidden') ? 'change' : 'input';
      inp.addEventListener(ev, function () {
        mf[k] = inp.value;
        if (k === 'amount') { viewLedger(); }
      });
    });
    if (el('mCid')) {
      el('mCid').addEventListener('change', function () { mf.cid = el('mCid').value; viewLedger(); });
    }
    el('mClose').addEventListener('click', function () { mf.open = false; viewLedger(); });
    el('mCancel').addEventListener('click', function () { mf.open = false; viewLedger(); });
    el('mSave').addEventListener('click', function () {
      var a = num(mf.amount);
      if (a <= 0) { toast('กรุณาใส่จำนวนเงิน'); return; }
      var nid = S.entries.reduce(function (m, e) { return Math.max(m, e.id); }, 0) + 1;
      S.entries.push({ id: nid, date: mf.date, kind: mf.kind, amount: a, note: mf.note || '',
                       trucks: mf.kind === 'depositJ' ? { cid: mf.cid } : null });
      var kindTxt = (mf.kind === 'depositF' ? 'โอนให้' + nm.factory : 'รับเงินจาก ' + nm.buyer);
      mf.amount = ''; mf.note = ''; mf.open = false;
      S.demo = false; save();
      logIt('บันทึกรายการเงิน', kindTxt + ' ' + m2(a) + ' บาท · ' + thDate(mf.date));
      viewLedger(); toast('บันทึกรายการเงินแล้ว');
    });
  }

  function viewLedger() {
    var c = compute(), r = S.rates, T = c.T;
    var tightJ = c.capJ < c.capF;
    var months = [];
    c.rows.forEach(function (w) { var k = monthKey(w.date); if (months.indexOf(k) < 0) { months.push(k); } });
    months.sort();
    if (periodSel !== 'all' && months.indexOf(periodSel) < 0) { periodSel = 'all'; }
    var shown = periodSel === 'all' ? c.rows : c.rows.filter(function (w) { return monthKey(w.date) === periodSel; });
    var opening = null;
    if (periodSel !== 'all') {
      var before = c.rows.filter(function (w) { return monthKey(w.date) < periodSel; });
      opening = before.length ? before[before.length - 1] : { fBal: 0, jBal: 0 };
    }

    var lowMsgs = [];
    if (num(r.warnF) > 0 && c.fBal < num(r.warnF)) {
      lowMsgs.push('เครดิตที่' + nm.factory + ' เหลือ ' + m2(c.fBal) + ' บาท ต่ำกว่าที่ตั้งเตือนไว้ ' + m2(num(r.warnF)));
    }
    crCards(c).forEach(function (cc) {
      var wv = num(cc.warn);
      var bv = num(c.crBal[cc.id]);
      if (wv > 0 && bv < wv) {
        lowMsgs.push('เครดิตของ ' + cc.name + ' เหลือ ' + m2(bv) + ' บาท ต่ำกว่าที่ตั้งเตือนไว้ ' + m2(wv) + ' บาท');
      }
    });
    if (false && num(r.warnJ) > 0 && c.jBal < num(r.warnJ)) {
      lowMsgs.push('เครดิตของ ' + nm.buyer + ' เหลือ ' + m2(c.jBal) + ' บาท ต่ำกว่าที่ตั้งเตือนไว้ ' + m2(num(r.warnJ)));
    }
    var lowAlert = lowMsgs.length
      ? '<div class="alert a-w" role="alert">' + I.warn + '<div class="bd"><b>เครดิตใกล้หมด</b><p>' +
        esc(lowMsgs.join(' · ')) + '</p></div></div>'
      : '';

    var alert;
    if (c.fBal < 0 || c.jBal < 0 || T.negStock) {
      var msgs = [];
      if (c.fBal < 0) { msgs.push('เงินที่' + nm.factory + 'ติดลบ ' + m2(-c.fBal) + ' บาท'); }
      crCards(c).forEach(function (cc) {
        var bv = num(c.crBal[cc.id]);
        if (bv < 0) { msgs.push('เงินรับล่วงหน้าจาก ' + cc.name + ' ติดลบ ' + m2(-bv) + ' บาท'); }
      });
      if (T.negStock) { msgs.push('มีรายการส่งมอบหรือจำหน่ายเกินยอดปูนคงคลัง'); }
      alert = '<div class="alert a-d" role="alert">' + I.bad + '<div class="bd"><b>มีรายการที่ต้องแก้</b><p>' +
        esc(msgs.join(' · ')) + '</p></div></div>';
    } else {
      var who = tightJ ? 'คู่ค้าวางเงินล่วงหน้า' : nm.factory;
      alert = '<div class="alert a-w" role="status">' + I.warn + '<div class="bd"><b>ฝั่ง ' + esc(who) + ' จะหมดก่อน</b>' +
        '<p>เงินฝั่งคู่ค้าวางเงินล่วงหน้ารวมทุกราย รองรับการส่งมอบปูนผงได้อีกประมาณ ' + m0(Math.floor(c.capJ)) + ' ตัน · ' +
        'เงินที่' + esc(nm.factory) + 'รองรับการนำเข้าได้อีกประมาณ ' + m0(Math.floor(c.capF)) + ' ตัน</p></div>' +
        '<button type="button" class="btn" id="aMoney">บันทึกเงินเข้า</button></div>';
    }

    var depSeq = {}, seqOf = {};
    c.rows.forEach(function (w) {
      var k = w.e.kind;
      if (k !== 'depositF' && k !== 'depositJ') { return; }
      depSeq[k] = (depSeq[k] || 0) + 1;
      seqOf[w.e.id] = depSeq[k];
    });

    var body = shown.map(function (w) {
      var e = w.e, badge, bg = '';
      if (e.kind === 'depositF') { badge = '<span class="badge b-s">เงินเข้าโรงงาน</span>'; bg = ' style="background:var(--ok-bg)"'; }

  function monthKey(iso) { return String(iso).slice(0, 7); }
  function monthTH(key) {
    var pp = key.split('-');
    if (pp.length < 2) { return key; }
    return TH_M[parseInt(pp[1], 10) - 1] + ' ' + String(parseInt(pp[0], 10) + 543).slice(2);
  }

  function monthlyRollup(rows) {
    var map = {}, order = [];
    rows.forEach(function (w) {
      var k = monthKey(w.date);
      if (!map[k]) { map[k] = { k: k, fIn: 0, fCut: 0, jIn: 0, jCut: 0, fEnd: 0, jEnd: 0 }; order.push(k); }
      var m = map[k];
      m.fIn += w.fIn; m.fCut += w.fAmt; m.jIn += w.jIn; m.jCut += w.jAmt;
      m.fEnd = w.fBal; m.jEnd = w.jBal;
    });
    order.sort();
    var cf = 0, cj = 0;
    return order.map(function (k) {
      var m = map[k];
      cf += m.fIn; cj += m.jIn;
      m.fInCum = cf; m.jInCum = cj;
      return m;
    });
  }

  /* ================= แดชบอร์ดหน้าคุมการตัดเงิน ================= */

  var dashMode = 'd1';   // d1 โดนัท · d2 แท่งรายเดือน · d3 ทั้งสอง · off ปิด

  function donutSVG(used, left, cUsed, cLeft) {
    var tot = used + left;
    var pct = tot > 0 ? left / tot : 0;
    var R = 52, C = 2 * Math.PI * R;
    var dash = C * pct;
    return '<svg viewBox="0 0 140 140" style="width:100%;height:auto;display:block" role="img" ' +
      'aria-label="คงเหลือ ' + Math.round(pct * 100) + ' เปอร์เซ็นต์">' +
      '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + cUsed + '" stroke-width="18"></circle>' +
      '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + cLeft + '" stroke-width="18" ' +
      'stroke-dasharray="' + dash.toFixed(1) + ' ' + (C - dash).toFixed(1) + '" ' +
      'stroke-dashoffset="' + (C * 0.25).toFixed(1) + '" stroke-linecap="butt"></circle>' +
      '<text x="70" y="66" text-anchor="middle" style="font-family:var(--num);font-size:21px;font-weight:700;fill:var(--head)">' +
      Math.round(pct * 100) + '%</text>' +
      '<text x="70" y="86" text-anchor="middle" style="font-size:10px;fill:var(--muted)">คงเหลือ</text>' +
      '</svg>';
  }

  /* การ์ดเครดิตหนึ่งฝั่ง วงกลมสัดส่วนกับตัวเลขอยู่ด้วยกัน */
  function creditDonut(title, sub, bal, inSum, usedSum, capTons, r, warn, items, owe, cUsed, cLeft, rateP, rateB, verb) {
    var trucks = r.truckTon > 0 ? capTons / r.truckTon : 0;
    var capRows = [['ปูนผง', num(rateP)], ['ปูนถุง', num(rateB)]].map(function (q) {
      var tons = q[1] > 0 ? Math.max(bal, 0) / q[1] : 0;
      var tr = r.truckTon > 0 ? tons / r.truckTon : 0;
      return '<tr><th scope="row" style="font-weight:500">' + q[0] + '</th>' +
        '<td class="n muted">' + m0(q[1]) + '</td>' +
        '<td class="n str">' + m0(Math.floor(tons)) + '</td>' +
        '<td class="n str">' + m0(Math.floor(tr)) + '</td></tr>';
    }).join('');
    return '<section class="card"' + (warn ? ' style="border-color:var(--warn-bd)"' : '') + '>' +
      '<div class="card-b kpi">' +
        '<p class="t">' + esc(title) + '</p>' +
        '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0 2px">' +
          '<div style="flex:0 0 132px;max-width:132px;min-width:110px">' + donutSVG(usedSum, Math.max(bal, 0), cUsed, cLeft) + '</div>' +
          '<div style="flex:1 1 180px;min-width:0">' +
            '<p class="v"' + (bal < 0 ? ' style="color:var(--bad)"' : '') + '>' + m2(bal) + '</p>' +
            '<p class="u" style="margin-bottom:8px">บาท · ' + esc(sub) + '</p>' +
            '<p style="margin:0 0 3px;font-size:12.5px;color:var(--muted)">' + esc(owe) + 'อีกประมาณ</p>' +
            '<p style="margin:0;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">' +
              '<b class="num" style="font-size:22px;color:' + (warn ? 'var(--warn)' : 'var(--ok)') + '">' +
              m0(Math.floor(trucks)) + ' คันรถ</b>' +
              '<span class="note">' + m0(Math.floor(capTons)) + ' ตัน · คิดที่ราคาปูนผง ' + m0(num(rateP)) + ' ฿/ตัน ที่ ' +
              t2(r.truckTon) + ' ตันต่อคัน</span>' +
            '</p>' +
          '</div>' +
        '</div>' +
        '<dl class="dl" style="margin-top:12px">' +
        items.map(function (it) {
          var tone = it[2] === 'in' ? 'var(--ok)' : (it[2] === 'out' ? 'var(--bad)' : 'var(--head)');
          var sign = it[2] === 'in' ? '+' : (it[2] === 'out' ? '−' : '');
          return '<div><dt style="font-size:12.5px">' +
            '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:' + tone + '"></span>' +
            esc(it[0]) + '</dt>' +
            '<dd class="num" style="font-size:18px;font-weight:700;color:' + tone + '">' + sign + it[1] + '</dd></div>';
        }).join('') +
        '</dl>' +
        '<div class="tbox" style="margin-top:10px"><table><thead><tr><th>ประเภทปูน</th><th class="n">฿/ตัน</th>' +
        '<th class="n">' + esc(verb) + ' (ตัน)</th><th class="n">คันรถ</th></tr></thead>' +
        '<tbody>' + capRows + '</tbody></table></div>' +
        '<p class="note" style="margin-top:7px">ตารางนี้คิดจากเครดิตคงเหลือ ' + m2(Math.max(bal, 0)) + ' บาท หารด้วยราคาของปูนแต่ละประเภท</p>' +
      '</div></section>';
  }

  function barChart(ms) {
    if (!ms.length) { return '<p class="note" style="padding:20px;text-align:center">ยังไม่มีข้อมูลรายเดือน</p>'; }
    var W = 620, H = 220, padL = 8, padB = 34, padT = 10;
    var max = 0;
    ms.forEach(function (m) { max = Math.max(max, m.fIn, m.jIn, m.fCut, m.jCut); });
    if (max <= 0) { max = 1; }
    var slot = (W - padL * 2) / ms.length;
    var bw = Math.min(26, slot / 3.2);
    var bars = '', labs = '', grid = '';
    [0, 0.5, 1].forEach(function (g) {
      var y = padT + (H - padT - padB) * (1 - g);
      grid += '<line x1="' + padL + '" x2="' + (W - padL) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) +
        '" stroke="var(--line-soft)" stroke-width="1"></line>' +
        '<text x="' + padL + '" y="' + (y - 3).toFixed(1) + '" style="font-size:9px;fill:var(--muted)">' + m0(max * g) + '</text>';
    });
    ms.forEach(function (m, i) {
      var cx = padL + slot * i + slot / 2;
      var hF = (H - padT - padB) * (m.fIn / max);
      var hJ = (H - padT - padB) * (m.jIn / max);
      bars += '<rect x="' + (cx - bw - 2).toFixed(1) + '" y="' + (H - padB - hF).toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + hF.toFixed(1) + '" rx="3" fill="#2A3B96"><title>' + monthTH(m.k) + ' จ่ายโรงงาน ' + m2(m.fIn) + '</title></rect>';
      bars += '<rect x="' + (cx + 2).toFixed(1) + '" y="' + (H - padB - hJ).toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + hJ.toFixed(1) + '" rx="3" fill="#34A853"><title>' + monthTH(m.k) + ' รับจากผู้ซื้อ ' + m2(m.jIn) + '</title></rect>';
      labs += '<text x="' + cx.toFixed(1) + '" y="' + (H - padB + 15) + '" text-anchor="middle" style="font-size:10px;fill:var(--muted)">' +
        esc(monthTH(m.k)) + '</text>';
    });
    return '<div style="max-width:720px;margin:0 auto">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="กราฟแท่งรายเดือน">' +

      /* ช่องโทรศัพท์คุมเอง ตัดตัวที่ไม่ใช่ตัวเลขทิ้ง ตัดส่วนที่เกินจำนวนหลักทิ้ง
         แล้วอัปเดตตัวนับหลักทันทีโดยไม่ต้องวาดหน้าใหม่ เคอร์เซอร์จึงไม่กระโดด */
      /* จำนวนถุงกับน้ำหนักตันเป็นตัวเลขเดียวกัน ถุงละ 50 กก. จึง 20 ถุงเท่ากับ 1 ตัน
         พิมพ์ถุงปุ๊บ ตันต้องเปลี่ยนปั๊บ ไม่ต้องรอออกจากช่อง ของอื่นที่ใช้น้ำหนักค่อยตามมาใน 160 มิลลิวินาที */
      if (key === 'bags') {
        inp.addEventListener('input', function () {
          var dg = String(inp.value).replace(/[^0-9]/g, '');
          if (inp.value !== dg) {
            var ps = inp.selectionStart;
            var keep = String(inp.value.slice(0, ps === null ? inp.value.length : ps)).replace(/[^0-9]/g, '').length;
            inp.value = dg;

          }

          if (inp.value !== dg) {
            var ps = inp.selectionStart;
            var keep = phDigits(inp.value.slice(0, ps === null ? inp.value.length : ps)).length;
            inp.value = dg;
            var cp = Math.min(keep, dg.length);
            try { inp.setSelectionRange(cp, cp); } catch (eSel) { /* บางเบราว์เซอร์ไม่ให้ตั้ง */ }
          }
          target()[key] = dg;
          var cEl = el(inp.id + 'c');
          if (cEl) { cEl.innerHTML = phCount(side, dg); }
        });
        return;
      }
      inp.addEventListener('change', function () {
        var o = target();
        o[key] = inp.type === 'checkbox' ? inp.checked : inp.value;
        if (key === 'type') {
          var tk = form.trucks[i];
          if (inp.value === 'bag') {
            tk.nation = 'lao'; tk.wh = true; tk.sp = ''; tk.jp = false;
            tk.bags = num(tk.bags) || BAGS_TRUCK;
            tk.lao.tons = t2(num(tk.bags) / BAGS_TON);
            tk.thai.tons = tk.lao.tons;
          } else { tk.wh = false; tk.bags = ''; }
        }
        if (key === 'bags') {
          var tb = form.trucks[i];
          var tn = t2(num(inp.value) / BAGS_TON);
          tb.lao.tons = tn; tb.thai.tons = tn;
        }
        if (key === 'driver') {
          var known = book().drivers[(inp.value || '').trim()];
          if (known && !(o.phone || '').trim()) {
            var kn = phDigits(known).slice(0, phMax(path[0]));
            o.phone = kn;
            var pe = el(path[0] + 'phone' + i);
            if (pe) { pe.value = kn; }
            var pc = el(path[0] + 'phone' + i + 'c');
            if (pc) { pc.innerHTML = phCount(path[0], kn); }
          }
        }
        if (redraw) { softRedraw(); }
      });

    Array.prototype.forEach.call(el('v-entry').querySelectorAll('[data-rm]'), function (b) {

        b.innerHTML = ICON_TRASH;
        b.style.width = '34px'; b.style.padding = '0';
        b.style.color = 'var(--muted)'; b.style.borderColor = ''; b.style.background = '';
      }
      b.addEventListener('click', function () {
        if (form.trucks.length <= 1) { toast('ต้องมีอย่างน้อยหนึ่งคัน'); return; }
        /* กดครั้งแรกเป็นการถามยืนยัน กดครั้งที่สองภายใน 5 วินาทีจึงลบจริง */
        if (b.getAttribute('data-arm') !== '1') {
          b.setAttribute('data-arm', '1');
          b.innerHTML = ICON_TRASH + '<span style="margin-left:6px;font-size:12.5px;font-weight:600">กดอีกครั้งเพื่อลบ</span>';
          b.style.width = 'auto'; b.style.padding = '6px 12px';
          b.style.color = '#c0392b'; b.style.borderColor = '#e3b4ae'; b.style.background = '#fdf3f2';
          armT = setTimeout(disarm, 5000);

        disarm();

      }

    el('saveEntry').addEventListener('click', function () {

        return;
      }
      var nid = S.entries.reduce(function (m, e) { return Math.max(m, e.id); }, 0) + 1;
      if (K === 'import') {
        var tk = form.trucks.map(mapTruck);
        if (form.editId) {
          var old = S.entries.filter(function (x) { return String(x.id) === String(form.editId); })[0];
          if (old) { old.date = form.date; old.trucks = tk; }
          form.editId = null;
          S.demo = false; save(); dfClear();
          logIt('แก้รายการปูนเข้า', tk.length + ' คู่รถ · ' + thDate(form.date));
          location.hash = '#stock';
          toast('บันทึกการแก้ไขแล้ว');
          return;
        }
        S.entries.push({ id: nid, date: form.date, kind: 'import', trucks: tk });
      } else if (isSale) {
        var sP = 0, sB = 0;
        form.trucks.forEach(function (t) {
          var q = num(t.thai.tons);
          if ((t.type || 'powder') === 'bag') { sB += q; } else { sP += q; }
        });
        if (sP + sB <= 0) { toast('ยังไม่มีน้ำหนัก กดปุ่มบันทึกทะเบียนรถเพื่อกรอกก่อน'); return; }
        var rP = form.priceP === '' ? S.rates.jPowder : num(form.priceP);
        var rB = form.priceB === '' ? num(S.rates.jBag) : num(form.priceB);
        if (sP > 0) {
          S.entries.push({ id: nid, date: form.date, kind: K, cementType: 'powder', tons: sP, price: rP, who: form.who });
          nid += 1;
        }
        if (sB > 0) {
          S.entries.push({ id: nid, date: form.date, kind: K, cementType: 'bag', tons: sB, price: rB, who: form.who });
        }
        form.priceP = ''; form.priceB = ''; form.who = '';
      } else {
        var a = num(form.amount);
        if (a <= 0) { toast('กรุณาใส่จำนวนเงิน'); return; }
        S.entries.push({ id: nid, date: form.date, kind: K, amount: a,
          note: form.note || (K === 'depositF' ? 'โอนเงินให้' + nm.factory : 'รับเงินจาก ' + nm.buyer) });
        form.amount = ''; form.note = '';

      S.demo = false; save(); dfClear();
      if (K === 'import') {
        logIt('บันทึกปูนเข้า', form.trucks.length + ' คู่รถ · ' + thDate(form.date));
      } else if (isSale) {
        logIt(K === 'saleBuyer' ? 'บันทึกส่งมอบให้ ' + nm.buyer : 'บันทึกจำหน่ายลูกค้ารายอื่น', thDate(form.date));
      }
      location.hash = '#ledger';
      toast('บันทึกรายการแล้ว');
    });
  }

  /* ประวัติการนำเข้าปูนและการส่งมอบ รายวัน */
  function importHistory(c) {
    var by = {}, order = [];
    c.rows.forEach(function (w) {
      var e = w.e;
      /* ส่งมอบให้ผู้ซื้อหลัก นับทั้งรายการขายแบบเดิม และการจ่ายออกจากสตอกที่เลือกตัดเครดิต */
      var jpOut = (e.kind === 'pwOut' || e.kind === 'whOut') && w.jAmt > 0;
      if (e.kind !== 'import' && e.kind !== 'saleBuyer' && !jpOut) { return; }
      if (!by[w.date]) {
        by[w.date] = { date: w.date, trucks: 0, lp: 0, lb: 0, tp: 0, tb: 0, f: 0, jt: 0, j: 0 };
        order.push(w.date);
      }
      var d = by[w.date];
      if (e.kind === 'import') {
        d.trucks += w.trucks;
        d.lp += w.byTypeL.powder; d.lb += w.byTypeL.bag;
        d.tp += w.byType.powder;  d.tb += w.byType.bag;
        d.f += w.fAmt;
      } else {
        d.jt += w.tons; d.j += w.jAmt;
      }
    });
    var keys = ['trucks', 'lp', 'lb', 'tp', 'tb', 'f', 'jt', 'j'];
    var tot = { trucks: 0, lp: 0, lb: 0, tp: 0, tb: 0, f: 0, jt: 0, j: 0 };
    var rows = order.map(function (k) {
      var d = by[k];
      keys.forEach(function (x) { tot[x] += d[x]; });
      return '<tr><td class="muted" style="white-space:nowrap">' + thDate(d.date) + '</td>' +
        '<td class="n str">' + (d.trucks || dash()) + '</td>' +
        '<td class="n">' + (d.lp ? t2(d.lp) : dash()) + '</td>' +
        '<td class="n muted">' + (d.tp ? t2(d.tp) : dash()) + '</td>' +
        '<td class="n">' + (d.lb ? t2(d.lb) : dash()) + '</td>' +
        '<td class="n muted">' + (d.tb ? t2(d.tb) : dash()) + '</td>' +
        '<td class="n str sep">' + (d.f ? m2(d.f) : dash()) + '</td>' +
        '<td class="n">' + (d.jt ? t2(d.jt) : dash()) + '</td>' +
        '<td class="n str">' + (d.j ? m2(d.j) : dash()) + '</td></tr>';
    }).join('');

    return '<section class="card" style="margin-top:16px">' +
      '<div class="card-h"><div><h2>ประวัติการนำเข้าปูนและการส่งมอบรายวัน</h2>' +
      '<p class="note">' + order.length + ' วันทำการ · รวม ' + tot.trucks + ' คู่รถ · ' +
      'น้ำหนักฝั่งลาวใช้ตัดเงินโรงงาน น้ำหนักฝั่งไทยคือปูนที่รับเข้าคงคลัง</p></div>' +
      '<a class="btn sm" href="#export">ส่งออกข้อมูล</a></div>' +
      '<div class="tbox"><table><thead>' +
        '<tr><th rowspan="2">วันที่</th><th rowspan="2" class="n">คู่รถ</th>' +
        '<th colspan="2" class="c">ปูนผง (ตัน)</th><th colspan="2" class="c">ปูนถุง (ตัน)</th>' +
        '<th rowspan="2" class="n sep">ตัดเงินโรงงาน</th>' +
        '<th colspan="2" class="m c">ส่งมอบตัดเครดิต · ทุกราย</th></tr>' +
        '<tr><th class="sub n">ฝั่งลาว</th><th class="sub n">ฝั่งไทย</th>' +
        '<th class="sub n">ฝั่งลาว</th><th class="sub n">ฝั่งไทย</th>' +
        '<th class="m sub n">ตัน</th><th class="m sub n">ตัดเงิน</th></tr>' +
      '</thead><tbody>' +
      (rows || '<tr><td colspan="9" class="muted" style="padding:28px;text-align:center">ยังไม่มีประวัติการนำเข้า</td></tr>') +
      '</tbody><tfoot><tr><th>รวมทั้งหมด</th><td class="n">' + tot.trucks + '</td>' +
        '<td class="n">' + t2(tot.lp) + '</td><td class="n">' + t2(tot.tp) + '</td>' +
        '<td class="n">' + t2(tot.lb) + '</td><td class="n">' + t2(tot.tb) + '</td>' +
        '<td class="n sep">' + m2(tot.f) + '</td>' +
        '<td class="n">' + t2(tot.jt) + '</td><td class="n">' + m2(tot.j) + '</td></tr></tfoot>' +
      '</table></div></section>';
  }

        mini('ค่าชิปปิ้งรวมทั้งหมด', m2(c.shipTotal), 'บาท · ลาว + ไทย + เอกซเรย์') +
        mini('ฝั่งลาว · ' + nm.shipper, m2(c.shipLaoTotal), 'บาท · ค่าขนส่ง ' + m2(T.ship) + ' + เอกซเรย์ ' + m2(T.scan)) +
        mini('ฝั่งไทย · ' + nm.thaiShipper + ' และ ' + nm.thaiShipperBag, m2(T.shipThai),
          'บาท · ปูนผง ' + nm.thaiShipper + ' ' + m2(T.shipThaiP || 0) + ' · ปูนถุง ' + nm.thaiShipperBag + ' ' + m2(T.shipThaiB || 0)) +
        mini('เฉลี่ยต่อตันนำเข้า', m2(T.inTons ? c.shipTotal / T.inTons : 0), 'บาท · หารด้วยน้ำหนักฝั่งลาว ' + t2(T.inTons) + ' ตัน') +
      '</div>' +

      '<section class="card" style="margin-bottom:14px"><div class="card-h"><div><h2>รายละเอียดรายวัน</h2>' +
        '<p class="note">ขั้นราคานับจำนวนรถตามวิธีที่ตั้งไว้ ค่าตั้งต้นคือนับแยกตามชุดนำเข้า เกิน 5 คันใช้เรตขั้น 5 · ' +
        'ช่อง ฿/ตัน คือค่าชิปปิ้งลาว + ค่าขนส่งและประกัน · ตันตามบิลคือน้ำหนักตามเอกสารของชุด รถเก่าที่ไม่มีชุดใช้น้ำหนักฝั่งลาว</p></div></div>' +
        '<div class="tbox"><table><thead><tr><th>วันที่</th><th>ทะเบียนรถลาว</th><th>ทะเบียนรถไทย</th>' +
        '<th>ประเภท · สัญชาติรถ</th>' +
        '<th class="c">ขั้นราคา</th><th class="n">฿/ตัน</th><th class="n">ตันตามบิล</th>' +
        '<th class="d n sep">ชิปปิ้งลาว</th><th class="d n">เอกซเรย์</th>' +
        '<th class="m n sep">ชิปปิ้งไทย</th><th class="n">รวม</th><th class="c"></th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="12" class="muted" style="padding:28px;text-align:center">ยังไม่มีรายการนำเข้า</td></tr>') +
        '</tbody><tfoot><tr><th colspan="4">รวม ' + T.trucks + ' คู่รถ</th><td></td><td></td>' +
        '<td class="n">' + t2(T.shipTons || 0) + '</td><td class="n sep">' + m2(T.ship) + '</td><td class="n">' + m2(T.scan) + '</td>' +
        '<td class="n sep">' + m2(T.shipThai) + '</td>' +
        '<td class="n" style="font-size:13.5px">' + m2(c.shipTotal) + '</td></tr></tfoot></table></div></section>' +

      '<div class="grid g2" id="shipGrid">' +
        '<section class="card"><div class="card-h"><div><h2>ขั้นราคาชิปปิ้งลาว · ' + esc(nm.shipper) + '</h2>' +
        '<p class="note">บาทต่อตัน แยกตามจำนวนรถของวันนั้น · ตั้งต้น 1 คัน = ' + t2(r.truckTon) + ' ตัน</p></div>' +
        '<a class="btn sm" href="#rates">แก้อัตรา</a></div>' +
        '<div class="tbox"><table><thead><tr><th>จำนวนรถ</th><th class="n">ผง<br>รถลาว</th><th class="n">ผง<br>รถไทย</th>' +
        '<th class="n">ถุง<br>รถลาว</th><th class="n">ถุง<br>รถไทย</th></tr></thead>' +
        '<tbody>' + tierRows + '</tbody></table></div>' +
        '<div class="card-b" style="border-top:1px solid var(--line-soft)">' +
        '<p class="note">ค่าเอกซเรย์ ' + m0(r.scanner) + ' บาทต่อคัน คิดเฉพาะคู่รถที่ติ๊กไว้ในหน้าบันทึกปูนเข้า</p></div></section>' +
        '<section class="card"><div class="card-h"><div>' +
        '<h2>อัตราค่าชิปปิ้งไทย · ปูนผง ' + esc(nm.thaiShipper) + ' · ปูนถุง ' + esc(nm.thaiShipperBag) + '</h2>' +
        '<p class="note">คิดเหมาต่อคัน ตามอัตราที่ซัพพลายเออร์เสนอ ระบบหารด้วยน้ำหนักมาตรฐาน ' + t2(r.truckTon) + ' ตัน เพื่อแสดงเป็นบาทต่อตัน</p>' +
        '</div><a class="btn sm" href="#rates">แก้อัตรา</a></div>' +
        '<div class="tbox"><table><thead><tr><th>รายการ</th><th class="n">฿/คัน (' + t2(r.truckTon) + ' ตัน)</th>' +
        '<th class="n">฿/ตัน</th><th class="n">จำนวนคู่รถ</th><th class="n">รวมทั้งช่วง</th></tr></thead><tbody>' +
        [['powder', 'ปูนผง', num(r.tPowder)], ['bag', 'ปูนถุง', num(r.tBag)]].map(function (q) {
          var cnt = 0, amt = 0;
          imports.forEach(function (w) {
            w.items.forEach(function (it) { if (it.type === q[0]) { cnt += 1; amt += it.thaiAmt; } });
          });
          var perTon = num(r.truckTon) > 0 ? q[2] / num(r.truckTon) : 0;
          return '<tr><th scope="row" style="font-weight:500">' + q[1] + '</th>' +
            '<td class="n str">' + m2(q[2]) + '</td><td class="n muted">' + m2(perTon) + '</td>' +
            '<td class="n">' + cnt + '</td><td class="n str">' + m2(amt) + '</td></tr>';
        }).join('') +
        '</tbody><tfoot><tr><th>รวม</th><td></td><td></td><td class="n">' + T.trucks + '</td>' +
        '<td class="n">' + m2(T.shipThai) + '</td></tr></tfoot></table></div>' +
        '<div class="card-b" style="border-top:1px solid var(--line-soft)"><p class="note">' +
        (r.thaiBasis === 'ton'
          ? 'ขณะนี้คิดแบบ <b>ต่อตัน</b> คือ ฿/ตัน × น้ำหนักฝั่งไทยที่ชั่งได้จริง'
          : 'ขณะนี้คิดแบบ <b>เหมาต่อคัน</b> คือจ่ายเต็มอัตราต่อคันไม่ว่าชั่งได้กี่ตัน') +
        ' · เปลี่ยนวิธีคิดได้ที่หน้าตั้งค่าอัตรา</p></div></section>' +
      '</div>' +
      '<p class="note" style="margin-top:12px">อัตราทั้งสองตารางดึงมาจากหน้าตั้งค่าอัตรา · ' +
      'ค่าชิปปิ้งเป็นต้นทุนของขาเข้า ไม่ได้ผูกกับการขาย จึงหักออกจากกำไรทั้งงวด ไม่ได้หักรายตันที่ขาย</p>';
  }

  function mini(t, v, u) {
    return '<section class="card"><div class="card-b kpi"><p class="t">' + esc(t) + '</p>' +
      '<p class="v" style="font-size:25px">' + v + '</p><p class="u" style="margin-bottom:0">' + esc(u) + '</p></div></section>';
  }

  /* ================= หน้า 4 · ตั้งค่าอัตรา ================= */

  /* ================= ร่างการแก้ในหน้าตั้งค่าอัตรา =================
     เดิมแก้ช่องไหนบันทึกทันที ตอนนี้เก็บไว้เป็นร่างก่อน
     ช่องที่แก้จะถูกทำเครื่องหมายไว้ และต้องกดบันทึกจึงจะมีผลกับทุกหน้า */
  var RD = { rates: null, names: null, nav: '' };

  function rView() { return RD.rates || S.rates; }
  function rNames() { return RD.names || S.names; }
  function rEditR() { if (!RD.rates) { RD.rates = JSON.parse(JSON.stringify(S.rates)); } return RD.rates; }
  function rEditN() { if (!RD.names) { RD.names = JSON.parse(JSON.stringify(S.names)); } return RD.names; }
  function rClear() { RD.rates = null; RD.names = null; }

  /* ชื่อช่องที่อ่านจากหน้าจอจริง จะได้ตรงกับที่ผู้ใช้เห็น และมีชื่อหัวข้อนำหน้ากันสับสน */
  function rLabel(sel, fallback) {
    var inp = document.querySelector(sel);
    if (!inp) { return fallback; }
    var lab = inp.id ? document.querySelector('label[for="' + inp.id + '"]') : null;
    var sec = inp.closest ? inp.closest('section') : null;
    var h = sec ? sec.querySelector('h2') : null;
    var t = fallback;
    if (lab) {
      var cl = lab.cloneNode(true);
      Array.prototype.forEach.call(cl.querySelectorAll('.editTag'), function (x) { x.parentNode.removeChild(x); });
      t = cl.textContent.replace(/\s+/g, ' ').trim();
    }
    var head = h ? h.textContent.replace(/\s+/g, ' ').trim() : '';
    if (head.length > 30) { head = head.slice(0, 29) + '\u2026'; }
    return (head ? head + ' · ' : '') + t;
  }

  var TIER_NAME = { pLao: 'ปูนผง ฝั่งลาว', pThai: 'ปูนผง ฝั่งไทย',
                    bLao: 'ปูนถุง ฝั่งลาว', bThai: 'ปูนถุง ฝั่งไทย' };
  var BASIS_TH = { truck: 'เหมาต่อคัน', ton: 'คิดตามน้ำหนัก' };
  var COUNT_TH = { set: 'แยกตามชุดนำเข้า (Form D)', type: 'แยกตามประเภทปูน', lane: 'แยกตามคอลัมน์ราคา', all: 'นับรวมทั้งวัน' };

  /* รายการจุดที่แก้ เทียบร่างกับค่าที่บันทึกไว้ */
  function rDiff() {
    var out = [];
    if (RD.names) {
      Object.keys(RD.names).forEach(function (k) {
        if (String(RD.names[k]) !== String(S.names[k])) {
          out.push({ label: rLabel('[data-name="' + k + '"]', k), old: S.names[k], now: RD.names[k] });
        }
      });
    }
    if (RD.rates) {
      Object.keys(RD.rates).forEach(function (k) {
        if (k === 'tiers') { return; }
        var a = S.rates[k], b = RD.rates[k];
        if (typeof a === 'object' || String(a) === String(b)) { return; }
        var lab, oldT = a, newT = b;
        if (k === 'thaiBasis') { lab = 'ค่าชิปปิ้งไทย · วิธีคิด'; oldT = BASIS_TH[a] || a; newT = BASIS_TH[b] || b; }
        else if (k === 'tierCount') { lab = 'ขั้นราคาชิปปิ้งลาว · วิธีนับจำนวนรถ'; oldT = COUNT_TH[a] || a; newT = COUNT_TH[b] || b; }
        else if (k === 'capAt5') { lab = 'ขั้นราคาชิปปิ้งลาว · คิดสูงสุดที่ 5 คัน'; oldT = a ? 'เปิด' : 'ปิด'; newT = b ? 'เปิด' : 'ปิด'; }
        else { lab = rLabel('[data-rate="' + k + '"]', k); oldT = m2(a); newT = m2(b); }
        out.push({ label: lab, old: oldT, now: newT });
      });
      if (RD.rates.tiers) {
        Object.keys(RD.rates.tiers).forEach(function (k) {
          RD.rates.tiers[k].forEach(function (v, i) {
            if (String(v) !== String(S.rates.tiers[k][i])) {
              out.push({ label: 'ขั้นราคาชิปปิ้งลาว · ' + (TIER_NAME[k] || k) + ' ขั้น ' + (i + 1),
                         old: m2(S.rates.tiers[k][i]), now: m2(v) });
            }
          });
        });
      }
    }
    return out;
  }

  function rDirty() { return rDiff().length > 0; }

  /* ทำเครื่องหมายช่องที่แก้ไว้ ให้เห็นว่าจุดไหนเปลี่ยน */
  function rMark() {
    var changed = {};
    if (RD.rates) {
      Object.keys(RD.rates).forEach(function (k) {
        if (k !== 'tiers' && typeof RD.rates[k] !== 'object' && String(RD.rates[k]) !== String(S.rates[k])) {
          changed['[data-rate="' + k + '"]'] = 1;
        }
      });
      if (RD.rates.tiers) {
        Object.keys(RD.rates.tiers).forEach(function (k) {
          RD.rates.tiers[k].forEach(function (v, i) {
            if (String(v) !== String(S.rates.tiers[k][i])) { changed['[data-tier="' + k + ':' + i + '"]'] = 1; }
          });
        });
      }
    }
    if (RD.names) {
      Object.keys(RD.names).forEach(function (k) {
        if (String(RD.names[k]) !== String(S.names[k])) { changed['[data-name="' + k + '"]'] = 1; }
      });
    }
    Object.keys(changed).forEach(function (sel) {
      var inp = document.querySelector(sel);
      if (!inp) { return; }
      inp.style.borderColor = '#d9a441';
      inp.style.background = '#fffbf2';
      inp.style.boxShadow = '0 0 0 3px rgba(217,164,65,.16)';
      var lab = inp.id ? document.querySelector('label[for="' + inp.id + '"]') : null;
      if (lab && !lab.querySelector('.editTag')) {
        var tag = document.createElement('span');
        tag.className = 'editTag';
        tag.textContent = 'แก้แล้ว';
        tag.style.cssText = 'margin-left:7px;font-size:10.5px;font-weight:700;color:#8a5a00;background:#fdf0d6;' +
          'border:1px solid #e9cf9a;border-radius:999px;padding:1px 7px;vertical-align:middle';
        lab.appendChild(tag);
      }
    });
  }

  /* แถบลอยล่างจอ ขึ้นเมื่อมีการแก้ค้างอยู่ */
  function rBar() {
    var n = rDiff().length;
    if (!n) { return ''; }
    return '<div id="rBar" style="position:fixed;left:50%;transform:translateX(-50%);' +
      'bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;width:min(760px,calc(100vw - 32px));' +
      'background:var(--card);border:1px solid #e9cf9a;border-left:5px solid #d9a441;border-radius:14px;' +
      'box-shadow:0 18px 44px rgba(14,12,60,.22);padding:13px 16px">' +
      '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<div style="flex:1 1 240px;min-width:0">' +
          '<b style="font-size:13.5px;color:var(--head)">แก้ไขไว้ ' + n + ' จุด ยังไม่ได้บันทึก</b>' +
          '<p class="note" style="margin:2px 0 0">ช่องที่แก้ถูกทำเครื่องหมายสีเหลืองไว้ให้แล้ว</p>' +
        '</div>' +
        '<button type="button" class="btn sm" id="rShow">ดูจุดที่แก้</button>' +
        '<button type="button" class="btn sm" id="rUndo">ย้อนกลับเป็นค่าเดิม</button>' +
        '<button type="button" class="btn pri sm" id="rSave">บันทึกการแก้ไข</button>' +
      '</div></div>';
  }

  function rSaveNow() {
    var list = rDiff();
    if (!list.length) { rClear(); return; }
    if (RD.rates) { S.rates = RD.rates; }
    if (RD.names) { Object.keys(RD.names).forEach(function (k) { S.names[k] = RD.names[k]; }); }
    rClear();
    save();
    list.forEach(function (c) { logIt('แก้ค่าในหน้าตั้งค่าอัตรา', c.label + ': ' + c.old + ' → ' + c.now); });
    viewRates();
    toast('บันทึกแล้ว ' + list.length + ' จุด · ทุกหน้าคำนวณด้วยค่าใหม่');
  }

  /* กล่องรายการจุดที่แก้ ใช้ทั้งตอนกดดู และตอนจะออกจากหน้าทั้งที่ยังไม่บันทึก */
  function rAsk(leaving) {
    var list = rDiff();
    if (!list.length) { return; }
    var rows = list.map(function (c) {
      return '<div style="display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)">' +
        '<span style="flex:1 1 auto;font-size:13px;color:var(--ink)">' + esc(c.label) + '</span>' +
        '<span style="font-family:var(--num,ui-monospace),ui-monospace,monospace;font-size:13px;color:var(--muted);' +
        'text-decoration:line-through">' + esc(String(c.old)) + '</span>' +
        '<span style="color:var(--muted)">→</span>' +
        '<span style="font-family:var(--num,ui-monospace),ui-monospace,monospace;font-size:13px;font-weight:700;' +
        'color:#8a5a00">' + esc(String(c.now)) + '</span></div>';
    }).join('');

    var ov = document.createElement('div');
    ov.id = 'rAsk';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-label', leaving ? 'ยังไม่ได้บันทึกการแก้ไข' : 'จุดที่แก้ไว้');
    ov.style.cssText = 'position:fixed;inset:0;z-index:90;background:rgba(14,12,60,.42);' +
      'display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML = '<div style="width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--card);' +
      'border-radius:16px;box-shadow:0 26px 60px rgba(14,12,60,.34);padding:20px 22px">' +
      '<h2 style="margin:0 0 4px;font-size:17px;color:var(--head)">' +
        (leaving ? 'ยังไม่ได้บันทึกการแก้ไข' : 'จุดที่แก้ไว้ ' + list.length + ' จุด') + '</h2>' +
      '<p class="note" style="margin:0 0 12px">' +
        (leaving ? 'คุณแก้ไว้ ' + list.length + ' จุด ถ้าออกจากหน้านี้ตอนนี้ค่าที่แก้จะหายไป'
                 : 'ค่าเดิมทางซ้าย ค่าใหม่ทางขวา ยังไม่มีผลจนกว่าจะกดบันทึก') + '</p>' +
      '<div style="background:var(--page);border:1px solid var(--line);border-radius:11px;padding:4px 13px 10px">' +
        rows + '</div>' +
      '<div class="actions" style="margin-top:16px;justify-content:flex-end">' +
        (leaving
          ? '<button type="button" class="btn" id="rStay">อยู่หน้านี้ต่อ</button>' +
            '<button type="button" class="btn" id="rDrop" style="color:#c0392b;border-color:#e3b4ae;' +
            'background:#fdf3f2">ออกโดยไม่บันทึก</button>' +
            '<button type="button" class="btn pri" id="rKeep">บันทึกแล้วไปต่อ</button>'
          : '<button type="button" class="btn" id="rStay">ปิด</button>' +
            '<button type="button" class="btn pri" id="rKeep">บันทึกการแก้ไข</button>') +
      '</div></div>';
    document.body.appendChild(ov);

    function close() { ov.remove(); }
    el('rStay').addEventListener('click', function () { close(); RD.nav = ''; });
    el('rKeep').addEventListener('click', function () {
      close(); rSaveNow();
      if (leaving && RD.nav) { var g = RD.nav; RD.nav = ''; location.hash = '#' + g; }
    });
    if (el('rDrop')) {
      el('rDrop').addEventListener('click', function () {
        close(); rClear();
        var g = RD.nav; RD.nav = '';
        toast('ไม่ได้บันทึก ค่ากลับเป็นของเดิม');
        if (g) { location.hash = '#' + g; } else { viewRates(); }
      });
    }
  }

  function bindRBar() {
    if (el('rSave')) { el('rSave').addEventListener('click', rSaveNow); }
    if (el('rShow')) { el('rShow').addEventListener('click', function () { rAsk(false); }); }
    if (el('rUndo')) {
      el('rUndo').addEventListener('click', function () {
        rClear(); viewRates(); toast('ย้อนกลับเป็นค่าที่บันทึกไว้แล้ว');
      });
    }
    rMark();
  }

  function viewRates() {
    /* ชั้นที่ 2 ยังไม่ปลดล็อก ให้แสดงจอใส่ PIN แทนทั้งหน้า */
    if (rlOn() && !RLK.open) { el('v-rates').innerHTML = rlScreen(); bindRL(); return; }
    var r = rView();
    var nm = rNames();

    function namef(key, val, label, hint) {
      return '<div><label class="fl" for="nm-' + key + '">' + esc(label) + '</label>' +
        '<input id="nm-' + key + '" type="text" value="' + esc(val) + '" data-name="' + key + '" maxlength="90">' +
        '<p class="hint">' + esc(hint) + '</p></div>';
    }
    function numf(id, val, label, hint, warn) {

    Array.prototype.forEach.call(el('v-rates').querySelectorAll('[data-rate]'), function (inp) {

  function section(n, title, desc, inner, right) {
    return '<section class="card"><div class="card-h">' +
      '<span class="secnum" aria-hidden="true">' + n + '</span>' +
      '<div><h2>' + esc(title) + '</h2><p class="note">' + esc(desc) + '</p></div>' +
      (right || '') + '</div>' +
      '<div class="card-b">' + inner + '</div></section>';
  }

  /* ================= หน้า 5 · ส่งออกและวิเคราะห์ ================= */
  var pick = { balance: true, ledger: true, sales: true, shipping: true, trucks: true, analysis: true };
  var expFmt = 'tsv';

  function analysis() {
    var c = compute(), r = S.rates, T = c.T;
    var sold = T.soldPowder + T.soldBag;
    var avgShip = T.inTons ? c.shipTotal / T.inTons : 0;
    var rev = c.revenue;
    function per(type) {
      var tons = type === 'powder' ? T.soldPowder : T.soldBag;
      var cost = costOf(type);
      var price = type === 'powder' ? r.jPowder : r.jBag;
      return { tons: tons, cost: cost, price: price, before: price - cost, after: price - cost - avgShip };
    }
    return {
      c: c, T: T, avgShip: avgShip, sold: sold,
      powder: per('powder'), bag: per('bag'),
      shareBuyer: rev ? T.revBuyer / rev : 0,
      shareOther: rev ? T.revOther / rev : 0,
      turn: T.inTons ? sold / T.inTons : 0,
      costShare: rev ? T.soldCost / rev : 0,
      shipShare: rev ? c.shipTotal / rev : 0,
      marginPct: rev ? c.gross / rev : 0
    };
  }

  function buildSets() {
    var c = compute(), r = S.rates, T = c.T, sets = [];

    if (pick.balance) {
      sets.push({ title: 'สรุปยอด', header: ['รายการ', 'ค่า'], rows: [
        ['ยอดคงเหลือที่ ' + nm.factory, m2(c.fBal)],
        ['เงินรับล่วงหน้าคงเหลือ · คู่ค้าทุกราย', m2(c.jBal)],
        ['น้ำหนักออกจากโรงงาน ฝั่งลาว (ตัน)', t2(T.inTons)],
        ['น้ำหนักรับเข้าไทยจริง (ตัน)', t2(T.inTonsThai)],
        ['น้ำหนักส่วนต่างจากการถ่ายปูน (ตัน)', t2(T.loss)],
        ['ปูนผงคงคลัง (ตัน)', t2(c.stock.powder)],
        ['ปูนถุงคงคลัง (ตัน)', t2(c.stock.bag)],
        ['รายได้จากการขาย', m2(c.revenue)],
        ['ต้นทุนของตันที่ขาย (ราคาที่โรงงาน)', m2(T.soldCost)],
        ['ค่าชิปปิ้งฝั่งลาว (รวมเอกซเรย์)', m2(c.shipLaoTotal)],
        ['ค่าชิปปิ้งฝั่งไทย', m2(T.shipThai)],
        ['ค่าชิปปิ้งรวมทั้งงวด', m2(c.shipTotal)],
        ['กำไรขั้นต้นโดยประมาณ', m2(c.gross)]
      ] });
    }

    if (pick.analysis) {
      var a = analysis();
      sets.push({ title: 'วิเคราะห์เปรียบเทียบต่อตัน', header: ['ประเภท', 'ขายแล้ว (ตัน)', 'ต้นทุน/ตัน', 'ราคาขาย/ตัน', 'ส่วนต่างก่อนชิปปิ้ง', 'ชิปปิ้งลาวเฉลี่ย/ตัน', 'กำไร/ตัน'], rows: [
        ['ปูนผง', t2(a.powder.tons), m0(a.powder.cost), m0(a.powder.price), m0(a.powder.before), m2(a.avgShip), m2(a.powder.after)],
        ['ปูนถุง', t2(a.bag.tons), m0(a.bag.cost), m0(a.bag.price), m0(a.bag.before), m2(a.avgShip), m2(a.bag.after)]
      ] });
      sets.push({ title: 'ตัวชี้วัด', header: ['ตัวชี้วัด', 'ค่า'], rows: [
        ['สัดส่วนรายได้จาก ' + nm.buyer, (a.shareBuyer * 100).toFixed(1) + '%'],
        ['สัดส่วนรายได้จากลูกค้าอื่น', (a.shareOther * 100).toFixed(1) + '%'],
        ['ขายไปแล้วคิดเป็นสัดส่วนของที่นำเข้า', (a.turn * 100).toFixed(1) + '%'],
        ['ต้นทุนสินค้าต่อรายได้', (a.costShare * 100).toFixed(1) + '%'],
        ['ค่าชิปปิ้งรวมต่อรายได้', (a.shipShare * 100).toFixed(1) + '%'],
        ['อัตรากำไรขั้นต้น', (a.marginPct * 100).toFixed(1) + '%'],
        ['นำเข้าปูนผงได้อีก (ตัน)', Math.floor(c.capF)],
        ['ส่งมอบปูนผงได้อีก (ตัน)', Math.floor(c.capJ)]
      ] });
    }

    if (pick.ledger) {
      var lrows = c.rows.map(function (w) {
        var e = w.e, kind = { import: 'ปูนเข้า', saleBuyer: 'ส่งมอบให้ ' + nm.buyer, saleOther: 'ขายลูกค้าอื่น',

        var detail = e.kind === 'import'
          ? w.items.map(function (it) { return typeTH(it.type) + ' ลาว ' + t2(it.tons) + ' / ไทย ' + t2(it.tonsThai) + ' ตัน' + (it.dest ? ' → ' + it.dest : ''); }).join(' + ')
          : (e.kind === 'saleOther' ? (e.who || 'ลูกค้ารายอื่น') : (e.note || ''));

        return [thDate(e.date), kind, detail, tLabel, w.tons ? t2(w.tons) : '',
          w.fIn ? m2(w.fIn) : '', w.fRate ? m0(w.fRate) : '', w.fAmt ? m2(w.fAmt) : '', m2(w.fBal),

          t2(w.stockP), t2(w.stockB)];

      sets.push({ title: 'สมุดบัญชีคุมการตัดเงิน', header: ['วันที่', 'ประเภทรายการ', 'รายละเอียด', 'ประเภทปูน', 'ตัน',
        'เงินเข้า-' + nm.factory, 'อัตรา-' + nm.factory, 'ตัดเงิน-' + nm.factory, 'คงเหลือ-' + nm.factory,

    if (pick.shipping) {

            it.plateLao || '(ไม่ระบุ)', it.plateThai || '(ไม่ระบุ)', 1, it.tier + ' คัน', m0(it.shipRate),
            t2(it.tons), m2(it.shipAmt), it.scan ? m2(it.scan) : '', m2(it.thaiAmt),
            m2(it.shipAmt + it.scan + it.thaiAmt)]);
        });
      });
      hrows.push(['รวม', '', '', '', '', T.trucks, '', '', t2(T.inTons), m2(T.ship), m2(T.scan), m2(T.shipThai), m2(c.shipTotal)]);
      sets.push({ title: 'ค่าชิปปิ้ง ลาว (' + nm.shipper + ') และไทย (ผง ' + nm.thaiShipper + ' · ถุง ' + nm.thaiShipperBag + ')',
        header: ['วันที่', 'ประเภทปูน', 'สัญชาติรถ', 'ทะเบียนรถลาว', 'ทะเบียนรถไทย', 'จำนวนรถ', 'ขั้นราคา',
