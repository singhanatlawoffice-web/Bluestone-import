      wrows.push(['รวม', '', T.trucks, '', '', '', '', t2(T.inTons), '', '', '', '', t2(T.inTonsThai), t2(T.loss), '', '', m2(T.shipThai)]);
      sets.push({ title: 'คู่รถลาว–รถไทยรายคัน',
        header: ['วันที่', 'ประเภทปูน', 'คู่รถที่',
          'บริษัทฝั่งลาว', 'ทะเบียนลาว', 'พนักงานขับรถลาว', 'โทรศัพท์ลาว', 'ตัน (ลาว)',
          'บริษัทฝั่งไทย', 'ทะเบียนไทย', 'พนักงานขับรถไทย', 'โทรศัพท์ไทย', 'ตัน (ไทย)',
          'ส่วนต่าง (ตัน)', 'ส่งลูกค้าที่', 'เอกซเรย์', 'ค่าชิปปิ้งไทย'],
        rows: wrows });
    }

    return sets;
  }

  function csvCell(v) {
    var s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function formatSets(sets, fmt) {
    if (!sets.length) { return ''; }
    if (fmt === 'json') {
      return JSON.stringify(sets.map(function (s) {
        return { title: s.title, rows: s.rows.map(function (r) {
          var o = {}; s.header.forEach(function (h, i) { o[h] = r[i]; }); return o;
        }) };
      }), null, 2);
    }
    if (fmt === 'md') {
      return sets.map(function (s) {
        var out = ['## ' + s.title, '', '| ' + s.header.join(' | ') + ' |',
          '| ' + s.header.map(function () { return '---'; }).join(' | ') + ' |'];
        s.rows.forEach(function (r) { out.push('| ' + r.map(function (c) { return String(c === '' || c == null ? '—' : c); }).join(' | ') + ' |'); });
        return out.join('\n');
      }).join('\n\n');
    }
    var sep = fmt === 'csv' ? ',' : '\t';
    var cell = fmt === 'csv' ? csvCell : function (v) { return String(v); };
    return sets.map(function (s) {
      var out = ['[ ' + s.title + ' ]', s.header.map(cell).join(sep)];
      s.rows.forEach(function (r) { out.push(r.map(cell).join(sep)); });
      return out.join('\n');
    }).join('\n\n');
  }

  /* ================= รายงานวิเคราะห์และส่งออกข้อมูล =================
     ตัวกรองและหัวข้อที่เลือกไว้ ใช้ร่วมกันทั้งแดชบอร์ดบนจอและไฟล์ที่ดาวน์โหลด
     ตัวเลขทุกตัวคำนวณจาก compute() ตัวเดียวกับหน้าอื่น ยอดจึงตรงกันทั้งระบบ */
  var RP = {
    range: '3m', from: '', to: '',
    ty: { powder: true, bag: true },
    cus: {}, prov: {}, car: {},          /* ว่างไว้ = เอาทั้งหมด */
    sec: { dash: 1, pnl: 1, loss: 1, cust: 1, ship: 1, decl: 1, fac: 1, cash: 0, raw: 1 },
    fmt: { xlsx: 1, csv: 0, pdf: 0, json: 0 },
    view: 'setup'
  };

  var RP_SEC = [
    ['dash', 'แดชบอร์ดสรุป', 'ตัวเลขหลัก ตันนำเข้า คู่รถ ต้นทุน ยอดขาย และกราฟรายเดือน'],
    ['pnl', 'ต้นทุนและยอดขายรายเดือน', 'ต้นทุนปูน ค่าชิปปิ้งสองฝั่ง ค่าเอกซเรย์ เทียบกับยอดขายในเดือนเดียวกัน'],
    ['loss', 'น้ำหนักสูญเสียจากการถ่ายปูน', 'ส่วนต่างลาว-ไทยรายคู่รถ ค่าเฉลี่ย และคู่ที่สูญเสียสูงสุด'],
    ['cust', 'แยกตามลูกค้า จังหวัด อำเภอ', 'จำนวนเที่ยวและตันที่ส่งให้แต่ละราย และแต่ละพื้นที่'],
    ['ship', 'ค่าชิปปิ้งและผู้ขนส่ง', 'ค่าขนส่งรวมและต่อตันของแต่ละเจ้า ทั้งฝั่งลาวและฝั่งไทย'],
    ['decl', 'ตรวจค่าชิปปิ้งไทยต่อใบขน', 'จัดหน้าเหมือนใบวางบิล ใบขนละหนึ่งบรรทัด จำนวนคัน ราคาต่อหน่วย จำนวนเงิน และต่อตัน'],
    ['fac', 'ยอดเงินคงเหลือ ณ โรงงานปูน', 'จัดหน้าเหมือนรายงานที่โรงงานส่งมา ยอดยกมา ตัดเงินรายคัน เงินโอนเข้า และยอดคงเหลือวิ่งทุกบรรทัด'],
    ['cash', 'เครดิตและกระแสเงินรายเดือน', 'โอนเข้า ตัดไป และคงเหลือ ทั้งฝั่งโรงงานและฝั่งผู้ซื้อ'],
    ['raw', 'รายการดิบทุกเที่ยว', 'ทุกคู่รถ ทะเบียน น้ำหนักสองฝั่ง ปลายทาง และค่าใช้จ่ายรายคัน']
  ];
  var RP_FMT = [['xlsx', 'Excel (.xlsx)'], ['csv', 'CSV'], ['pdf', 'PDF'], ['json', 'JSON']];
  var RP_RANGE = [['month', 'เดือนนี้'], ['prev', 'เดือนก่อน'], ['3m', '3 เดือนล่าสุด'],
                  ['year', 'ปีนี้'], ['all', 'ทั้งหมด'], ['custom', 'กำหนดเอง']];

  function rpPad(n) { return (n < 10 ? '0' : '') + n; }
  function rpYmd(d) { return d.getFullYear() + '-' + rpPad(d.getMonth() + 1) + '-' + rpPad(d.getDate()); }

  function rpBounds() {
    var d = new Date(), y = d.getFullYear(), m = d.getMonth();
    if (RP.range === 'custom') { return { from: RP.from || '0000-01-01', to: RP.to || '9999-12-31' }; }
    if (RP.range === 'all') { return { from: '0000-01-01', to: '9999-12-31' }; }
    if (RP.range === 'prev') { return { from: rpYmd(new Date(y, m - 1, 1)), to: rpYmd(new Date(y, m, 0)) }; }
    if (RP.range === 'month') { return { from: rpYmd(new Date(y, m, 1)), to: rpYmd(d) }; }
    if (RP.range === 'year') { return { from: rpYmd(new Date(y, 0, 1)), to: rpYmd(d) }; }
    return { from: rpYmd(new Date(y, m - 2, 1)), to: rpYmd(d) };
  }
  function rpRangeLabel() {
    var o = {};
    RP_RANGE.forEach(function (x) { o[x[0]] = x[1]; });
    var b = rpBounds();
    if (RP.range === 'all') { return 'ทุกช่วงเวลา'; }
    return (o[RP.range] || '') + ' · ' + b.from + ' ถึง ' + b.to;
  }

  /* ตัวเลือกที่มีอยู่จริงในข้อมูล เอาไว้สร้างปุ่มตัวกรอง */
  function rpChoices() {
    var cus = {}, prov = {}, car = {};
    S.entries.forEach(function (e) {
      if (e.kind !== 'import' || !e.trucks) { return; }
      e.trucks.forEach(function (t) {
        var c = t.destId ? cusById(t.destId) : null;
        if (c) { cus[c.id] = c.name; if (c.province) { prov[c.province] = c.province; } }
        else if (t.dest) { cus['~' + t.dest] = t.dest; }
        if (t.lao && t.lao.company) { car[t.lao.company] = 'ลาว'; }
        if (t.thai && t.thai.company) { car[t.thai.company] = 'ไทย'; }
      });
    });
    return { cus: cus, prov: prov, car: car };
  }
  function rpOn(map, key) { return !Object.keys(map).length || !!map[key]; }

  /* รวบรวมข้อมูลตามตัวกรอง คืนค่าเป็นก้อนเดียวให้ทั้งจอและไฟล์ใช้ */
  function rpData() {
    var bd = rpBounds(), c = compute();
    var tr = [], mon = {}, cash = {}, byCus = {}, byProv = {}, byAmp = {}, byCar = {};
    var tot = { tons: 0, tonsThai: 0, loss: 0, fAmt: 0, ship: 0, shipThai: 0, scan: 0, rev: 0, trucks: 0 };

    function M(ym) {
      if (!mon[ym]) {
        mon[ym] = { ym: ym, tons: 0, tonsThai: 0, loss: 0, fAmt: 0, ship: 0, shipThai: 0, scan: 0, rev: 0, trucks: 0 };
      }
      return mon[ym];
    }
    function C(ym) {
      if (!cash[ym]) { cash[ym] = { ym: ym, fIn: 0, fCut: 0, jIn: 0, jCut: 0 }; }
      return cash[ym];
    }

    c.rows.forEach(function (w) {
      var e = w.e;
      if (e.date < bd.from || e.date > bd.to) { return; }
      var ym = String(e.date).slice(0, 7);

      if (e.kind === 'import') {
        (w.items || []).forEach(function (it) {
          if (!RP.ty[it.type]) { return; }
          var cu = it.destId ? cusById(it.destId) : null;
          var cid = cu ? cu.id : (it.dest ? '~' + it.dest : '~ยังไม่ระบุ');
          var cname = cu ? cu.name : (it.dest || 'ยังไม่ระบุปลายทาง');
          var pv = cu && cu.province ? cu.province : 'ไม่ระบุจังหวัด';
          var am = cu && cu.amphoe ? cu.amphoe : 'ไม่ระบุอำเภอ';
          var laoCo = (it.lao && it.lao.company) || 'ไม่ระบุ';
          var thaiCo = (it.thai && it.thai.company) || 'ไม่ระบุ';
          if (!rpOn(RP.cus, cid)) { return; }
          if (!rpOn(RP.prov, pv)) { return; }
          if (!rpOn(RP.car, laoCo) && !rpOn(RP.car, thaiCo)) { return; }

          var cost = it.fAmt + it.shipAmt + it.thaiAmt + it.scan;
          var row = {
            date: e.date, ym: ym, type: it.type, typeTH: it.type === 'bag' ? 'ปูนถุง' : 'ปูนผง',
            brand: it.brand || '', laoCo: laoCo, laoPlate: it.plateLao || '',
            thaiCo: thaiCo, thaiPlate: it.plateThai || '',
            driver: (it.thai && it.thai.driver) || '',
            tons: it.tons, tonsThai: it.tonsThai, loss: it.loss,
            cus: cname, prov: pv, amp: am,
            fAmt: it.fAmt, ship: it.shipAmt, shipThai: it.thaiAmt, scan: it.scan, cost: cost
          };
          tr.push(row);

          var m = M(ym);
          m.tons += it.tons; m.tonsThai += it.tonsThai; m.loss += it.loss;
          m.fAmt += it.fAmt; m.ship += it.shipAmt; m.shipThai += it.thaiAmt; m.scan += it.scan; m.trucks += 1;
          tot.tons += it.tons; tot.tonsThai += it.tonsThai; tot.loss += it.loss;
          tot.fAmt += it.fAmt; tot.ship += it.shipAmt; tot.shipThai += it.thaiAmt; tot.scan += it.scan; tot.trucks += 1;

          function acc(box, key, label) {
            if (!box[key]) { box[key] = { key: key, label: label, trucks: 0, tons: 0, tonsThai: 0, amt: 0 }; }
            box[key].trucks += 1; box[key].tons += it.tons; box[key].tonsThai += it.tonsThai;
          }
          acc(byCus, cid, cname); acc(byProv, pv, pv); acc(byAmp, am + ' · ' + pv, am + ' · ' + pv);
          if (!byCar[laoCo + '|ลาว']) { byCar[laoCo + '|ลาว'] = { co: laoCo, side: 'ลาว', trucks: 0, tons: 0, amt: 0 }; }
          byCar[laoCo + '|ลาว'].trucks += 1;
          byCar[laoCo + '|ลาว'].tons += it.tons;
          byCar[laoCo + '|ลาว'].amt += it.shipAmt;
          if (!byCar[thaiCo + '|ไทย']) { byCar[thaiCo + '|ไทย'] = { co: thaiCo, side: 'ไทย', trucks: 0, tons: 0, amt: 0 }; }
          byCar[thaiCo + '|ไทย'].trucks += 1;
          byCar[thaiCo + '|ไทย'].tons += it.tonsThai;
          byCar[thaiCo + '|ไทย'].amt += it.thaiAmt;
        });
      }

      if (e.kind === 'saleBuyer' || e.kind === 'saleOther') {
        M(ym).rev += w.rev; tot.rev += w.rev;
      }
      var cc = C(ym);
      cc.fIn += w.fIn; cc.fCut += w.fAmt; cc.jIn += w.jIn; cc.jCut += w.jAmt;
    });

    function sorted(box, by) {
      return Object.keys(box).map(function (k) { return box[k]; })
        .sort(function (a, b) { return (b[by] || 0) - (a[by] || 0); });
    }
    return {
      bounds: bd, rows: tr, tot: tot,
      months: Object.keys(mon).sort().map(function (k) { return mon[k]; }),
      cash: Object.keys(cash).sort().map(function (k) { return cash[k]; }),
      cus: sorted(byCus, 'tonsThai'), prov: sorted(byProv, 'tonsThai'),
      amp: sorted(byAmp, 'tonsThai'), car: sorted(byCar, 'tons'),
      loss: tr.slice().sort(function (a, b) { return b.loss - a.loss; })
    };
  }

  /* แปลงข้อมูลเป็นชุดตาราง ใช้ทั้งแสดงบนจอ ทำไฟล์ และพิมพ์ */
  function rpSheets(d) {

               'รอบนำเข้า', 'น้ำหนัก (ตัน)', 'ราคาต่อหน่วย (บาท)', 'รวมเป็นเงิน (บาท)', 'ยอดเงินคงเหลือ (บาท)'],
        rows: F.rows.map(function (r) {

          return [r.open ? '' : n, r.load ? thDate(r.load) : '', r.cross ? thDate(r.cross) : '',
                  r.item, r.plate, r.wb, r.inv,
                  r.tons === null ? '' : num(r.tons),

                  r.amt === null ? '' : num(r.amt),
                  num(r.bal)];
        }).concat([['รวม', '', '', 'โอนเข้า ' + m2(F.sumIn) + ' · ตัดเงิน ' + m2(F.sumCut),
                    '', '', '', num(F.sumTons), '', num(F.sumIn - F.sumCut), num(F.close)]]) });
    }

    if (RP.sec.decl) {
      var dr = declRows();
      out.push({ key: 'decl', title: 'ตรวจค่าชิปปิ้งไทยต่อใบขน',
        head: ['ใบขนสินค้า', 'Invoice', 'ผ่านด่านวันแรก', 'ผ่านด่านวันสุดท้าย', 'จำนวนคัน',
               'ราคาต่อหน่วย (บาท/คัน)', 'จำนวนเงิน (บาท)', 'น้ำหนักชั่งไทย (ตัน)',
               'ค่าชิปปิ้งต่อตัน (บาท)', 'ทะเบียนรถไทย'],
        rows: dr.map(function (g) {
          return [g.decl, g.inv, thDate(g.from), thDate(g.to), g.trucks,
                  num(g.perTruck), num(g.amt), num(g.tons), num(g.perTon), g.plates.join(' · ')];
        }).concat([['รวม', '', '', '',
                    dr.reduce(function (s, g) { return s + g.trucks; }, 0), '',
                    num(dr.reduce(function (s, g) { return s + g.amt; }, 0)),
                    num(dr.reduce(function (s, g) { return s + g.tons; }, 0)), '', '']]) });
    }

    if (RP.sec.pnl) {
      out.push({ key: 'pnl', title: 'ต้นทุนและยอดขายรายเดือน',
        head: ['เดือน', 'คู่รถ', 'ตันฝั่งลาว', 'ตันฝั่งไทย', 'ค่าปูนที่โรงงาน', 'ชิปปิ้งลาว', 'ชิปปิ้งไทย', 'เอกซเรย์', 'รวมต้นทุน', 'ยอดขายในเดือน', 'ส่วนต่าง'],
        rows: d.months.map(function (m) {
          var cost = m.fAmt + m.ship + m.shipThai + m.scan;
          return [monthTH(m.ym), m.trucks, num(m.tons), num(m.tonsThai), num(m.fAmt), num(m.ship),
                  num(m.shipThai), num(m.scan), num(cost), num(m.rev), num(m.rev - cost)];
        }) });
    }
    if (RP.sec.loss) {
      out.push({ key: 'loss', title: 'น้ำหนักสูญเสียจากการถ่ายปูน',
        head: ['วันที่', 'ชนิดปูน', 'ทะเบียนลาว', 'ทะเบียนไทย', 'ตันฝั่งลาว', 'ตันฝั่งไทย', 'ส่วนต่าง (ตัน)'],
        rows: d.loss.slice(0, 50).map(function (r) {
          return [r.date, r.typeTH, r.laoPlate || '—', r.thaiPlate || '—', num(r.tons), num(r.tonsThai), num(r.loss)];
        }) });
    }
    if (RP.sec.cust) {
      out.push({ key: 'cust', title: 'แยกตามลูกค้าปลายทาง',
        head: ['ลูกค้า', 'เที่ยว', 'ตันฝั่งไทย'],
        rows: d.cus.map(function (x) { return [x.label, x.trucks, num(x.tonsThai)]; }) });
      out.push({ key: 'area', title: 'แยกตามจังหวัดและอำเภอ',
        head: ['พื้นที่', 'เที่ยว', 'ตันฝั่งไทย'],
        rows: d.prov.map(function (x) { return ['จ.' + x.label, x.trucks, num(x.tonsThai)]; })
          .concat(d.amp.map(function (x) { return ['อ.' + x.label, x.trucks, num(x.tonsThai)]; })) });
    }
    if (RP.sec.ship) {
      out.push({ key: 'ship', title: 'ค่าชิปปิ้งแยกตามผู้ขนส่ง',
        head: ['ผู้ขนส่ง', 'ฝั่ง', 'เที่ยว', 'ตัน', 'ค่าขนส่งรวม', 'บาทต่อตัน'],
        rows: d.car.map(function (x) {
          return [x.co, x.side, x.trucks, num(x.tons), num(x.amt), x.tons ? num(x.amt / x.tons) : 0];
        }) });
    }
    if (RP.sec.cash) {
      out.push({ key: 'cash', title: 'เครดิตและกระแสเงินรายเดือน',
        head: ['เดือน', 'โอนให้โรงงาน', 'ตัดค่าปูน', 'ผู้ซื้อโอนเข้า', 'ตัดตอนส่งมอบ'],
        rows: d.cash.map(function (m) { return [monthTH(m.ym), num(m.fIn), num(m.fCut), num(m.jIn), num(m.jCut)]; }) });
    }
    if (RP.sec.raw) {
      out.push({ key: 'raw', title: 'รายการดิบทุกเที่ยว',
        head: ['วันที่', 'ชนิดปูน', 'ยี่ห้อ', 'ผู้ขนส่งลาว', 'ทะเบียนลาว', 'ตันลาว', 'ผู้ขนส่งไทย', 'ทะเบียนไทย',
               'ตันไทย', 'ส่วนต่าง', 'พนักงานขับรถ', 'ลูกค้าปลายทาง', 'อำเภอ', 'จังหวัด',
               'ค่าปูน', 'ชิปปิ้งลาว', 'ชิปปิ้งไทย', 'เอกซเรย์', 'รวมต้นทุนคันนี้'],
        rows: d.rows.map(function (r) {
          return [r.date, r.typeTH, r.brand, r.laoCo, r.laoPlate, num(r.tons), r.thaiCo, r.thaiPlate,
                  num(r.tonsThai), num(r.loss), r.driver, r.cus, r.amp, r.prov,
                  num(r.fAmt), num(r.ship), num(r.shipThai), num(r.scan), num(r.cost)];
        }) });
    }
    return out;
  }

  /* ---------- หน้าตั้งค่ารายงาน ---------- */
  function rpChip(group, key, label, on) {

  function rpGroup(title, quick, inner) {
    return '<div style="margin-bottom:14px">' +

  /* ---------- แดชบอร์ดบนจอ ---------- */
  function rpKpi(lab, val, sub, col) {
    return '<div class="card" style="box-shadow:none;margin:0"><div class="card-b">' +
      '<p class="note" style="margin:0 0 4px">' + esc(lab) + '</p>' +
      '<b class="num" style="font-size:24px;font-weight:700;color:' + (col || 'var(--head)') + '">' + val + '</b>' +
      '<p class="hint" style="margin-top:3px">' + sub + '</p></div></div>';
  }
  function rpChart(months) {
    if (!months.length) { return '<p class="note">ยังไม่มีข้อมูลในช่วงนี้</p>'; }
    var W = 660, H = 190, pad = 26, n = months.length;
    var max = 0;
    months.forEach(function (m) {
      var cost = m.fAmt + m.ship + m.shipThai + m.scan;
      max = Math.max(max, cost, m.rev);
    });
    if (max <= 0) { max = 1; }
    /* เดือนน้อยอย่าให้แท่งอ้วนจนเต็มจอ จำกัดความกว้างแล้วจัดกึ่งกลางแทน */
    var bw = Math.min(96, (W - pad * 2) / n);
    var left = (W - bw * n) / 2;
    var bars = months.map(function (m, i) {
      var cost = m.fAmt + m.ship + m.shipThai + m.scan;
      var x = left + i * bw;
      var hr = (m.rev / max) * (H - 46), hc = (cost / max) * (H - 46);
      return '<rect x="' + (x + 6) + '" y="' + (H - 26 - hr) + '" width="' + Math.max(4, bw / 2 - 8) +
        '" height="' + hr + '" rx="3" fill="var(--brand)"></rect>' +
        '<rect x="' + (x + bw / 2 + 2) + '" y="' + (H - 26 - hc) + '" width="' + Math.max(4, bw / 2 - 8) +
        '" height="' + hc + '" rx="3" fill="var(--line)"></rect>' +
        '<text x="' + (x + bw / 2) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="11" ' +
        'fill="var(--muted)">' + esc(monthTH(m.ym).replace(/ \d+$/, '')) + '</text>';
    }).join('');
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto" role="img" ' +
      'aria-label="กราฟยอดขายเทียบต้นทุนรายเดือน">' + bars + '</svg>';
  }
  function rpTable(s) {
    if (!s.rows.length) {
      return '<p class="note" style="padding:14px 0">ไม่มีข้อมูลในหัวข้อนี้ตามตัวกรองที่เลือก</p>';
    }
    return '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">' +
      '<thead><tr>' + s.head.map(function (h, i) {
        return '<th style="padding:8px 10px;font-size:11.5px;text-align:' + (i ? 'right' : 'left') +
          ';background:var(--brand);color:#fff;white-space:nowrap">' + esc(h) + '</th>';
      }).join('') + '</tr></thead><tbody>' +
      s.rows.slice(0, 300).map(function (r, ri) {
        return '<tr style="background:' + (ri % 2 ? 'var(--page)' : 'transparent') + '">' +
          r.map(function (v, i) {
            var txt = typeof v === 'number' ? m2(v) : String(v == null ? '' : v);
            /* ไฟล์เก็บวันที่แบบ ปี-เดือน-วัน เพื่อให้เรียงลำดับใน Excel ได้ แต่บนจอแสดงเป็นวันที่ไทย */
            if (/^\d{4}-\d{2}-\d{2}$/.test(txt)) { txt = dtTH(txt); }
            return '<td style="padding:7px 10px;font-size:12.5px;white-space:nowrap;text-align:' +
              (i ? 'right' : 'left') + '">' + esc(txt) + '</td>';
          }).join('') + '</tr>';
      }).join('') + '</tbody></table>' +
      (s.rows.length > 300 ? '<p class="hint" style="margin-top:8px">แสดง 300 บรรทัดแรกจาก ' +
        s.rows.length + ' บรรทัด ไฟล์ที่ดาวน์โหลดได้ครบทุกบรรทัด</p>' : '') + '</div>';
  }

      sheets.filter(function (s) { return s.key !== 'loss'; }).map(function (s) {

  /* ---------- ทำไฟล์ ---------- */
  function rpCsvCell(v) {
    var s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function rpSave(name, text, mime) {
    var blob = (text instanceof Blob) ? text : new Blob(['﻿' + text], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function rpStamp() {
    var d = new Date();
    return d.getFullYear() + rpPad(d.getMonth() + 1) + rpPad(d.getDate()) + '-' + rpPad(d.getHours()) + rpPad(d.getMinutes());
  }
  function rpCsvText(sheets) {
    return sheets.map(function (s) {
      return [s.title].concat([s.head.map(rpCsvCell).join(',')])
        .concat(s.rows.map(function (r) { return r.map(rpCsvCell).join(','); })).join('\n');
    }).join('\n\n');
  }
  function rpXlsx(sheets, done) {
    function build() {
      var XLSX = window.XLSX;
      if (!XLSX) { done(false); return; }
      var wb = XLSX.utils.book_new();
      sheets.forEach(function (s, i) {
        var aoa = [[s.title]].concat([s.head]).concat(s.rows);
        var ws = XLSX.utils.aoa_to_sheet(aoa);
        var nm2 = (s.title || ('ชุด' + (i + 1))).slice(0, 28).replace(/[\\\/\?\*\[\]:]/g, ' ');
        XLSX.utils.book_append_sheet(wb, ws, nm2 || ('ชุด' + (i + 1)));
      });
      XLSX.writeFile(wb, 'bluestone-report-' + rpStamp() + '.xlsx');
      done(true);
    }
    if (window.XLSX) { build(); return; }
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = build;
    sc.onerror = function () { done(false); };
    document.head.appendChild(sc);
  }
  function rpPrint() {
    if (RP.view !== 'dash') { RP.view = 'dash'; viewExport(); }
    setTimeout(function () { window.print(); }, 350);
  }
  function rpDownload() {
    var d = rpData(), sheets = rpSheets(d);
    if (!sheets.length) { toast('ยังไม่ได้เลือกหัวข้อที่จะส่งออก'); return; }
    var any = false;
    if (RP.fmt.json) {
      any = true;
      rpSave('bluestone-report-' + rpStamp() + '.json',
        JSON.stringify({ ช่วงเวลา: rpRangeLabel(), สร้างเมื่อ: new Date().toISOString(), ชุดข้อมูล: sheets }, null, 2),
        'application/json;charset=utf-8');
    }
    if (RP.fmt.csv) {
      any = true;
      rpSave('bluestone-report-' + rpStamp() + '.csv', rpCsvText(sheets), 'text/csv;charset=utf-8');
    }
    if (RP.fmt.xlsx) {
      any = true;
      toast('กำลังสร้างไฟล์ Excel...');
      rpXlsx(sheets, function (ok) {
        if (ok) { toast('ดาวน์โหลดไฟล์ Excel แล้ว'); return; }
        rpSave('bluestone-report-' + rpStamp() + '.csv', rpCsvText(sheets), 'text/csv;charset=utf-8');
        toast('โหลดตัวทำไฟล์ Excel ไม่สำเร็จ ส่งออกเป็น CSV ให้แทน');
      });
    }
    if (RP.fmt.pdf) { any = true; rpPrint(); }
    if (!any) { toast('ยังไม่ได้เลือกรูปแบบไฟล์'); }
    else { logIt('ส่งออกรายงาน', rpRangeLabel() + ' · ' + sheets.length + ' ชุดข้อมูล'); }
  }

  function bindExport() {
    Array.prototype.forEach.call(el('v-export').querySelectorAll('[data-rp]'), function (lb) {
      lb.addEventListener('click', function (ev) {
        if (ev.target && ev.target.tagName === 'INPUT') { return; }
        ev.preventDefault();
        lb.querySelector('input').click();
      });
      lb.querySelector('input').addEventListener('change', function () {
        var pp = lb.getAttribute('data-rp').split(':');
        var g = pp[0], k = pp.slice(1).join(':');
        if (g === 'range') { RP.range = k; }
        else if (g === 'ty') { RP.ty[k] = this.checked; }
        else if (g === 'sec') { RP.sec[k] = this.checked ? 1 : 0; }
        else if (g === 'fmt') { RP.fmt[k] = this.checked ? 1 : 0; }
        else {
          var box = g === 'cus' ? RP.cus : (g === 'prov' ? RP.prov : RP.car);
          var all = rpChoices()[g];
          if (!Object.keys(box).length) { Object.keys(all).forEach(function (x) { box[x] = 1; }); }
          if (this.checked) { box[k] = 1; } else { delete box[k]; }
          if (Object.keys(box).length === Object.keys(all).length) { /* ครบแล้วถือว่าเลือกทั้งหมด */ }
        }
        viewExport();
      });
    });
    Array.prototype.forEach.call(el('v-export').querySelectorAll('[data-rpall]'), function (b) {
      b.addEventListener('click', function () {
        var g = b.getAttribute('data-rpall');
        var box = g === 'cus' ? RP.cus : (g === 'prov' ? RP.prov : RP.car);
        if (Object.keys(box).length) { if (g === 'cus') { RP.cus = {}; } else if (g === 'prov') { RP.prov = {}; } else { RP.car = {}; } }
        else {
          var all = rpChoices()[g];
          Object.keys(all).forEach(function (k) { box[k] = 1; });
          delete box[Object.keys(all)[0]];
        }
        viewExport();
      });
    });
    if (el('rpFrom')) { el('rpFrom').addEventListener('change', function () { RP.from = this.value; viewExport(); }); }
    if (el('rpTo')) { el('rpTo').addEventListener('change', function () { RP.to = this.value; viewExport(); }); }
    if (el('rpDash')) { el('rpDash').addEventListener('click', function () { RP.view = 'dash'; viewExport(); }); }
    if (el('rpBack')) { el('rpBack').addEventListener('click', function () { RP.view = 'setup'; viewExport(); }); }
    if (el('rpPrint')) { el('rpPrint').addEventListener('click', rpPrint); }
    if (el('rpDown')) { el('rpDown').addEventListener('click', rpDownload); }
  }

  /* ================= โปรไฟล์บนแถบบน ================= */
  /* ---- ย่อรูปโปรไฟล์ ----
     รูปจากกล้องมือถือมักใหญ่หลายเมกะไบต์ ถ้าเก็บทั้งไฟล์จะกินพื้นที่ในเบราว์เซอร์จนเต็ม
     หน้าเว็บแสดงรูปนี้ใหญ่สุด 48 จุด ย่อด้านยาวเหลือ 320 จุดจึงเกินพอแม้บนจอความละเอียดสูง */
  var PIC_MAX = 320;       /* ด้านยาวสุดหลังย่อ หน่วยเป็นจุดภาพ */
  var PIC_BYTES = 120000;  /* ขนาดที่ยอมให้เก็บหลังย่อ ประมาณ 120 KB */

  /* ---- กล่องจัดตำแหน่งรูปโปรไฟล์ ----
     เดิมเลือกไฟล์แล้วตัดกลางภาพทันที รูปแนวตั้งจึงโดนตัดหัว
     ตอนนี้เปิดกล่องให้ลากเลื่อนและย่อขยายก่อน เห็นกรอบวงกลมจริงว่าจะถูกตัดตรงไหน
     ภาพที่เห็นกับภาพที่บันทึกใช้สูตรเดียวกัน ต่างแค่ตัวคูณขนาด จึงได้ตรงกับที่เห็น */
  function cropPic(file, done) {
    var fr = new FileReader();
    fr.onerror = function () { toast('อ่านไฟล์ไม่สำเร็จ'); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { toast('ไฟล์นี้เปิดเป็นรูปภาพไม่ได้'); };
      img.onload = function () { cropUI(img, done); };
      img.src = String(fr.result);
    };
    fr.readAsDataURL(file);
  }

  function cropUI(img, done) {
    var V = 320;                       /* ขนาดผืนที่ใช้วาดบนจอ */
    var st = { s: 1, ox: 0, oy: 0, rot: 0 };
    var old = el('cropOv');
    if (old) { old.remove(); }

    var ov = document.createElement('div');
    ov.id = 'cropOv';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-label', 'จัดตำแหน่งรูปโปรไฟล์');
    ov.style.cssText = 'position:fixed;inset:0;z-index:95;background:rgba(14,12,60,.45);' +
      'display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML = '<div style="width:min(430px,100%);max-height:92vh;overflow:auto;background:var(--card);' +
      'border-radius:16px;box-shadow:0 26px 60px rgba(14,12,60,.34);padding:18px 20px 20px">' +
      '<h2 style="margin:0 0 3px;font-size:16px;color:var(--head)">จัดตำแหน่งรูป</h2>' +
      '<p class="note" style="margin:0 0 13px">ลากรูปให้ได้ตำแหน่งที่ต้องการ แล้วเลื่อนแถบเพื่อย่อขยาย</p>' +
      '<canvas id="cropCv" width="' + V + '" height="' + V + '" ' +
        'style="display:block;width:100%;aspect-ratio:1/1;border-radius:12px;background:#20233f;' +
        'touch-action:none;cursor:grab"></canvas>' +
      '<div style="display:flex;align-items:center;gap:11px;margin-top:14px">' +
        '<span style="font-size:17px;color:var(--muted)">−</span>' +
        '<input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1" ' +
          'aria-label="ย่อขยายรูป" style="flex:1 1 auto;accent-color:var(--brand)">' +
        '<span style="font-size:17px;color:var(--muted)">+</span>' +
        '<button type="button" class="btn sm" id="cropRot" title="หมุน 90 องศา">หมุน</button>' +
      '</div>' +
      '<p class="hint" style="margin-top:10px">บันทึกเป็นรูปสี่เหลี่ยมจัตุรัส 320 จุด ระบบย่อและตัดขอบให้เอง</p>' +
      '<div class="actions" style="margin-top:14px;justify-content:flex-end">' +
        '<button type="button" class="btn" id="cropOther">เลือกรูปอื่น</button>' +
        '<button type="button" class="btn" id="cropNo">ยกเลิก</button>' +
        '<button type="button" class="btn pri" id="cropOk">ใช้รูปนี้</button>' +
      '</div></div>';
    document.body.appendChild(ov);

    var cv = el('cropCv'), cx = cv.getContext('2d');

    function dims() {
      var side = (st.rot % 180 === 0);
      return { sw: side ? img.width : img.height, sh: side ? img.height : img.width };
    }
    function paint() {
      var d = dims();
      var k = Math.max(V / d.sw, V / d.sh) * st.s;
      var mx = Math.max(0, (d.sw * k - V) / 2), my = Math.max(0, (d.sh * k - V) / 2);
      st.ox = Math.min(mx, Math.max(-mx, st.ox));
      st.oy = Math.min(my, Math.max(-my, st.oy));
      cx.save();
      cx.fillStyle = '#20233f'; cx.fillRect(0, 0, V, V);
      cx.translate(V / 2 + st.ox, V / 2 + st.oy);
      cx.rotate(st.rot * Math.PI / 180);
      cx.drawImage(img, -img.width * k / 2, -img.height * k / 2, img.width * k, img.height * k);
      cx.restore();
      /* หน้ากากวงกลมบอกขอบเขตที่จะถูกตัด ไม่ได้ติดไปกับไฟล์ที่บันทึก */
      cx.save();
      cx.fillStyle = 'rgba(16,18,42,.55)';
      cx.beginPath();
      cx.rect(0, 0, V, V);
      cx.arc(V / 2, V / 2, V / 2 - 2, 0, Math.PI * 2, true);
      cx.fill('evenodd');
      cx.strokeStyle = 'rgba(255,255,255,.92)'; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(V / 2, V / 2, V / 2 - 2, 0, Math.PI * 2); cx.stroke();
      cx.restore();
    }

    var drag = null;
    function pos(ev) {
      var r = cv.getBoundingClientRect();
      return { x: (ev.clientX - r.left) * (V / r.width), y: (ev.clientY - r.top) * (V / r.height) };
    }
    cv.addEventListener('pointerdown', function (ev) {
      drag = pos(ev); cv.setPointerCapture(ev.pointerId); cv.style.cursor = 'grabbing';
    });
    cv.addEventListener('pointermove', function (ev) {
      if (!drag) { return; }
      var q = pos(ev);
      st.ox += q.x - drag.x; st.oy += q.y - drag.y;
      drag = q; paint();
    });
    function stop() { drag = null; cv.style.cursor = 'grab'; }
    cv.addEventListener('pointerup', stop);
    cv.addEventListener('pointercancel', stop);
    cv.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      st.s = Math.min(3, Math.max(1, st.s + (ev.deltaY < 0 ? 0.08 : -0.08)));
      el('cropZoom').value = st.s; paint();
    }, { passive: false });

    el('cropZoom').addEventListener('input', function () { st.s = parseFloat(this.value) || 1; paint(); });
    el('cropRot').addEventListener('click', function () {
      st.rot = (st.rot + 90) % 360; st.ox = 0; st.oy = 0; paint();
    });
    el('cropNo').addEventListener('click', function () { ov.remove(); });
    el('cropOther').addEventListener('click', function () {
      ov.remove();
      if (el('ppPhoto')) { el('ppPhoto').click(); }
    });
    el('cropOk').addEventListener('click', function () {
      var OUT = 320, r = OUT / V, d = dims();
      var k = Math.max(OUT / d.sw, OUT / d.sh) * st.s;
      var c2 = document.createElement('canvas');
      c2.width = OUT; c2.height = OUT;
      var x2 = c2.getContext('2d');
      x2.fillStyle = '#ffffff'; x2.fillRect(0, 0, OUT, OUT);
      x2.translate(OUT / 2 + st.ox * r, OUT / 2 + st.oy * r);
      x2.rotate(st.rot * Math.PI / 180);
      x2.drawImage(img, -img.width * k / 2, -img.height * k / 2, img.width * k, img.height * k);
      var q = 0.85, u = c2.toDataURL('image/jpeg', q);
      while (u.length * 0.75 > PIC_BYTES && q > 0.4) { q -= 0.12; u = c2.toDataURL('image/jpeg', q); }
      ov.remove();
      done(u, Math.round(u.length * 0.75));
    });

    paint();
  }

  /* ปุ่มรูปตาเปิดดูรหัสที่พิมพ์ ใช้กับช่องรหัสผ่านทุกช่องในแอป */
  var ICON_EYE = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"/>' +
    '<circle cx="12" cy="12" r="3.2"/></svg>';
  var ICON_EYE_OFF = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" ' +
    'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M2.5 12S6 5.8 12 5.8c1.6 0 3 .4 4.2 1M21.5 12S18 18.2 12 18.2c-1.7 0-3.1-.5-4.3-1.1"/>' +
    '<path d="M9.8 9.9a3.2 3.2 0 0 0 4.4 4.5M3 3l18 18"/></svg>';

  function pwField(id, label, hint, ac) {
    return '<div><label class="fl" for="' + id + '">' + label + '</label>' +
      '<div style="position:relative">' +
        '<input id="' + id + '" type="password" autocomplete="' + ac + '" style="padding-right:44px">' +
        '<button type="button" data-eye="' + id + '" aria-label="แสดงรหัสผ่าน" title="เปิดดูรหัสที่พิมพ์" ' +
        'style="position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;' +
        'display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;' +
        'background:transparent;color:var(--muted);cursor:pointer;padding:0">' + ICON_EYE + '</button>' +
      '</div>' +
      (hint ? '<p class="hint">' + hint + '</p>' : '') + '</div>';
  }

  function bindEyes(host) {
    Array.prototype.forEach.call((host || document).querySelectorAll('[data-eye]'), function (b) {
      b.addEventListener('click', function () {
        var inp = el(b.getAttribute('data-eye'));
        if (!inp) { return; }
        var show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        b.innerHTML = show ? ICON_EYE_OFF : ICON_EYE;
        b.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
        b.setAttribute('title', show ? 'ซ่อนรหัสที่พิมพ์' : 'เปิดดูรหัสที่พิมพ์');
        inp.focus();
      });
    });
  }

  /* ---- เปลี่ยนรหัสผ่านของตัวเอง ----
     ยืนยันรหัสเดิมก่อนเสมอ กันคนอื่นมาเปลี่ยนรหัสจากเครื่องที่เปิดค้างไว้ */
  function pwChangeUI() {
    if (!SB.client) { toast('ยังไม่ได้เชื่อมฐานข้อมูล จึงเปลี่ยนรหัสผ่านไม่ได้'); return; }
    var old = el('pwOv');
    if (old) { old.remove(); }
    var ov = document.createElement('div');
    ov.id = 'pwOv';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-label', 'เปลี่ยนรหัสผ่าน');
    ov.style.cssText = 'position:fixed;inset:0;z-index:95;background:rgba(14,12,60,.45);' +
      'display:flex;align-items:center;justify-content:center;padding:20px';
    ov.innerHTML = '<div style="width:min(420px,100%);background:var(--card);border-radius:16px;' +
      'box-shadow:0 26px 60px rgba(14,12,60,.34);padding:18px 20px 20px">' +
      '<h2 style="margin:0 0 3px;font-size:16px;color:var(--head)">เปลี่ยนรหัสผ่าน</h2>' +
      '<p class="note" style="margin:0 0 13px">สำหรับ ' + esc(SB.email || 'บัญชีที่เข้าอยู่') + '</p>' +
      '<div class="stack" style="gap:9px">' +
        pwField('pwOld', 'รหัสผ่านเดิม', '', 'current-password') +
        pwField('pwNew', 'รหัสผ่านใหม่', 'อย่างน้อย 8 ตัว ผสมตัวอักษรกับตัวเลข', 'new-password') +
        pwField('pwNew2', 'พิมพ์รหัสใหม่อีกครั้ง', '', 'new-password') +
      '</div>' +
      '<p class="note" id="pwMsg" style="margin-top:10px"></p>' +
      '<div class="actions" style="margin-top:12px;justify-content:flex-end">' +
        '<button type="button" class="btn" id="pwNo">ยกเลิก</button>' +
        '<button type="button" class="btn pri" id="pwGo">บันทึกรหัสใหม่</button>' +
      '</div></div>';
    document.body.appendChild(ov);

    function msg(t) { el('pwMsg').textContent = t; }
    el('pwNo').addEventListener('click', function () { ov.remove(); });
    el('pwGo').addEventListener('click', function () {
      var o = el('pwOld').value, a = el('pwNew').value, b2 = el('pwNew2').value;
      if (!o) { msg('กรอกรหัสผ่านเดิมก่อน'); return; }
      if (a.length < 8) { msg('รหัสใหม่สั้นเกินไป ใส่อย่างน้อย 8 ตัว'); return; }
      if (a !== b2) { msg('รหัสใหม่สองช่องไม่ตรงกัน'); return; }
      if (a === o) { msg('รหัสใหม่ซ้ำกับรหัสเดิม'); return; }
      el('pwGo').disabled = true;
      msg('กำลังตรวจสอบรหัสเดิม...');
      SB.client.auth.signInWithPassword({ email: SB.email, password: o }).then(function (r1) {
        if (r1.error) { el('pwGo').disabled = false; msg('รหัสผ่านเดิมไม่ถูกต้อง'); return; }
        SB.client.auth.updateUser({ password: a }).then(function (r2) {
          el('pwGo').disabled = false;
          if (r2.error) { msg('เปลี่ยนไม่สำเร็จ: ' + r2.error.message); return; }
          ov.remove();
          logIt('เปลี่ยนรหัสผ่านเข้าระบบ', SB.email || '');
          toast('เปลี่ยนรหัสผ่านแล้ว ครั้งหน้าใช้รหัสใหม่เข้าระบบ');
        }, function (e2) { el('pwGo').disabled = false; msg('เปลี่ยนไม่สำเร็จ: ' + e2.message); });
      }, function (e1) { el('pwGo').disabled = false; msg('ตรวจสอบไม่สำเร็จ: ' + e1.message); });
    });
    bindEyes(ov);
    setTimeout(function () { if (el('pwOld')) { el('pwOld').focus(); } }, 30);
  }

  function shrinkPic(file, done) {
    var fr = new FileReader();
    fr.onerror = function () { done(new Error('อ่านไฟล์ไม่สำเร็จ')); };
    fr.onload = function () {
      var img = new Image();
      img.onerror = function () { done(new Error('ไฟล์นี้เปิดเป็นรูปภาพไม่ได้')); };
      img.onload = function () {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) { done(new Error('อ่านขนาดรูปไม่ได้')); return; }
        var k = Math.min(1, PIC_MAX / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
        var cv = document.createElement('canvas');
        cv.width = cw; cv.height = ch;
        var cx = cv.getContext('2d');
        /* ลงพื้นขาวก่อน กัน PNG พื้นโปร่งใสกลายเป็นพื้นดำตอนแปลงเป็น JPEG */
        cx.fillStyle = '#ffffff'; cx.fillRect(0, 0, cw, ch);
        cx.drawImage(img, 0, 0, cw, ch);
        var q = 0.82, out = cv.toDataURL('image/jpeg', q);
        while (out.length * 0.75 > PIC_BYTES && q > 0.4) {
          q -= 0.12; out = cv.toDataURL('image/jpeg', q);
        }
        done(null, { url: out, w: cw, h: ch, ow: w, oh: h, bytes: Math.round(out.length * 0.75) });
      };
      img.src = String(fr.result);
    };
    fr.readAsDataURL(file);
  }

  function avatarHTML(size) {
    var p = S.profile;
    if (p.photo) {
      return '<img src="' + esc(p.photo) + '" alt="รูปโปรไฟล์ของ ' + esc(p.name) + '" style="width:' + size + 'px;height:' + size +
        'px;border-radius:50%;object-fit:cover;background:#fff">';
    }
    var initial = (p.name || '?').trim().charAt(0);
    return '<span aria-hidden="true" style="display:inline-flex;align-items:center;justify-content:center;width:' + size + 'px;height:' + size +
      'px;border-radius:50%;background:var(--accent);color:#fff;font-weight:600;font-size:' + Math.round(size * 0.42) + 'px">' + esc(initial) + '</span>';
  }

  var profOpen = false;

  function profilePanel() {
    var p = S.profile;
    return '<div id="profPop" role="dialog" aria-label="แก้ไขโปรไฟล์" ' +
      'style="position:absolute;top:calc(100% + 10px);right:0;z-index:60;width:min(330px,calc(100vw - 32px));' +
      'text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);' +
      'border-radius:var(--r-md);box-shadow:0 18px 44px rgba(14,12,60,.26);padding:14px">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' + avatarHTML(48) +
        '<div class="actions" style="flex-wrap:wrap;gap:7px">' +
          '<label class="btn sec sm" for="ppPhoto" style="cursor:pointer;margin:0;position:relative">เปลี่ยนรูป' +
          '<input id="ppPhoto" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0"></label>' +
          (p.photo ? '<button type="button" class="btn sm" id="ppClear">เอารูปออก</button>' : '') +
        '</div></div>' +
      '<div class="stack" style="gap:9px">' +
        '<div><label class="fl" for="ppName">ชื่อที่แสดง</label>' +
        '<input id="ppName" type="text" value="' + esc(p.name) + '" maxlength="60"></div>' +
        '<div><label class="fl" for="ppRole">บทบาท</label><select id="ppRole">' +
        ['ผู้บริหาร', 'บัญชี', 'เซลล์'].map(function (x) {
          return '<option' + (p.role === x ? ' selected' : '') + '>' + x + '</option>';
        }).join('') + '</select></div>' +
        '<div><label class="fl" for="ppMail">อีเมลที่ใช้เข้าระบบ</label>' +
        '<input id="ppMail" type="text" value="' + esc(p.email) + '"></div>' +
      '</div>' +
      '<p class="hint">ระบบย่อรูปให้อัตโนมัติ เลือกไฟล์ใหญ่แค่ไหนก็ได้ · รูปเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น ไม่ได้อัปโหลดไปที่ใด</p>' +
      (SB.client
        ? '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)">' +
          '<p class="hint" style="margin:0 0 7px">เข้าสู่ระบบด้วย ' + esc(SB.email || 'บัญชีที่ผูกไว้') + '</p>' +
          '<button type="button" class="btn" id="ppPw" style="width:100%;margin-bottom:7px">เปลี่ยนรหัสผ่าน</button>' +
          '<button type="button" class="btn" id="ppOut" style="width:100%">ออกจากระบบ</button>' +
          '<p class="hint" style="margin-top:7px">ลืมรหัสผ่าน ให้ออกจากระบบแล้วกด "ลืมรหัสผ่าน" ที่หน้าเข้าสู่ระบบ ' +
          'ระบบจะส่งลิงก์ตั้งรหัสใหม่ไปที่อีเมลของคุณ</p></div>'
        : '') +
      '<div class="actions" style="justify-content:flex-end;margin-top:10px">' +
        '<button type="button" class="btn" id="ppClose">ปิด</button>' +
        '<button type="button" class="btn pri" id="ppSave">บันทึก</button></div></div>';
  }

  function outsideProf(ev) {
    var w = el('who');
    if (w && !w.contains(ev.target)) { profOpen = false; renderWho(); }
  }
  function escProf(ev) {
    if (ev.key === 'Escape' && profOpen) { profOpen = false; renderWho(); }
  }

  function renderWho() {
    var w = el('who');
    if (!w) { return; }
    w.style.position = 'relative';
    w.innerHTML = '<button type="button" class="tbtn" id="themeBtn">ธีม</button>' +
      '<button type="button" id="whoBtn" aria-haspopup="dialog" aria-expanded="' + (profOpen ? 'true' : 'false') + '" ' +
      'title="คลิกเพื่อแก้ไขโปรไฟล์" ' +
      'style="display:flex;align-items:center;gap:8px;color:inherit;background:none;border:0;font:inherit;' +
      'cursor:pointer;padding:3px 5px;border-radius:999px">' +
      '<span>' + esc(S.profile.name) + ' · ' + esc(S.profile.role) + '</span>' + avatarHTML(32) + '</button>' +
      (profOpen ? profilePanel() : '');
    el('themeBtn').addEventListener('click', toggleTheme);
    el('whoBtn').addEventListener('click', function () { profOpen = !profOpen; renderWho(); });

    document.removeEventListener('click', outsideProf, true);
    document.removeEventListener('keydown', escProf);
    if (!profOpen) { return; }
    document.addEventListener('click', outsideProf, true);
    document.addEventListener('keydown', escProf);

    el('ppPhoto').addEventListener('change', function () {
      var f = this.files && this.files[0];
      if (!f) { return; }
      if ((f.type || '').indexOf('image/') !== 0) { toast('เลือกได้เฉพาะไฟล์รูปภาพ'); return; }
      if (f.size > 25 * 1024 * 1024) { toast('ไฟล์ใหญ่เกิน 25 MB เปิดไม่ไหว ลองรูปอื่น'); return; }
      cropPic(f, function (url, bytes) {

  var TH_MON = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',

  var TH_MON_S = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

  var dtP = { key: '', withTime: true, y: 0, m: 0, d: 0, hh: 8, mm: 0 };

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* '2026-11-05T08:29' -> {y,m,d,hh,mm} ; คืน null ถ้าว่าง */
  function dtParse(v) {
    var s = String(v || '').trim();
    if (!s) { return null; }
    var p = s.split('T'), a = p[0].split('-');
    if (a.length < 3) { return null; }
    var t = (p[1] || '').split(':');
    return { y: parseInt(a[0], 10), m: parseInt(a[1], 10) - 1, d: parseInt(a[2], 10),
             hh: parseInt(t[0] || '0', 10) || 0, mm: parseInt(t[1] || '0', 10) || 0 };
  }
  function dtJoin(o, withTime) {
    var base = o.y + '-' + pad2(o.m + 1) + '-' + pad2(o.d);
    return withTime ? base + 'T' + pad2(o.hh) + ':' + pad2(o.mm) : base;
  }
  /* ข้อความไทยที่โชว์บนปุ่ม */
  function dtLabel(v, withTime) {
    var o = dtParse(v);
    if (!o) { return ''; }
    var txt = o.d + ' ' + TH_MON_S[o.m] + ' ' + pad2((o.y + 543) % 100);
    return withTime ? txt + ' เวลา ' + pad2(o.hh) + ':' + pad2(o.mm) + ' น.' : txt;
  }

  /* ช่องเลือกวันเวลา: input ซ่อนไว้เพื่อให้ตัวจับ event เดิมทำงานเหมือนเดิม */

      'style="display:flex;align-items:center;gap:8px;width:100%;min-height:' + (small ? '38' : '42') + 'px;' +
      'padding:' + (small ? '7px 10px' : '9px 12px') + ';font:inherit;font-size:' + (small ? '12.5' : '13.5') + 'px;' +
      'text-align:left;cursor:pointer;color:' + (lab ? 'var(--ink)' : 'var(--muted)') + ';' +

      (withTime ? 'event' : 'calendar_month') + '</span>' +

      '</button>';

  function dtGrid() {
    var first = new Date(dtP.y, dtP.m, 1);
    var lead = first.getDay();
    var days = new Date(dtP.y, dtP.m + 1, 0).getDate();
    var today = new Date();
    var cells = '';
    var k;
    for (k = 0; k < lead; k++) { cells += '<div></div>'; }
    for (k = 1; k <= days; k++) {
      var sel = (k === dtP.d);
      var isToday = (today.getFullYear() === dtP.y && today.getMonth() === dtP.m && today.getDate() === k);
      cells += '<button type="button" data-day="' + k + '" style="min-height:36px;border-radius:var(--r-md);cursor:pointer;' +
        'font:inherit;font-size:13px;font-weight:' + (sel ? '700' : '500') + ';' +
        'border:1px solid ' + (sel ? 'var(--accent)' : (isToday ? 'var(--line)' : 'transparent')) + ';' +
        'background:' + (sel ? 'var(--accent)' : 'transparent') + ';' +
        'color:' + (sel ? '#fff' : 'var(--ink)') + '">' + k + '</button>';
    }
    return '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center">' +
      TH_DOW.map(function (w) {
        return '<div class="note" style="font-size:11px;font-weight:600;padding:4px 0">' + w + '</div>';

          '</div>' +

  function dtClose() { pickHost().innerHTML = ''; dtP.key = ''; }

  function dtCommit(val) {
    var inp = el(dtP.key);
    var key = dtP.key, wt = dtP.withTime;
    dtClose();
    if (!inp) { return; }
    inp.value = val;
    var btn = document.querySelector('[data-dt="' + key + '"]');
    if (btn) {
      var lab = dtLabel(val, wt);
      var sp = btn.children[1];
      if (sp) { sp.textContent = lab || (wt ? 'เลือกวันและเวลา' : 'เลือกวันที่'); }
      btn.style.color = lab ? 'var(--ink)' : 'var(--muted)';
    }
    var ev;
    try { ev = new Event('change', { bubbles: true }); } catch (eE) {
      ev = document.createEvent('Event'); ev.initEvent('change', true, true);
    }
    inp.dispatchEvent(ev);
  }

  function dtRender() {
    pickHost().innerHTML = dtPickerHTML();
    el('pkPrev').addEventListener('click', function () {
      dtP.m -= 1; if (dtP.m < 0) { dtP.m = 11; dtP.y -= 1; } dtRender();
    });
    el('pkNext').addEventListener('click', function () {
      dtP.m += 1; if (dtP.m > 11) { dtP.m = 0; dtP.y += 1; } dtRender();
    });
    Array.prototype.forEach.call(pickHost().querySelectorAll('[data-day]'), function (b) {
      b.addEventListener('click', function () {
        dtP.d = parseInt(b.getAttribute('data-day'), 10);
        if (!dtP.withTime) { dtCommit(dtJoin(dtP, false)); return; }
        dtRender();
      });
    });
    if (el('pkH')) {
      el('pkH').addEventListener('change', function () { dtP.hh = parseInt(this.value, 10); });
      el('pkM').addEventListener('change', function () { dtP.mm = parseInt(this.value, 10); });
    }
    el('pkNow').addEventListener('click', function () {
      var n = new Date();
      dtP.y = n.getFullYear(); dtP.m = n.getMonth(); dtP.d = n.getDate();
      if (dtP.withTime) { dtP.hh = n.getHours(); dtP.mm = n.getMinutes(); }
      dtRender();
    });
    el('pkClear').addEventListener('click', function () { dtCommit(''); });
    el('pkCancel').addEventListener('click', dtClose);
    el('pkOk').addEventListener('click', function () { dtCommit(dtJoin(dtP, dtP.withTime)); });
    el('pkOvl').addEventListener('click', function (e) { if (e.target === el('pkOvl')) { dtClose(); } });
  }

  /* เปิดตัวเลือกจากปุ่มใดก็ได้ในหน้า */

    var id = b.getAttribute('data-dt');
    var inp = el(id);
    if (!inp) { return; }
    dtP.key = id;
    dtP.withTime = b.getAttribute('data-dtt') === '1';

    dtP.y = o ? o.y : n.getFullYear();

    dtP.d = o ? o.d : n.getDate();

    dtP.mm = o ? o.mm : 0;

  function pad(n, w) { var s = String(n); while (s.length < w) { s = '0' + s; } return s; }
  function randTok(n) {
    var cs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', s = '';
    for (var i = 0; i < n; i++) { s += cs.charAt(Math.floor(Math.random() * cs.length)); }

     แยกออกมาเป็นฟังก์ชัน เพื่อให้ตอนพิมพ์วาดใหม่เฉพาะรายการ ไม่ต้องสร้างช่องค้นหาใหม่

  function cusHits() {
    var q = (cusM.q || '').trim().toLowerCase();
    if (!q) { return S.customers.slice(); }
    var words = q.split(/\s+/);
    return S.customers.filter(function (c) {
      var hay = (c.name + ' ' + cusAddr(c) + ' ' + (c.taxId || '') + ' ' + (c.phone || '')).toLowerCase();
      for (var i = 0; i < words.length; i += 1) {
        if (hay.indexOf(words[i]) < 0) { return false; }
      }
      return true;
    });
  }

  /* อ่านพิกัดจากลิงก์ Google Maps หรือข้อความพิกัด */
  function parseGeo(txt) {
    var s = String(txt || '');
    var m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) ||
            s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) ||
            s.match(/[?&]q=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) ||
            s.match(/[?&]ll=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/) ||
            s.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);
    if (!m) { return ''; }
    return parseFloat(m[1]).toFixed(6) + ', ' + parseFloat(m[2]).toFixed(6);
  }

  /* คำนวณตัวเลขของคู่รถหนึ่งคู่ ใช้ตรรกะเดียวกับหน้าบันทึก */
  function pairCalc(i) {
    var r = S.rates, t = form.trucks[i];
    if (!t) { return null; }
    var tnL = num(t.lao.tons), tnT = num(t.thai.tons);
    var ty = t.type || 'powder', na = t.nation || 'thai';
    var lane = laneOf(ty, na);
    var counts = {};
    form.trucks.forEach(function (q) {
      var k = (r.tierCount === 'all') ? '*'
        : (r.tierCount === 'type' ? (q.type || 'powder') : laneOf(q.type || 'powder', q.nation || 'thai'));
      counts[k] = (counts[k] || 0) + 1;
    });
    var key = (r.tierCount === 'all') ? '*' : (r.tierCount === 'type' ? ty : lane);
    var cnt = counts[key] || 1;
    var sRate = r.tiers[lane][Math.min(Math.max(cnt, 1), 5) - 1];
    var perTruck = ty === 'powder' ? num(r.tPowder) : num(r.tBag);
    var thai = (r.thaiBasis === 'ton')
      ? ((num(r.truckTon) > 0 ? perTruck / num(r.truckTon) : 0) * tnT) : perTruck;
    var fR = ty === 'powder' ? r.fPowder : r.fBag;
    return { tnL: tnL, tnT: tnT, loss: tnL - tnT, sRate: sRate, ship: sRate * tnL,
             thai: thai, fRate: fR, fAmt: fR * tnL, scan: t.scan === undefined ? true : !!t.scan };
  }

  /* วาดไทล์แผนที่รอบพิกัดกลาง ถ้าโหลดภาพไม่ได้ก็ยังใช้หมุดได้ */
  function mountPin() {
    var pane = el('pinPane');
    if (!pane) { return; }
    var g = pane.getAttribute('data-gps') || '';
    var parts = g.split(',');
    var lat = parseFloat(parts[0]), lon = parseFloat(parts[1]);
    if (isNaN(lat) || isNaN(lon)) { return; }
    var box = el('tiles');
    box.innerHTML = '';
    var z = 17, TS = 256, n = Math.pow(2, z);
    var la = lat * Math.PI / 180;
    var px = (lon + 180) / 360 * n * TS;
    var py = (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n * TS;
    var cw = pane.clientWidth || 320, ch = pane.clientHeight || 220;
    var cx = cw / 2, cy = ch / 2;
    var blocked = false;
    function flag() {
      if (blocked) { return; }
      blocked = true;
      var tn = el('tileNote');
      if (tn) { tn.style.display = 'block'; }
    }
    var x0 = Math.floor((px - cx) / TS), x1 = Math.floor((px + cx) / TS);
    var y0 = Math.floor((py - cy) / TS), y1 = Math.floor((py + cy) / TS);
    for (var X = x0; X <= x1; X++) {
      for (var Y = y0; Y <= y1; Y++) {
        if (Y < 0 || Y >= n) { continue; }
        var im = document.createElement('img');
        im.alt = '';
        im.style.cssText = 'position:absolute;width:' + TS + 'px;height:' + TS + 'px;left:' +
          (X * TS - px + cx) + 'px;top:' + (Y * TS - py + cy) + 'px';
        im.onerror = flag;
        im.src = 'https://tile.openstreetmap.org/' + z + '/' + ((X % n) + n) % n + '/' + Y + '.png';
        box.appendChild(im);
      }
    }
    setTimeout(function () {
      var any = false;
      Array.prototype.forEach.call(box.querySelectorAll('img'), function (q2) { if (q2.naturalWidth > 0) { any = true; } });
      if (!any) { flag(); }
    }, 3000);
  }

  function bindPin() {
    var pin = el('pinM'), pane = el('pinPane');
    if (!pin || !pane) { return; }
    var g = (pane.getAttribute('data-gps') || '').split(',');
    var lat0 = parseFloat(g[0]), lon0 = parseFloat(g[1]);
    if (isNaN(lat0) || isNaN(lon0)) { return; }
    var perPx = 360 / (256 * Math.pow(2, 17));
    var kLat = perPx * Math.cos(lat0 * Math.PI / 180);
    var drag = false, sx = 0, sy = 0, dx = 0, dy = 0;

    function coordAt(ddx, ddy) {
      return (lat0 - ddy * kLat).toFixed(6) + ', ' + (lon0 + ddx * perPx).toFixed(6);
    }
    pin.addEventListener('pointerdown', function (e) {
      drag = true; sx = e.clientX; sy = e.clientY;
      pin.style.cursor = 'grabbing';
      try { pin.setPointerCapture(e.pointerId); } catch (eC) { /* ไม่รองรับก็ข้ามไป */ }
      e.preventDefault();
    });
    pin.addEventListener('pointermove', function (e) {
      if (!drag) { return; }
      dx = e.clientX - sx; dy = e.clientY - sy;
      pin.style.left = 'calc(50% + ' + dx + 'px)';
      pin.style.top = 'calc(50% + ' + dy + 'px)';
      var t = el('pinTxt');
      if (t) { t.textContent = 'กำลังเลื่อนหมุด ' + coordAt(dx, dy) + ' · ปล่อยเพื่อบันทึก'; }
    });
    function done() {
      if (!drag) { return; }
      drag = false;
      pin.style.cursor = 'grab';
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) { return; }
      cusM.draft.gps = coordAt(dx, dy);
      soonModals();
      toast('ย้ายหมุดเป็น ' + cusM.draft.gps);
    }
    pin.addEventListener('pointerup', done);
    pin.addEventListener('pointercancel', done);
  }

        '<div id="cList" style="max-height:300px;overflow:auto">' + cusListHTML() + '</div>' +

    } else {
      body = '<div class="card-b stack">' +
        cusFormHTML(d) +
        tripHTML(i) +
        '<div class="grid g2">' +
          '<button type="button" data-mk-open="driver" ' +
          'style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;' +
          'padding:12px 14px;border:1px solid var(--accent);border-radius:var(--r-md);background:var(--tint-weak);' +
          'color:var(--head);font:inherit;font-size:13px;font-weight:700;cursor:pointer">' +
          '<span class="ms" aria-hidden="true" style="font-size:19px;color:var(--accent)">local_shipping</span>' +
          'ข้อความและลิงก์ส่งคนขับรถ</button>' +

          'padding:12px 14px;border:1px solid #34A853;border-radius:var(--r-md);background:#E8F6EC;' +
          'color:#14532D;font:inherit;font-size:13px;font-weight:700;cursor:pointer">' +
          '<span class="ms" aria-hidden="true" style="font-size:19px;color:#1E7B3C">forward_to_inbox</span>' +
          'ข้อความแจ้งลูกค้า</button>' +

        ((form.trucks[i] && form.trucks[i].job)

        '<div class="actions" style="justify-content:flex-end">' +
          (d.id ? '<button type="button" class="btn" id="cDel">ลบลูกค้ารายนี้</button>' : '') +
          '<button type="button" id="cKeep" ' +

          '<span class="ms" aria-hidden="true" style="font-size:19px">save</span>บันทึกลูกค้า</button>' +
        '</div></div>';
    }

    var closeTxt = cusM.mode === 'msg' ? 'ย้อนกลับ' : 'ปิด';
    var title = cusM.mode === 'msg' ? 'ข้อความและเอกสาร'
      : (cusM.mode === 'list' ? 'เลือกลูกค้าปลายทาง' : 'ปลายทางลูกค้า');
    var sub = cusM.mode === 'msg' ? 'ข้อความแจ้งผู้รับจ้างขนส่ง · แก้ไขได้ก่อนคัดลอก'
      : 'คู่รถที่ ' + (i + 1) + ' · ข้อมูลที่บันทึกจะถูกจำไว้ใช้ครั้งต่อไป';

    return overlay(
      '<div class="card-h" style="position:sticky;top:0;background:var(--card);z-index:2">' +
      '<div><h2 style="margin:0">' + esc(title) + '</h2>' +
      '<p class="note" style="margin-top:3px">' + esc(sub) + '</p></div>' +
      '<button type="button" class="btn sm" id="cClose">' + closeTxt + '</button></div>' + body, 760);

  function renderModals() {
    var h = modalHost();
    try {
      h.innerHTML = cusM.open ? cusModalHTML() : '';
    } catch (eR) {
      setTimeout(renderModals, 0);
      return;
    }
    if (cusM.open) { bindCus(); }
  }
  function soonModals() { setTimeout(renderModals, 0); }

  function closeModals() { cusM.open = false; renderModals(); }

  function bindCus() {
    el('cClose').addEventListener('click', function () {
      if (cusM.mode === 'msg') { cusM.mode = 'form'; renderModals(); return; }
      closeModals(); viewEntry();
    });

    if (cusM.mode === 'msg') {
      Array.prototype.forEach.call(modalHost().querySelectorAll('[data-mk]'), function (rb) {
        rb.addEventListener('change', function () {
          msgM.kind = rb.getAttribute('data-mk');
          msgM.text = buildMsg(cusM.idx, msgM.kind);
          msgM.orig = msgM.text;
          renderModals();
        });
      });
      el('msgTa').addEventListener('input', function () { msgM.text = this.value; });
      el('mCopy').addEventListener('click', function () {
        var ta = el('msgTa');
        ta.focus(); ta.select();
        var done = false;
        try { done = document.execCommand('copy'); } catch (e) { done = false; }
        if (!done && navigator.clipboard) {
          navigator.clipboard.writeText(ta.value).then(function () { toast('คัดลอกข้อความแล้ว'); },
            function () { toast('คัดลอกไม่สำเร็จ กด Ctrl+C อีกครั้ง'); });
          return;
        }
        toast(done ? 'คัดลอกข้อความแล้ว' : 'คัดลอกไม่สำเร็จ กด Ctrl+C อีกครั้ง');
      });
      return;
    }

    if (cusM.mode === 'list') {
      var bindPicks = function () {
        Array.prototype.forEach.call(modalHost().querySelectorAll('[data-pick]'), function (b) {
          b.addEventListener('click', function () {
            var c = cusById(b.getAttribute('data-pick'));
            if (!c) { return; }
            cusM.draft = JSON.parse(JSON.stringify(c));
            cusM.mode = 'form';
            renderModals();
          });
        });
      };
      var paint = function () {
        var box = el('cList');
        if (!box) { soonModals(); return; }
        box.innerHTML = cusListHTML();
        bindPicks();
      };
      /* วาดใหม่เฉพาะรายการ ช่องค้นหาตัวเดิมจึงยังอยู่ โฟกัสไม่หลุด พิมพ์ไทยต่อได้ */
      el('cq').addEventListener('input', function () { cusM.q = this.value; paint(); });
      el('cq').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          var first = modalHost().querySelector('[data-pick]');
          if (first) { first.click(); }
        }
      });
      el('cNew').addEventListener('click', function () {
        cusM.mode = 'form';
        cusM.draft = newDraft();
        /* พิมพ์ค้นแล้วไม่เจอ กดเพิ่มรายใหม่ ให้เอาคำที่พิมพ์มาเป็นชื่อตั้งต้น */
        cusM.draft.name = (cusM.q || '').trim();
        renderModals();
      });
      bindPicks();
      /* ให้เคอร์เซอร์อยู่ในช่องค้นหาทันทีที่เปิดกล่อง */
      if (!cusM.q) { setTimeout(function () { if (el('cq')) { el('cq').focus(); } }, 30); }
      return;
    }

    /* โหมดฟอร์ม */
    Array.prototype.forEach.call(modalHost().querySelectorAll('[data-cd]'), function (inp) {
      var k = inp.getAttribute('data-cd');
      var dig = inp.getAttribute('data-dig');
      inp.addEventListener('input', function () {
        if (dig) {
          var cleaned = digits(inp.value, parseInt(dig, 10));
          if (cleaned !== inp.value) { inp.value = cleaned; }
        }
        cusM.draft[k] = inp.value;
        if (k === 'taxId') { setHint('hintTax', inp.value.length, 13, 'เลขนิติบุคคล', 13); }
        if (k === 'phone') { setHint('hintPhone', inp.value.length, 9, 'เบอร์โทร', 10); }
      });
      inp.addEventListener('change', function () {
        if (dig) { inp.value = digits(inp.value, parseInt(dig, 10)); }
        cusM.draft[k] = inp.value;
        if (k === 'province') {
          if (ampList(inp.value).indexOf(cusM.draft.amphoe) < 0) { cusM.draft.amphoe = ''; cusM.draft.tambon = ''; cusM.draft.zip = ''; }
          soonModals();
        }
        if (k === 'amphoe') {
          if (tamList(cusM.draft.province, inp.value).indexOf(cusM.draft.tambon) < 0) { cusM.draft.tambon = ''; cusM.draft.zip = ''; }
          soonModals();
        }
        if (k === 'tambon') {
          cusM.draft.zip = zipOf(cusM.draft.province, cusM.draft.amphoe, inp.value);
          soonModals();
        }
        if (k === 'gps') { soonModals(); }
      });
    });

    if (el('cPasteGo')) {
      el('cPasteGo').addEventListener('click', function () {
        var g = parseGeo(el('cPaste').value);
        if (!g) { toast('อ่านพิกัดจากข้อความนี้ไม่ได้ ลองคัดลอกลิงก์จาก Google Maps ใหม่'); return; }
        cusM.draft.gps = g; renderModals(); toast('ได้พิกัด ' + g);
      });
      el('cPaste').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); el('cPasteGo').click(); }
      });
    }
    if (el('cGpsClear')) {
      el('cGpsClear').addEventListener('click', function () { cusM.draft.gps = ''; cusM.sv = false; soonModals(); });
    }
    if (el('cSv')) {
      el('cSv').addEventListener('click', function () { cusM.sv = !cusM.sv; soonModals(); });
    }
    mountPin();
    bindPin();

    Array.prototype.forEach.call(modalHost().querySelectorAll('[data-tf]'), function (inp) {
      inp.addEventListener('change', function () {
        var t = form.trucks[cusM.idx];
        if (t) { t[inp.getAttribute('data-tf')] = inp.value; save(); }
      });
    });

    Array.prototype.forEach.call(modalHost().querySelectorAll('[data-map]'), function (f) {
      var ok = false;
      f.addEventListener('load', function () { ok = true; });
      setTimeout(function () {
        if (ok || !f.parentNode) { return; }
        var box = document.createElement('div');
        box.className = 'note';
        box.style.cssText = 'height:190px;display:flex;align-items:center;justify-content:center;text-align:center;' +
          'padding:14px;border:1px dashed var(--line);border-radius:var(--r-md);background:var(--sunken)';
        box.textContent = 'หน้านี้เปิดแผนที่ฝังจากภายนอกไม่ได้ · กดปุ่มแผนที่หรือสตรีทวิวด้านบนเพื่อเปิดในแท็บใหม่';
        f.parentNode.replaceChild(box, f);
      }, 3500);
    });

    if (el('cKeep')) {
      el('cKeep').addEventListener('click', function () {
        var dk = cusM.draft;
        if (!(dk.name || '').trim()) { toast('กรุณากรอกชื่อลูกค้าก่อน'); return; }
        if (dk.taxId && dk.taxId.length !== 13) { toast('เลขนิติบุคคลต้องครบ 13 หลัก'); return; }
        if (dk.phone && dk.phone.length < 9) { toast('เบอร์โทรยังไม่ครบ'); return; }
        if (!dk.id) { dk.id = 'c' + Date.now() + randTok(4); S.customers.push(dk); }
        else { S.customers = S.customers.map(function (x) { return x.id === dk.id ? dk : x; }); }
        var tkk = form.trucks[cusM.idx];
        if (tkk) { tkk.destId = dk.id; tkk.dest = dk.name; }
        save(); logIt('บันทึกลูกค้าปลายทาง', dk.name + (cusAddr(dk) ? ' · ' + cusAddr(dk) : ''));
        closeModals(); viewEntry();
        toast('บันทึกลูกค้าและตั้งเป็นปลายทางของคู่รถนี้แล้ว');
      });
    }

    Array.prototype.forEach.call(modalHost().querySelectorAll('[data-mk-open]'), function (bt) {
      bt.addEventListener('click', function () {
        var d2 = cusM.draft;
        if ((d2.name || '').trim()) {
          if (!d2.id) { d2.id = 'c' + Date.now() + randTok(4); S.customers.push(d2); }
          else { S.customers = S.customers.map(function (x) { return x.id === d2.id ? d2 : x; }); }
          var tk0 = form.trucks[cusM.idx];
          if (tk0) { tk0.destId = d2.id; tk0.dest = d2.name; }
          save();
        }
        msgM.kind = bt.getAttribute('data-mk-open');
        msgM.text = buildMsg(cusM.idx, msgM.kind);
        msgM.orig = msgM.text;
        cusM.mode = 'msg';
        renderModals();
      });
    });
    if (el('cLoad')) {
      el('cLoad').addEventListener('change', function () {
        var pickName = this.value.trim();
        var hit = null;
        S.customers.forEach(function (x) { if (x.name === pickName) { hit = x; } });
        if (!hit) { toast('ไม่พบลูกค้าชื่อนี้ในระบบ'); return; }
        cusM.draft = JSON.parse(JSON.stringify(hit));
        soonModals(); toast('เรียกข้อมูล ' + hit.name + ' แล้ว');
      });
    }
    if (el('cDel')) {
      el('cDel').addEventListener('click', function () {
        var id = cusM.draft.id;
        var gone = JSON.parse(JSON.stringify(cusM.draft || {}));
        S.customers = S.customers.filter(function (x) { return x.id !== id; });
        if (S.trash.customers.indexOf(id) < 0) { S.trash.customers.push(id); }
        form.trucks.forEach(function (t) { if (t.destId === id) { t.destId = ''; t.dest = ''; } });
        save();
        logIt('ลบลูกค้า', (gone.name || id) +
          (gone.taxId ? ' · เลขนิติบุคคล ' + gone.taxId : '') +
          (gone.phone ? ' · โทร ' + gone.phone : '') +
          ' · ' + [gone.tambon, gone.amphoe, gone.province].filter(function (x) { return !!x; }).join(' '));
        cusM.mode = 'list'; cusM.draft = newDraft(); renderModals(); viewEntry(); toast('ลบลูกค้าแล้ว');
      });
    }
  }

  /* ================= เชื่อมต่อฐานข้อมูล Supabase ================= */

  var SBKEY = 'bluestone-supabase';
  var SB = { url: '', key: '', client: null, status: 'ยังไม่ได้เชื่อมต่อ', busy: false, last: '',
             rev: '', conflict: false };

  var BSC = window.BS_CONFIG || {};
  SB.url = (BSC.url || '').trim();
  SB.key = (BSC.key || '').trim();
  try {
    var sbRaw = localStorage.getItem(SBKEY);
    if (sbRaw) {
      var sbCfg = JSON.parse(sbRaw);
      if (sbCfg.url) { SB.url = sbCfg.url; }
      if (sbCfg.key) { SB.key = sbCfg.key; }
    }
  } catch (eSB) { /* โหมดส่วนตัว ใช้งานต่อได้ */ }

  function sbSaveCfg() {
    try { localStorage.setItem(SBKEY, JSON.stringify({ url: SB.url, key: SB.key })); } catch (e) { /* ข้าม */ }
  }

  function sbConnect() {
    if (!SB.url || !SB.key) { SB.client = null; SB.status = 'ยังไม่ได้เชื่อมต่อ'; return null; }
    if (!window.supabase || !window.supabase.createClient) {
      SB.status = 'โหลดไลบรารี Supabase ไม่สำเร็จ'; return null;
    }
    try {
      SB.client = window.supabase.createClient(SB.url, SB.key);
      SB.status = 'เชื่อมต่อแล้ว';
      return SB.client;
    } catch (e2) {
      SB.client = null; SB.status = 'เชื่อมต่อไม่สำเร็จ: ' + e2.message; return null;
    }
  }

  function sbNow() {
    var d = new Date();
    return d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() +
      ':' + (d.getSeconds() < 10 ? '0' : '') + d.getSeconds();
  }

  /* ---- แปลงข้อมูลระหว่างรูปแบบในหน้าเว็บกับตารางในฐานข้อมูล ---- */
  function cusToRow(c) {
    return { id: c.id, name: c.name || '', tax_id: c.taxId || null, phone: c.phone || null,
             contact: c.contact || null, hno: c.hno || null, moo: c.moo || null, road: c.road || null,
             tambon: c.tambon || null, amphoe: c.amphoe || null, province: c.province || null,
             zip: c.zip || null, gps: c.gps || null, updated_at: new Date().toISOString() };
  }
  function rowToCus(r) {
    return { id: r.id, name: r.name || '', taxId: r.tax_id || '', phone: r.phone || '',
             contact: r.contact || '', hno: r.hno || '', moo: r.moo || '', road: r.road || '',
             tambon: r.tambon || '', amphoe: r.amphoe || '', province: r.province || '',
             zip: r.zip || '', gps: r.gps || '' };
  }
  function entToRow(e) {
    return { id: e.id, entry_date: e.date, kind: e.kind,
             amount: e.amount === undefined ? null : e.amount,
             note: e.note || null,
             cement_type: e.cementType || null,
             tons: e.tons === undefined ? null : e.tons,
             price: e.price === undefined ? null : e.price,
             who: e.who || null,
             trucks: e.trucks || null,
             updated_at: new Date().toISOString() };
  }
  function rowToEnt(r) {
    var e = { id: Number(r.id), date: r.entry_date, kind: r.kind };
    if (r.amount !== null && r.amount !== undefined) { e.amount = Number(r.amount); }
    if (r.note) { e.note = r.note; }
    if (r.cement_type) { e.cementType = r.cement_type; }
    if (r.tons !== null && r.tons !== undefined) { e.tons = Number(r.tons); }
    if (r.price !== null && r.price !== undefined) { e.price = Number(r.price); }
    if (r.who) { e.who = r.who; }
    if (r.trucks) { e.trucks = r.trucks; }
    return e;
  }

  /* ---- ดึงข้อมูลทั้งหมดลงมาทับของในเครื่อง ---- */
  function sbPull(cb) {
    var cl = SB.client || sbConnect();
    if (!cl) { if (cb) { cb(new Error(SB.status)); } return; }
    SB.busy = true; SB.status = 'กำลังดึงข้อมูล...';
    Promise.all([
      cl.from('app_settings').select('*').eq('id', 'default').maybeSingle(),
      cl.from('customers').select('*'),
      cl.from('entries').select('*').order('entry_date', { ascending: true }),
      cl.from('app_users').select('*'),
      cl.from('activity_log').select('*').order('at', { ascending: false }).limit(500)
    ]).then(function (res) {
      SB.busy = false;
      var err = null;
      res.forEach(function (x) { if (x && x.error && !err) { err = x.error; } });
      if (err) { SB.status = 'ดึงข้อมูลไม่สำเร็จ: ' + err.message; if (cb) { cb(err); } return; }
      var st = res[0].data;
      SB.rev = (st && st.updated_at) || '';
      SB.conflict = false;
      if (st) {
        if (st.rates && Object.keys(st.rates).length) {
          Object.keys(st.rates).forEach(function (k) { S.rates[k] = st.rates[k]; });
          /* ฐานข้อมูลที่ยังไม่เคยรับกติกาชุดนำเข้า ต้องไม่ดึงวิธีนับแบบเก่ากลับมาทับ */
          if (!st.rates.setMode) { S.rates.tierCount = 'set'; S.rates.setMode = 1; }
          ratesFix();
          /* รายชื่อคู่ค้าวางเงินล่วงหน้าเดินทางมากับ rates แต่เก็บแยกในเครื่อง */
          if (Array.isArray(S.rates.credits) && S.rates.credits.length) {
            S.credits = S.rates.credits;
          }
          delete S.rates.credits;
        }
        /* ฐานข้อมูลเป็นตัวตั้งเรื่องรหัสล็อก ถ้าที่นั่นยกเลิกแล้ว เครื่องนี้ต้องยกเลิกตาม */
        if (st.rates && !st.rates.lkH) { delete S.rates.lkH; delete S.rates.lkS; }
        if (st.rates && !st.rates.pnH) { delete S.rates.pnH; delete S.rates.pnS; }
        if (st.names && Object.keys(st.names).length) {
          Object.keys(st.names).forEach(function (k) { S.names[k] = st.names[k]; });
        }
      }
      S.customers = (res[1].data || []).map(rowToCus);
      var ents = (res[2].data || []).map(rowToEnt);
      if (ents.length) { S.entries = ents; S.demo = false; }
      S.users = (res[3].data || []).map(function (u) {
        return { id: u.id, name: u.name, role: u.role || '', email: u.email || '' };
      });
      S.log = (res[4].data || []).slice().reverse().map(function (g) {
        return { t: g.at, who: g.who || '', role: g.role || '', act: g.act || '', detail: g.detail || '' };
      });
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e3) { /* ข้าม */ }
      SB.status = 'ดึงข้อมูลล่าสุดแล้ว ' + sbNow();
      SB.last = SB.status;
      if (cb) { cb(null); }
    }, function (e4) {
      SB.busy = false; SB.status = 'ดึงข้อมูลไม่สำเร็จ: ' + e4.message;
      if (cb) { cb(e4); }
    });
  }

  /* ---- ส่งข้อมูลในเครื่องขึ้นฐานข้อมูล ---- */
  /* ส่งขึ้นจริง ข้ามการตรวจเวอร์ชัน (ใช้ตอนผู้ใช้ยืนยันว่าจะทับ) */
  function sbPush(cb) { sbPushGo(cb, true); }

  /* ตรวจก่อนว่ามีคนอื่นแก้ข้อมูลหลังจากเราดึงล่าสุดไหม */
  function sbPushSafe(cb) {
    var cl = SB.client || sbConnect();
    if (!cl) { if (cb) { cb(new Error(SB.status)); } return; }
    cl.from('app_settings').select('updated_at').eq('id', 'default').maybeSingle()
      .then(function (res) {
        var cur = (res && res.data && res.data.updated_at) || '';
        if (SB.rev && cur && cur !== SB.rev) {
          SB.conflict = true;
          SB.status = 'มีคนอื่นแก้ข้อมูลหลังจากคุณดึงล่าสุด · กดดึงข้อมูลลงก่อน';
          sbBadge();
          if (cb) { cb(new Error(SB.status)); }
          return;
        }
        sbPushGo(cb, false);
      }, function () { sbPushGo(cb, false); });
  }

  function sbPushGo(cb, forced) {
    var cl = SB.client || sbConnect();
    if (!cl) { if (cb) { cb(new Error(SB.status)); } return; }
    SB.busy = true; SB.status = forced ? 'กำลังบันทึกทับขึ้นฐานข้อมูล...' : 'กำลังบันทึกขึ้นฐานข้อมูล...';
    /* ส่งขึ้นแบบ "เพิ่มและอัปเดต" เท่านั้น
       ไม่ลบแถวที่ไม่มีในเครื่องนี้ เพราะเครื่องนี้อาจมีข้อมูลเก่ากว่าของคนอื่น
       จะลบเฉพาะรายการที่ผู้ใช้กดลบเองจริง ๆ ซึ่งเก็บไว้ใน S.trash */
    var trash = { customers: (S.trash.customers || []).slice(),
                  users: (S.trash.users || []).slice(),
                  entries: (S.trash.entries || []).slice() };
    var jobs = [
      cl.from('app_settings').upsert({ id: 'default', rates: crPack(), names: S.names,
                                       updated_at: new Date().toISOString() }),
      cl.from('entries').upsert(S.entries.map(entToRow)),
      cl.from('customers').upsert(S.customers.map(cusToRow)),
      cl.from('app_users').upsert(S.users.map(function (u) {
        return { id: u.id, name: u.name, role: u.role || null, email: u.email || null,
                 updated_at: new Date().toISOString() };
      }))
    ];
    if (trash.entries.length) { jobs.push(cl.from('entries').delete().in('id', trash.entries)); }
    if (trash.customers.length) { jobs.push(cl.from('customers').delete().in('id', trash.customers)); }
    if (trash.users.length) { jobs.push(cl.from('app_users').delete().in('id', trash.users)); }

    Promise.all(jobs).then(function (res) {
      SB.busy = false;
      var err = null;
      res.forEach(function (x) { if (x && x.error && !err) { err = x.error; } });
      if (!err) {
        /* ลบสำเร็จแล้วจึงล้างถังขยะ ถ้าพลาดจะเก็บไว้ลองใหม่รอบหน้า */
        ['customers', 'users', 'entries'].forEach(function (k) {
          S.trash[k] = (S.trash[k] || []).filter(function (id) { return trash[k].indexOf(id) < 0; });
        });
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (eT) { /* ข้าม */ }
      }
      if (!err) {
        SB.conflict = false;
        cl.from('app_settings').select('updated_at').eq('id', 'default').maybeSingle()
          .then(function (q) { SB.rev = (q && q.data && q.data.updated_at) || SB.rev; }, function () {});
      }
      SB.status = err ? ('บันทึกไม่สำเร็จ: ' + err.message) : ('บันทึกขึ้นฐานข้อมูลแล้ว ' + sbNow());
      SB.last = SB.status;
      if (cb) { cb(err || null); }
    }, function (e5) {
      SB.busy = false; SB.status = 'บันทึกไม่สำเร็จ: ' + e5.message;
      if (cb) { cb(e5); }
    });
  }

  /* ---- ส่งประวัติหนึ่งบรรทัดขึ้นฐานข้อมูลทันที ---- */
  function sbLog(row) {
    var cl = SB.client;
    if (!cl) { return; }
    cl.from('activity_log').insert({ at: row.t, who: row.who, role: row.role, act: row.act, detail: row.detail })
      .then(function () { /* เงียบไว้ ไม่ขัดจังหวะผู้ใช้ */ }, function () { /* เช่นกัน */ });
  }

  /* ---- ส่งขึ้นอัตโนมัติหลังบันทึก หน่วงไว้กันยิงถี่ ---- */
  var sbTimer = null;
  function sbQueue() {
    if (!SB.client) { return; }
    if (sbTimer) { clearTimeout(sbTimer); }
    sbTimer = setTimeout(function () { sbTimer = null; sbPushSafe(function () { sbBadge(); }); }, 1500);
  }

  function sbBadge() {
    var n = el('sbStatus');
    if (n) { n.textContent = SB.status; }
    var h = el('sbHead');
    if (h) {
      h.textContent = SB.conflict ? 'มีคนอื่นแก้ข้อมูล' : (SB.client ? 'ออนไลน์' : 'ออฟไลน์');
      h.style.background = SB.conflict ? 'var(--bad-bg)' : (SB.client ? 'var(--ok-bg)' : 'var(--sunken)');
      h.style.color = SB.conflict ? 'var(--bad)' : (SB.client ? 'var(--ok)' : 'var(--muted)');
    }
