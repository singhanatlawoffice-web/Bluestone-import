    }
    return '<div style="margin-bottom:2px">' +
      '<p class="t" style="margin:0 0 3px">วันนี้จะบันทึกอะไร</p>' +
      '<p class="hint" style="margin:0 0 11px">เลือกหนึ่งอย่าง ฟอร์มที่ตรงกับงานจะกางออกด้านล่าง · ' +
      'หนึ่งใบบันทึกได้ชนิดเดียว แต่สลับได้ตลอด ข้อมูลที่พิมพ์ไว้ไม่หาย</p>' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap">' +
      card('powder', 'ปูนผง · จับคู่รถ',
           'รถไทยเข้าไปรับถ่ายปูนจากรถลาวที่ด่านฝั่งลาว กรอกทะเบียนและน้ำหนักสองฝั่ง เข้าสตอกปูนผง',
           '#1f2f7e', !bag) +
      card('bag', 'ปูนถุง · คันเดียว',
           'รถลาวบรรทุก ' + BAGS_TRUCK + ' ถุงมาลง' + whOf('bag') + ' ไม่มีคู่รถ ไม่มีน้ำหนักสองฝั่ง',
           '#2b7a4b', bag) +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px">' +
      '<span class="note" style="margin:0">กำลังบันทึก</span>' +
      '<span style="display:flex;border:1.5px solid ' + (bag ? '#2b7a4b' : '#1f2f7e') + ';border-radius:999px;overflow:hidden">' +
      tab('powder', 'ปูนผง · จับคู่รถ', '#1f2f7e', !bag) +
      tab('bag', 'ปูนถุง · คันเดียว', '#2b7a4b', bag) +
      '</span>' +
      '<span class="hint">สลับกลางคันได้ ข้อมูลที่กรอกไว้เก็บไว้ให้</span></div>' +
      '</div>';
  }

  /* บรรทัดเขียวใต้การ์ดรถ บอกว่าคันนี้จะเข้าสตอกเท่าไร */
  function stockLine(v, x) {
    var txt;
    if (x.ty === 'bag') {
      var bags = num(v.bags) || BAGS_TRUCK;
      txt = 'คันนี้จะเข้า <b>' + whOf('bag') + ' ' + m0(bags) + ' ถุง = ' + t2(bags / BAGS_TON) + ' ตัน</b>';
    } else {
      txt = 'คันนี้จะเข้า <b>สตอกปูนผง ' + t2(x.tnT) + ' ตัน</b> ' +
        '<span style="color:#2E6B41">(ใช้น้ำหนักชั่งฝั่งไทย · ตัดเงินโรงงานใช้ฝั่งลาว ' + t2(x.tnL) + ' ตัน)</span>';
    }
    return '<div style="display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 12px;' +
      'border-radius:10px;background:var(--ok-bg);border:1px solid var(--ok)">' +
      '<span style="font-size:12.5px;color:#14532D">' + txt + '</span></div>';
  }

  /* สรุปของวัน รวมทุกใบบันทึกที่ลงวันเดียวกัน */
  function daySummary(d) {
    var sum = { powder: { n: 0, tons: 0 }, bag: { n: 0, tons: 0, bags: 0 } };
    S.entries.forEach(function (e) {
      if (e.kind !== 'import' || dOnly(e.date) !== dOnly(d) || !e.trucks) { return; }
      e.trucks.forEach(function (t) {
        var ty = t.type === 'bag' ? 'bag' : 'powder';
        sum[ty].n += 1;
        var tn = num(t.thai && t.thai.tons);
        sum[ty].tons += tn;
        if (ty === 'bag') { sum.bag.bags += num(t.bags) || Math.round(tn * BAGS_TON); }
      });
    });
    var total = sum.powder.n + sum.bag.n;
    if (!total) {
      return '<section class="card" style="margin-top:14px"><div class="card-b">' +
        '<p class="t" style="margin:0 0 3px">สรุปเข้าสตอกของวันที่ ' + esc(thDate(d)) + '</p>' +
        '<p class="muted" style="margin:10px 0 0;text-align:center;padding:12px">ยังไม่มีรายการที่บันทึกไว้ในวันนี้</p>' +
        '</div></section>';
    }
    function row(lab, tone, n, qty) {
      return '<tr><td class="str"><span class="badge" style="background:' + tone + '22;color:' + tone + '">' +
        esc(lab) + '</span></td><td class="n">' + m0(n) + ' คัน</td>' +
        '<td class="n" style="font-weight:700">' + qty + '</td></tr>';
    }
    var body = '';
    if (sum.powder.n) { body += row('ปูนผง · จับคู่รถ', '#1f2f7e', sum.powder.n, t2(sum.powder.tons) + ' ตัน'); }
    if (sum.bag.n) {
      body += row('ปูนถุง · เข้าโกดัง', '#2b7a4b', sum.bag.n,
        m0(sum.bag.bags) + ' ถุง · ' + t2(sum.bag.bags / BAGS_TON) + ' ตัน');
    }
    body += '<tr style="background:var(--soft)"><td class="str" style="font-weight:700">รวมทั้งวัน</td>' +
      '<td class="n" style="font-weight:700">' + m0(total) + ' คัน</td>' +
      '<td class="n" style="font-weight:700">' + t2(sum.powder.tons + sum.bag.bags / BAGS_TON) + ' ตัน</td></tr>';
    return '<section class="card" style="margin-top:14px"><div class="card-b">' +
      '<p class="t" style="margin:0 0 3px">สรุปเข้าสตอกของวันที่ ' + esc(thDate(d)) + '</p>' +
      '<p class="hint" style="margin:0 0 10px">รวมทุกใบบันทึกของวันนั้น ไม่ว่าจะแยกกี่ใบ · ' +
      'ปริมาณที่เข้าสตอกคิดจากน้ำหนักชั่งฝั่งไทย</p>' +
      '<div class="tbox"><table><thead><tr><th>ชนิด</th><th class="c">จำนวนรถ</th>' +
      '<th class="c">ปริมาณที่เข้าสตอก</th></tr></thead><tbody>' + body + '</tbody></table></div>' +
      '</div></section>';
  }


  /* รายงานยอดเงินคงเหลือ ณ โรงงานปูน · จัดหน้าแบบเดียวกับที่โรงงานส่งมา จะได้วางเทียบกันได้
     ต่างตรงที่เพิ่มเลขใบชั่งและรอบนำเข้าให้ด้วย เวลาตัวเลขไม่ตรงจะได้ไล่หาคันที่ผิดได้ทันที */
  function facRows(bd) {
    var c = compute();
    var open = 0, out = [], bal = 0, started = false;
    var sumIn = 0, sumCut = 0, sumTons = 0;

    function start() {
      if (started) { return; }
      started = true;
      bal = open;
      out.push({ no: '', load: '', cross: bd.from, item: 'ยอดยกมา', plate: '', wb: '', inv: '',
                 tons: null, rate: null, amt: null, bal: bal, open: true });
    }

    c.rows.forEach(function (w) {
      var e = w.e;
      var before = e.date < bd.from;
      var after = e.date > bd.to;

      if (e.kind === 'depositF') {
        if (before) { open += w.fIn; return; }
        if (after) { return; }
        start();
        bal += w.fIn; sumIn += w.fIn;
        out.push({ load: '', cross: e.date, item: 'โอนเงินเข้าโรงงาน', plate: '', wb: '', inv: '',
                   tons: null, rate: null, amt: w.fIn, bal: bal, dep: true });
        return;
      }
      if (e.kind !== 'import') { return; }
      (w.items || []).forEach(function (it) {
        if (before) { open -= it.fAmt; return; }
        if (after) { return; }
        start();
        var t = (e.trucks || [])[it.seq - 1] || {};
        bal -= it.fAmt; sumCut += it.fAmt; sumTons += it.tons;
        out.push({
          load: dOnly(t.tLoad) || e.date,
          cross: dOnly(t.tSend) || '',
          item: typeTH(it.type),
          plate: it.plateLao || (t.lao && t.lao.plate2 ? t.lao.plate2 : '') || '—',
          wb: t.wb || '',
          inv: rdName(t.round) || '',
          tons: it.tons, rate: it.fRate, amt: it.fAmt, bal: bal
        });
      });
    });
    start();
    return { rows: out, open: open, close: bal, sumIn: sumIn, sumCut: sumCut, sumTons: sumTons };
  }

  function stkFields(i, v) {
    var opts = '<option value="">ไม่ระบุรอบ</option>' + rdList().map(function (r) {
      var p = r.trucks || {};
      return '<option value="' + esc(r.id) + '"' + (String(v.round) === String(r.id) ? ' selected' : '') + '>' +
        esc(p.inv || ('รอบ ' + r.id)) + (p.fdTrucks ? ' · ' + p.fdTrucks + ' คัน' : '') + '</option>';
    }).join('');
    return '<div style="margin-top:10px;padding:11px 12px;border:1px dashed var(--line-field);' +
      'border-radius:var(--r-md);background:var(--field)">' +
      '<p style="margin:0 0 9px;font-size:11.5px;font-weight:700;color:var(--head)">เอกสารและสตอก</p>' +
      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px">' +
        '<div style="min-width:0"><label class="fl" for="wbf' + i + '" style="font-size:11px">เลขที่ใบขน</label>' +
        '<input id="wbf' + i + '" type="text" value="' + esc(v.wb || '') + '" data-f="wb:' + i + '" ' +
        'placeholder="A0110691105896" style="min-height:38px"></div>' +
        '<div style="min-width:0"><label class="fl" for="mff' + i + '" style="font-size:11px">เลข Car Manifest</label>' +
        '<input id="mff' + i + '" type="text" value="' + esc(v.mf || '') + '" data-f="mf:' + i + '" ' +
        'placeholder="DOWP000103624" style="min-height:38px"></div>' +
        '<div style="min-width:0"><label class="fl" for="rdf' + i + '" style="font-size:11px">รอบนำเข้า (Invoice)</label>' +
        '<select id="rdf' + i + '" data-f="round:' + i + '" style="min-height:38px">' + opts + '</select></div>' +
      '</div>' +
      '<p class="hint" style="margin:8px 0 0">' +
      (v.type === 'bag'
        ? 'ปูนถุงเข้า' + whOf('bag') + ' เสมอ ' + BAGS_TRUCK + ' ถุงต่อคัน'
        : 'ปูนผงเข้าสตอกปูนผงเสมอ ตามน้ำหนักชั่งฝั่งไทย') +
      ' · นับเข้าสตอกเมื่อกรอกวันเวลาผ่านด่านไทยแล้ว ยอดขายบันทึกที่หัวข้อขายออกด้านล่าง</p>' +
      '</div>';
  }

  /* ================= หน้า 6 · สตอกและรอบนำเข้า =================
     รอบนำเข้า = 1 Invoice ผูกกับ Form D และใบขนชุดเดียวกัน จำนวนคันไม่คงที่
     เก็บเป็นรายการในสมุดเดียวกับรายการอื่น (kind = round / whOut)
     จึงซิงก์ขึ้นฐานข้อมูลได้เลยโดยไม่ต้องเพิ่มตารางใหม่ */
  var BAGS_TRUCK = 640;   /* ปูนถุง 1 คัน = 640 ถุง = 32 ตัน ตามที่ตกลงไว้ */
  var BAGS_TON = 20;      /* ถุงละ 50 กก. จึง 1 ตัน = 20 ถุง */

  function rdList() {
    return S.entries.filter(function (e) { return e.kind === 'round'; })
      .sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
  }
  function rdFind(id) {
    var f = null;
    S.entries.forEach(function (e) { if (e.kind === 'round' && String(e.id) === String(id)) { f = e; } });
    return f;
  }
  function rdName(id) {
    var r = rdFind(id);
    return r ? ((r.trucks && r.trucks.inv) || ('รอบ ' + r.id)) : '';
  }
  function whList() {
    return S.entries.filter(function (e) { return e.kind === 'whOut'; });
  }
  function newId() {
    var m = 0;
    S.entries.forEach(function (e) { if (Number(e.id) > m) { m = Number(e.id); } });
    return m + 1;
  }
  function dOnly(v) { return String(v || '').slice(0, 10); }
  function daysSince(d) {
    if (!d) { return 0; }
    var a = new Date(dOnly(d) + 'T00:00:00'), b = new Date();
    return Math.floor((b - a) / 86400000);
  }

  /* ---- รวบรวมเที่ยวรถทั้งหมดจากรายการปูนเข้า ---- */
  function stkTrips() {
    var out = [];
    S.entries.forEach(function (e) {
      if (e.kind !== 'import' || !e.trucks) { return; }
      e.trucks.forEach(function (t, i) {
        out.push({
          eid: e.id, seq: i + 1, date: e.date,
          type: t.type || 'powder',
          lao: (t.lao && t.lao.plate) || '', thai: (t.thai && t.thai.plate) || '',
          driver: (t.thai && t.thai.driver) || '',
          tonsL: num(t.lao && t.lao.tons), tonsT: num(t.thai && t.thai.tons),
          load: dOnly(t.tLoad), cross: dOnly(t.tSend),
          wb: t.wb || '', mf: t.mf || '', round: t.round || '',
          bags: num(t.bags),
          wh: !!t.wh, dest: t.dest || '', sp: num(t.sp), jp: !!t.jp
        });
      });
    });
    return out;
  }

  /* ---- คำนวณทุกตัวเลขของหน้านี้ที่เดียว ---- */
  function stkCalc() {
    var trips = stkTrips();
    var transit = trips.filter(function (t) { return t.load && !t.cross; });
    var moves = [];
    trips.forEach(function (t) {
      if (!t.wh) { return; }
      var bags = t.type === 'bag' ? (t.bags || BAGS_TRUCK) : Math.round(t.tonsT * BAGS_TON);
      moves.push({ at: t.cross || t.date, dir: 'in', type: t.type, bags: bags,
                   tons: t.tonsT || bags / BAGS_TON,
                   who: 'รถ ' + (t.thai || t.lao || '—'),
                   note: 'รับเข้าโกดังจากเที่ยวรถ', ref: t });
    });
    whList().forEach(function (e) {
      var p = e.trucks || {};
      var bags = num(p.bags);
      moves.push({ at: e.date, dir: 'out', type: e.cementType || 'bag', bags: bags,
                   tons: bags / BAGS_TON, who: e.who || '', plate: p.plate || '',
                   price: num(e.price), amount: num(e.price) * bags,
                   note: e.note || '', entry: e });
    });
    moves.sort(function (a, b) { return (a.at || '').localeCompare(b.at || ''); });
    var bal = 0;
    moves.forEach(function (m) { bal += (m.dir === 'in' ? m.bags : -m.bags); m.bal = bal; });

    var rds = rdList().map(function (r) {
      var p = r.trucks || {};
      var mine = trips.filter(function (t) { return String(t.round) === String(r.id); });
      return { e: r, p: p,
               plan: num(p.fdTrucks),
               loaded: mine.length,
               crossed: mine.filter(function (t) { return !!t.cross; }).length,
               kgDoc: num(p.kg),
               kgReal: mine.reduce(function (s, t) { return s + t.tonsT * 1000; }, 0),
               trips: mine };
    });

    /* ตัวเลขย่อยที่สองการ์ดวงกลมด้านบนต้องใช้ */
    var loaded = trips.filter(function (t) { return !!t.load; });
    var crossed = loaded.filter(function (t) { return !!t.cross; });
    var byType = { powder: { tr: 0, tons: 0 }, bag: { tr: 0, tons: 0 } };
    transit.forEach(function (t) {
      var k = t.type === 'bag' ? 'bag' : 'powder';
      byType[k].tr += 1; byType[k].tons += t.tonsL;
    });
    var whIn = 0, whOut = 0, whAmt = 0;
    moves.forEach(function (m) {
      if (m.dir === 'in') { whIn += m.bags; } else { whOut += m.bags; whAmt += m.amount || 0; }
    });

    return { trips: trips, transit: transit, moves: moves, bags: bal,
             tons: bal / BAGS_TON, rounds: rds,
             loaded: loaded, crossed: crossed, byType: byType,
             whIn: whIn, whOut: whOut, whAmt: whAmt,
             loadedTons: loaded.reduce(function (s, t) { return s + t.tonsL; }, 0),
             crossedTons: crossed.reduce(function (s, t) { return s + t.tonsT; }, 0),
             transitTons: transit.reduce(function (s, t) { return s + t.tonsL; }, 0) };
  }


  /* ================= สะสมรายเดือน แยกตามชนิดปูน ================= */
  var MY = { year: '' };
  var THM = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.',
             'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

  function ymOf(s) { return String(s || '').slice(0, 7); }
  function ymTH(ym) {
    var y = parseInt(ym.slice(0, 4), 10), m = parseInt(ym.slice(5, 7), 10);
    if (!y || !m) { return ym; }
    return THM[m - 1] + ' ' + String((y + 543) % 100);
  }
  function ymFull(ym) {
    var y = parseInt(ym.slice(0, 4), 10), m = parseInt(ym.slice(5, 7), 10);
    var full = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
    if (!y || !m) { return ym; }
    return full[m - 1] + ' ' + (y + 543);
  }

  /* หนึ่งเดือนมีสองชนิดปูน แต่ละชนิดนับแยกกันทั้งนำเข้า ขายออก และคงเหลือ
     นำเข้านับตอนผ่านด่านไทย คันที่ยังไม่ผ่านด่านยังไม่ถือว่านำเข้า
     ปูนผงนับเป็นตัน ปูนถุงนับเป็นถุง ยอดคงเหลือยกยอดข้ามเดือนต่อเนื่อง */
  function stkMonths() {
    var map = {};
    function blank() { return { inCars: 0, inQty: 0, outQty: 0, outAmt: 0, bal: 0, noPrice: 0, noPriceQty: 0 }; }
    function slot(ym, ty) {
      if (!map[ym]) { map[ym] = { ym: ym, powder: blank(), bag: blank() }; }
      return map[ym][ty === 'bag' ? 'bag' : 'powder'];
    }
    stkTrips().forEach(function (t) {
      if (!t.cross) { return; }
      var q = t.type === 'bag' ? (t.bags || BAGS_TRUCK) : t.tonsT;
      var s = slot(ymOf(t.cross), t.type);
      s.inCars += 1;
      s.inQty += q;
    });
    whList().forEach(function (e) {
      var p = e.trucks || {}, ty = e.cementType || 'bag';
      var bags = num(p.bags);
      var s = slot(ymOf(e.date), ty);
      s.outQty += ty === 'bag' ? bags : bags / BAGS_TON;
      s.outAmt += num(e.price) * bags;
    });
    pwList().forEach(function (e) {
      var s = slot(ymOf(e.date), 'powder');
      s.outQty += num(e.tons);
      s.outAmt += num(e.price) * num(e.tons);
    });
    var keys = Object.keys(map).sort();
    var bal = { powder: 0, bag: 0 };
    return keys.map(function (k) {
      var r = map[k];
      ['powder', 'bag'].forEach(function (ty) {
        bal[ty] += r[ty].inQty - r[ty].outQty;
        r[ty].bal = bal[ty];
      });
      return r;
    });
  }

  function myQty(ty, v) { return ty === 'bag' ? m0(v) + ' ถุง' : m2(v) + ' ตัน'; }

  function myKpi(lab, big, unit, sub) {
    return '<div style="flex:1 1 112px;min-width:106px">' +
      '<p class="note" style="margin:0;font-size:11.5px">' + esc(lab) + '</p>' +
      '<p class="num" style="margin:2px 0 0;font-size:24px;font-weight:700;color:var(--head)">' + big + '</p>' +
      '<p class="u" style="margin:1px 0 4px;font-size:11px">' + esc(unit) + '</p>' + sub + '</div>';
  }
  function myDelta(a, b) {
    if (!b) { return '<span class="hint">เดือนก่อนไม่มี</span>'; }
    var p = (a - b) / b * 100;
    return '<span class="badge ' + (p >= 0 ? 'b-s' : 'b-d') + '">' +
      (p >= 0 ? '↑ ' : '↓ ') + m0(Math.abs(p)) + '%</span>';
  }
  function myCard(title, note, tone, ty, cur, prv) {
    var unit = ty === 'bag' ? 'ถุง' : 'ตัน';
    return '<div style="flex:1 1 520px;min-width:320px;border:1px solid var(--line);border-left:4px solid ' + tone + ';' +
      'border-radius:14px;padding:14px 16px;background:var(--soft)">' +
      '<p class="t" style="margin:0 0 9px">' + esc(title) + ' <span class="hint">· ' + esc(note) + '</span></p>' +
      '<div style="display:flex;gap:11px;flex-wrap:wrap">' +
      myKpi('นำเข้า', ty === 'bag' ? m0(cur.inQty) : m2(cur.inQty), unit + ' · ' + m0(cur.inCars) + ' คัน',
            prv ? myDelta(cur.inQty, prv.inQty) : '<span class="hint">เดือนแรก</span>') +
      myKpi('ขายออก', ty === 'bag' ? m0(cur.outQty) : m2(cur.outQty), unit,
            prv ? myDelta(cur.outQty, prv.outQty) : '<span class="hint">เดือนแรก</span>') +
      myKpi('ยอดขาย', m0(cur.outAmt), 'บาท (รวมภาษี)',

      .concat(['เป็นเงิน', 'ชุดนำเข้าที่มา', 'คงเหลือสะสม (' + unit + ')', 'หมายเหตุ']);
    var outFmt = ['n0', 'd', '', '', '', '']
      .concat(bag ? ['n0', 'n2', 'n2'] : ['n2', 'n2'])
      .concat(['n2', '', 'n2', '']);
    var outW = [6, 13, 26, 18, 14, 20]
      .concat(bag ? [10, 12, 12] : [12, 12])
      .concat([14, 16, 18, 24]);
    var tOut = { qty: 0, tons: 0, amt: 0, cr: 0, no: 0 }, byCus = {}, byCr = {};
    var outRows = outs.map(function (m, i) {
      var e = m.e, p = m.p, cid = crOf(e), cn = cid ? crName(cid) : '';
      tOut.qty += m.qty; tOut.tons += m.tons; tOut.amt += m.amount;
      if (cid) { tOut.cr += m.amount; } else { tOut.no += m.amount; }
      var ck = e.who || 'ไม่ระบุชื่อลูกค้า';
      if (!byCus[ck]) { byCus[ck] = { n: 0, qty: 0, tons: 0, amt: 0 }; }
      byCus[ck].n += 1; byCus[ck].qty += m.qty; byCus[ck].tons += m.tons; byCus[ck].amt += m.amount;
      if (cid) {
        if (!byCr[cid]) { byCr[cid] = { n: 0, tons: 0, amt: 0 }; }
        byCr[cid].n += 1; byCr[cid].tons += m.tons; byCr[cid].amt += m.amount;
      }
      return [i + 1, m.at, e.who || '', p.plate || '',
        p.auto ? 'ขายปลายทาง' : 'ขายปกติ', cn || 'ไม่ตัดเครดิต']
        .concat(bag ? [m.qty, m.tons, m.price] : [m.qty, m.price])
        .concat([m.amount, exSrcInv(p), m.bal, e.note || '']);
    });
    var outTot = ['รวม', outs.length + ' รายการ', '', '', '', '']
      .concat(bag ? [tOut.qty, tOut.tons, ''] : [tOut.qty, ''])
      .concat([tOut.amt, '', '', '']);

    /* ---- ชีตสรุปตามลูกค้า ---- */
    var cusRows = Object.keys(byCus).map(function (k) { return [k, byCus[k]]; })
      .sort(function (a, b) { return b[1].qty - a[1].qty; })
      .map(function (x, i) {
        var v = x[1];
        return [i + 1, x[0], v.n, v.qty, v.amt, v.qty > 0 ? v.amt / v.qty : 0,
          tOut.qty > 0 ? v.qty / tOut.qty : 0];

    var crRows = crAll().map(function (q, i) {
      var v = byCr[q.id] || { n: 0, tons: 0, amt: 0 };
      return [i + 1, q.name, v.n, v.tons, v.amt, num(c.crBal[q.id])];
    });
    crRows.push(['', 'ไม่ตัดเครดิต', outs.length - Object.keys(byCr).reduce(function (s, k) { return s + byCr[k].n; }, 0),
      '', tOut.no, '']);

    /* ---- ชีตรายการที่ลบไว้ ---- */
    var binRows = S.entries.filter(function (e) {
      if (e.kind !== 'bin' || !exIn(r, e.date)) { return false; }
      var bt = exBinType(e);
      return !bt || bt === ty;
    }).sort(function (a, b) {
      return String((a.trucks || {}).at).localeCompare(String((b.trucks || {}).at));
    }).map(function (e, i) {
      var p = e.trucks || {}, s = exBinSum(e);
      return [i + 1, dOnly(p.at || e.date), exTime(p.at), p.who || '',

    });

    /* ---- ชีตสรุป ---- */

    var dHead = ['ลำดับ', 'วันที่', 'เวลา', 'รายการ', 'ลูกค้า/ที่มา', 'ตัดเครดิตให้']
      .concat(bag ? ['รับเข้า (ถุง)', 'ขายออก (ถุง)', 'ตัน'] : ['รับเข้า (ตัน)', 'ขายออก (ตัน)'])
      .concat(['ราคา ฿/' + (bag ? 'ถุง' : 'ตัน'), 'เป็นเงิน', 'คงเหลือ (' + unit + ')', 'ชุดนำเข้า']);
    var dFmt = ['n0', 'd', '', '', '', '']
      .concat(bag ? ['n0', 'n0', 'n2'] : ['n2', 'n2'])
      .concat(['n2', 'n2', 'n2', '']);
    var dW = [6, 13, 7, 14, 32, 20]
      .concat(bag ? [13, 13, 10] : [14, 14])
      .concat([13, 15, 16, 15]);
    var dRows = [], dMark = [], dTone = [], dSeq = 0, dCur = '', dAcc = null;
    function dFlush() {
      if (!dAcc) { return; }
      dRows.push(['', dAcc.at, '', 'ปิดยอดวัน',
        'รับเข้า ' + (bag ? m0(dAcc.i) : m2(dAcc.i)) + ' · ขายออก ' +
          (bag ? m0(dAcc.o) : m2(dAcc.o)) + ' ' + unit, '']
        .concat(bag ? [dAcc.i, dAcc.o, dAcc.t] : [dAcc.i, dAcc.o])
        .concat(['', dAcc.amt || '', dAcc.bal, '']));
      dMark.push(true);
      dTone.push('');
      dAcc = null;
    }
    mine.forEach(function (m) {
      if (dCur && m.at !== dCur) { dFlush(); }
      dCur = m.at;
      if (!dAcc) { dAcc = { at: m.at, i: 0, o: 0, t: 0, amt: 0, bal: 0 }; }
      var isIn = m.dir === 'in';
      var t = m.t || {}, e = m.e || {}, p = m.p || {};
      var lp = (t.lao && t.lao.plate) || '', tp = (t.thai && t.thai.plate) || '';
      var cid = isIn ? '' : crOf(e);
      dSeq += 1;
      dRows.push([dSeq, m.at, isIn ? m.time : '',
        isIn ? 'รับเข้า' : (p.auto ? 'ขายปลายทาง' : 'ขายออก'),
        isIn ? ('รถ ' + (lp || tp || '—') + (lp && tp ? ' / ' + tp : ''))
             : ((e.who || '') + (p.plate ? ' · ' + p.plate : '')),
        isIn ? '' : (cid ? crName(cid) : 'ไม่ตัดเครดิต')]
        .concat(bag ? [isIn ? m.qty : '', isIn ? '' : m.qty, m.tons]
                    : [isIn ? m.qty : '', isIn ? '' : m.qty])
        .concat([isIn ? '' : m.price, isIn ? '' : m.amount, m.bal,
                 isIn ? exSet(t.round).inv : exSrcInv(p)]));
      dMark.push(false);
      dTone.push(isIn ? 'in' : 'out');
      dAcc.i += isIn ? m.qty : 0;
      dAcc.o += isIn ? 0 : m.qty;
      dAcc.t += isIn ? m.tons : -m.tons;
      dAcc.amt += isIn ? 0 : m.amount;
      dAcc.bal = m.bal;
    });
    dFlush();
    var dTotIn = bag ? tIn.bags : tIn.thaiT;
    var dTot = ['รวม', '', '', '', dSeq + ' รายการ · ' + Object.keys(days).length + ' วัน', '']
      .concat(bag ? [dTotIn, tOut.qty, (dTotIn - tOut.qty) / BAGS_TON] : [dTotIn, tOut.qty])
      .concat(['', tOut.amt, last ? last.bal : 0, '']);
    var sumRows = [
      [1, 'ชนิดปูน', typeTH(ty), ''],
      [2, 'จำนวนวันที่มีรายการ', Object.keys(days).length, 'วัน'],
      [3, 'รับเข้าสตอก', bag ? tIn.bags : tIn.thaiT, unit],
      [4, 'จำนวนคันที่รับเข้า', ins.length, 'คัน'],
      [5, 'น้ำหนักใบชั่งโรงงานรวม', tIn.docT, 'ตัน'],
      [6, 'ส่วนต่างจากการถ่ายปูนรวม', tIn.loss, 'ตัน'],
      [7, 'ตัดขายออก', tOut.qty, unit],
      [8, 'จำนวนรายการขาย', outs.length, 'รายการ'],
      [9, 'มูลค่าตัดขายรวม', tOut.amt, 'บาท'],
      [10, 'ในนั้นตัดเครดิตคู่ค้า', tOut.cr, 'บาท'],
      [11, 'ไม่ตัดเครดิต (ลูกค้าเงินสด)', tOut.no, 'บาท'],
      [12, 'คงเหลือในสตอก ณ วันสุดท้ายของช่วง', last ? last.bal : 0, unit],
      [13, 'ต้นทุนรวมของที่รับเข้า', tIn.cost, 'บาท'],

      [15, 'รายการที่ลบไว้ในช่วงนี้', binRows.length, 'ครั้ง']

    function L(title, extra) {

        { frz: 2, name: 'สรุป', lines: L('สรุปรับเข้าและตัดขาย', nDay), land: false,
          blocks: [{ head: ['ลำดับ', 'หัวข้อ', 'ค่า', 'หน่วย'],
                     fmt: function (i) {
                       var u = (sumRows[i] || [])[3];
                       var cnt = (u === 'วัน' || u === 'คัน' || u === 'รายการ' || u === 'ครั้ง');
                       return ['n0', '', cnt ? 'n0' : 'n2', ''];
                     },
                     w: [7, 38, 16, 11], rows: sumRows }] },
        { frz: 3, name: 'รายวัน', lines: L('บันทึกรายวัน เข้า-ออก',
            'รับเข้า ' + (bag ? m0(dTotIn) : m2(dTotIn)) + ' · ขายออก ' +
            (bag ? m0(tOut.qty) : m2(tOut.qty)) + ' ' + unit), land: true,
          blocks: [{ head: dHead, fmt: dFmt, w: dW, rows: dRows, mark: dMark,
                     tone: dTone, toneAt: bag ? [3, 6, 7] : [3, 6, 7],
                     total: dRows.length ? dTot : null }] },
        { frz: 3, name: 'รับเข้า', lines: L('รายงานรับเข้าสตอก ทีละคันรถ',
            ins.length + ' คัน · รับเข้ารวม ' + m2(bag ? tIn.bags : tIn.thaiT) + ' ' + unit), land: true,
          blocks: [{ head: inHead, fmt: inFmt, w: inW, rows: inRows, total: inRows.length ? inTot : null }] },

        { frz: 2, name: 'สรุปตามลูกค้า', lines: L('สรุปตามลูกค้าและคู่ค้าเครดิต',
            cusRows.length + ' ราย'), land: false,
          blocks: [
            { head: ['ลำดับ', 'ลูกค้า/ปลายทางจัดส่ง', 'จำนวนครั้ง', unit, 'เป็นเงิน',
                     'ราคาเฉลี่ย ฿/' + unit, 'สัดส่วน'],
              fmt: ['n0', '', 'n0', 'n2', 'n2', 'n2', 'pc'], w: [7, 30, 12, 13, 16, 17, 11],
              rows: cusRows,
              total: cusRows.length ? ['', 'รวม', outs.length, tOut.qty, tOut.amt,
                tOut.qty > 0 ? tOut.amt / tOut.qty : 0, cusRows.length ? 1 : 0] : null },
            { head: ['ลำดับ', 'คู่ค้าวางเงินล่วงหน้า', 'จำนวนครั้ง', 'ตันที่ส่งมอบ', 'ตัดเครดิตไป',
                     'เครดิตคงเหลือล่าสุด'],
              fmt: ['n0', '', 'n0', 'n2', 'n2', 'n2'], w: [7, 30, 12, 15, 16, 20], rows: crRows }
          ] },
        { frz: 3, name: 'รายการที่ลบไว้', lines: L('รายการที่ลบไว้ ยังไม่ได้กู้คืน', binRows.length + ' ครั้ง'), land: true,
          blocks: [{ head: ['ลำดับ', 'วันที่ลบ', 'เวลา', 'คนลบ', 'ลบอะไร', 'รายละเอียด',
                            'รายการที่หายพร้อมกัน', 'ตัน', 'เป็นเงิน', 'สถานะตอนนี้'],
                     fmt: ['n0', 'd', '', '', '', '', 'n0', 'n2', 'n2', ''],
                     w: [7, 13, 8, 18, 16, 44, 19, 11, 14, 17], rows: binRows }] }
      ]
    };
  }

  /* ปัดเศษตามชนิดช่อง จะได้ไม่มีทศนิยมหางยาวติดไปในไฟล์ */
  function exFix(v, k) {
    if (typeof v !== 'number' || !isFinite(v)) { return v; }
    if (k === 'n0') { return Math.round(v); }
    if (k === 'pc') { return Math.round(v * 10000) / 10000; }
    return Math.round(v * 100) / 100;
  }

  /* ---- CSV ได้เนื้อหาเหมือนกัน แค่ไม่มีโลโก้กับสี ---- */
  function exCsv(doc) {
    var out = [];
    function line(r, b, n) {
      var f = exFmtOf(b, n);
      out.push(r.map(function (v, i) { return exFix(v, f[i]); }));
    }
    doc.sheets.forEach(function (s) {
      s.lines.forEach(function (t) { out.push([t]); });
      s.blocks.forEach(function (b) {
        out.push([]);
        out.push(b.head);
        b.rows.forEach(function (r, i) { line(r, b, i); });
        if (b.total) { line(b.total, b, -1); }
      });
      out.push([]); out.push([]);
    });
    return out.map(function (r) { return r.map(rpCsvCell).join(','); }).join('\n');
  }

  /* เส้นขอบรอบช่อง ให้พิมพ์ออกมาเป็นตารางมีกรอบทุกช่อง */
  function exBd(argb, style) {
    var e = { style: style || 'thin', color: { argb: argb } };
    return { top: e, left: e, bottom: e, right: e };
  }
  var EX_BD_HEAD = 'FF1E2B6E';
  var EX_BD_CELL = 'FFBFBFBF';
  var EX_BD_SUM = 'FF8E9BC9';

  function exNumFmt(k) {
    if (k === 'n0') { return '#,##0'; }
    if (k === 'n2') { return '#,##0.00'; }
    if (k === 'pc') { return '0.0%'; }
    if (k === 'd') { return 'yyyy-mm-dd'; }
    return null;
  }
  /* ช่องวันที่เขียนเป็นวันที่จริงของ Excel จะได้เรียงและลบวันกันได้
     ใช้ Date.UTC เพื่อไม่ให้เลื่อนวันตามเขตเวลาของเครื่อง */
  function exCell(v, k) {
    if (k === 'd' && typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
      return new Date(Date.UTC(num(v.slice(0, 4)), num(v.slice(5, 7)) - 1, num(v.slice(8, 10))));
    }
    return exFix(v, k);
  }

  function exXlsx(doc, done) {
    function build() {
      var EJ = window.ExcelJS;
      if (!EJ) { done(false); return; }
      var wb = new EJ.Workbook();
      wb.creator = 'Blue Stone Import';
      var b64 = exLogo();
      var img = b64 ? wb.addImage({ base64: b64, extension: 'png' }) : null;
      doc.sheets.forEach(function (s) {
        var nCol = 1;
        s.blocks.forEach(function (b) { nCol = Math.max(nCol, b.head.length); });
        var ws = wb.addWorksheet(s.name, {
          pageSetup: { orientation: s.land ? 'landscape' : 'portrait', paperSize: 9,
                       fitToPage: true, fitToWidth: 1, fitToHeight: 0,
                       margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.5, header: 0.2, footer: 0.2 } }
        });
        ws.columns = (s.blocks[0].w || []).map(function (w, i) {
          return { width: i === 0 ? Math.max(w, 10) : w };     /* ช่องแรกกว้างพอให้โลโก้วางได้ */
        });
        /* หัวเอกสาร 5 บรรทัด เว้นคอลัมน์แรกไว้ให้โลโก้ */
        s.lines.forEach(function (txt, i) {
          var row = ws.getRow(i + 1);
          row.height = [21, 16, 18, 16, 15][i] || 15;
          var cell = row.getCell(2);
          cell.value = txt;
          if (nCol > 2) { ws.mergeCells(i + 1, 2, i + 1, nCol); }
          if (i === 0) { cell.font = { bold: true, size: 13 }; }
          else if (i === 2) { cell.font = { bold: true, size: 11.5, color: { argb: 'FF' + EX_HEAD } }; }
          else if (i === 3) { cell.font = { bold: true, size: 10.5 }; }
          else { cell.font = { size: 10, color: { argb: 'FF6B6B6B' } }; }
          cell.alignment = { vertical: 'middle', horizontal: 'left', indent: 6 };  /* เว้นที่ให้โลโก้ */
        });
        /* เส้นน้ำเงินคั่นใต้หัวเอกสาร ยาวเท่าความกว้างตาราง */
        var r5 = ws.getRow(5), ci;
        for (ci = 1; ci <= nCol; ci += 1) {
          r5.getCell(ci).border = { bottom: { style: 'medium', color: { argb: 'FF' + EX_HEAD } } };
        }
        if (img !== null) {
          ws.addImage(img, { tl: { col: 0.10, row: 0.12 }, ext: { width: 104, height: 104 } });
        }
        var at = 7;
        var firstHead = 0;
        s.blocks.forEach(function (b) {
          var hr = ws.getRow(at);
          var hf = exFmtOf(b, -1);
          b.head.forEach(function (h, i) {
            var cell = hr.getCell(i + 1);
            cell.value = h;
            cell.font = { bold: true, size: 10, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + EX_HEAD } };
            cell.border = exBd(EX_BD_HEAD);
            cell.alignment = { vertical: 'middle', wrapText: true,
                               horizontal: (hf[i] && hf[i] !== 'd') ? 'right' : 'left' };
          });
          hr.height = 26;
          if (!firstHead) { firstHead = at; }
          at += 1;
          var mk = b.mark || [], tn = b.tone || [], tAt = b.toneAt || [];
          b.rows.forEach(function (r, k) {
            var row = ws.getRow(at);
            var rf = exFmtOf(b, k);
            r.forEach(function (v, i) {
              var cell = row.getCell(i + 1);
              cell.value = (v === '' || v === null || v === undefined) ? null : exCell(v, rf[i]);
              var f = exNumFmt(rf[i]);
              if (f && (typeof v === 'number' || rf[i] === 'd')) { cell.numFmt = f; }
              cell.font = { size: 10 };
              cell.border = exBd(mk[k] ? EX_BD_SUM : EX_BD_CELL);
              if (!mk[k] && tn[k] && tAt.indexOf(i) >= 0) {
                cell.font = { size: 10, bold: true,
                              color: { argb: tn[k] === 'in' ? 'FF1F6F4A' : 'FFB3261E' } };
              }
              if (mk[k]) {
                cell.font = { bold: true, size: 10 };
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + EX_DAY } };
              } else if (k % 2 === 1) {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + EX_BAND } };
              }
            });
            at += 1;
          });
          if (b.total) {
            var tr = ws.getRow(at);
            var tf = exFmtOf(b, -1);
            b.total.forEach(function (v, i) {
              var cell = tr.getCell(i + 1);
              cell.value = (v === '' || v === null || v === undefined) ? null : exCell(v, tf[i]);
              var f = exNumFmt(tf[i]);
              if (f && (typeof v === 'number' || tf[i] === 'd')) { cell.numFmt = f; }
              cell.font = { bold: true, size: 10 };
              cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + EX_TOTAL } };
              cell.border = exBd(EX_BD_SUM);
            });
            at += 1;
          }
          at += 1;
        });
        if (firstHead) {
          ws.views = [{ state: 'frozen', xSplit: s.frz || 0, ySplit: firstHead }];
          ws.autoFilter = { from: { row: firstHead, column: 1 },
                            to: { row: firstHead, column: s.blocks[0].head.length } };
          ws.pageSetup.printTitlesRow = '1:' + firstHead;
        }
        ws.headerFooter = {
          oddFooter: '&L' + doc.fname + '.xlsx · ชีต' + s.name + '&C' + s.lines[3] + '&R หน้า &P / &N'
        };
      });
      wb.xlsx.writeBuffer().then(function (buf) {
        rpSave(doc.fname + '.xlsx', new Blob([buf], {
          type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        }));
        done(true);
      }, function () { done(false); });
    }
    if (window.ExcelJS) { build(); return; }
    var i = 0;
    function next() {
      if (i >= EX_LIBS.length) { done(false); return; }
      var sc = document.createElement('script');
      sc.src = EX_LIBS[i];
      i += 1;
      sc.onload = function () { if (window.ExcelJS) { build(); } else { next(); } };
      sc.onerror = next;
      document.head.appendChild(sc);
    }
    next();
  }

  function exRun(ty, fmt, redraw) {
    if (EXP.busy) { return; }
    var doc = (ty === 'round') ? exRoundDoc()
            : (ty === 'transit') ? exTransitDoc() : exDoc(ty);
    if (fmt === 'csv') {
      rpSave(doc.fname + '.csv', exCsv(doc), 'text/csv;charset=utf-8');
      logIt('ส่งออกข้อมูล', doc.fname + '.csv');
      toast('ส่งออกไฟล์ CSV แล้ว');
      EXP.open = ''; redraw();
      return;
    }
    EXP.busy = true;
    toast('กำลังสร้างไฟล์ Excel…');
    exXlsx(doc, function (ok) {
      EXP.busy = false;
      if (ok) {
        logIt('ส่งออกข้อมูล', doc.fname + '.xlsx');
        toast('ส่งออกไฟล์ Excel แล้ว');
        EXP.open = '';
      } else {
        toast('สร้างไฟล์ Excel ไม่สำเร็จ ลองใหม่อีกครั้ง หรือกดส่งออกเป็น CSV แทน');
      }
      redraw();
    });
  }

  /* ---- ปุ่มมุมขวาบนของหัวข้อ ---- */
  function exBtn(ty) {
    var on = EXP.open === ty;
    return '<button type="button" class="btn' + (on ? ' pri' : '') + '" id="exBtn' + exTag(ty) + '" ' +
      'style="min-height:36px;padding:0 13px;font-size:12.5px;margin-left:auto">' +
      '<span class="ms" aria-hidden="true" style="font-size:18px">download</span>' +
      (on ? 'ปิด' : 'ส่งออก') + '</button>';
  }

  function exPanel(ty) {
    if (EXP.open !== ty) { return ''; }
    var g = exTag(ty), r = exRange(), t = todayISO();
    function seg(k, label) {
      return '<button type="button" class="btn' + (EXP.mode === k ? ' pri' : '') + '" data-exm="' + k + '" ' +
        'style="min-height:32px;padding:0 12px;font-size:12.5px">' + label + '</button>';
    }
    var body = '';
    if (EXP.mode === 'month') {
      body = '<label class="fl" for="exM' + g + '">เดือน</label>' +
        '<select id="exM' + g + '" style="min-height:38px">' +
        exMonList().map(function (k) {
          return '<option value="' + k + '"' + ((EXP.m || t.slice(0, 7)) === k ? ' selected' : '') + '>' +
            esc(ymTH(k)) + '</option>';
        }).join('') + '</select>';
    } else if (EXP.mode === 'week') {
      body = '<label class="fl" for="exW' + g + '">สัปดาห์ (จันทร์ถึงอาทิตย์)</label>' +
        '<select id="exW' + g + '" style="min-height:38px">' +
        exWkList().map(function (k) {
          return '<option value="' + k + '"' + ((EXP.w || exMonday(t)) === k ? ' selected' : '') + '>' +
            k + ' ถึง ' + exAdd(k, 6) + '</option>';
        }).join('') + '</select>';
    } else if (EXP.mode === 'day') {
      body = '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<div style="flex:1 1 150px;min-width:0"><label class="fl" for="exD1' + g + '">ตั้งแต่</label>' +
        '<input id="exD1' + g + '" type="date" value="' + esc(EXP.d1 || t) + '" style="min-height:38px;width:100%"></div>' +
        '<div style="flex:1 1 150px;min-width:0"><label class="fl" for="exD2' + g + '">ถึง</label>' +
        '<input id="exD2' + g + '" type="date" value="' + esc(EXP.d2 || t) + '" style="min-height:38px;width:100%"></div>' +
        '</div>';
    } else {
      body = '<p class="hint" style="margin:0">ส่งออกทุกรายการที่มีในระบบ ไม่จำกัดวันที่</p>';
    }
    return '<div class="card" style="box-shadow:none;border:2px solid var(--accent);margin-bottom:10px">' +
      '<div class="card-b" style="padding:13px 14px">' +
      '<p style="margin:0 0 9px;font-size:13px;font-weight:700;color:var(--head)">' +
      'ส่งออก' + esc(exWhat(ty)) + '</p>' +
      '<div class="actions" style="margin-bottom:9px">' +
      seg('day', 'ช่วงวัน') + seg('week', 'สัปดาห์') + seg('month', 'เดือน') + seg('all', 'ทั้งหมด') + '</div>' +
      body +
      '<p class="hint" style="margin:9px 0 0">ช่วงที่จะได้ · ' + esc(exLabel(r)) + '</p>' +
      '<div class="actions" style="margin-top:10px">' +
      '<button type="button" class="btn pri" data-exf="xlsx">ไฟล์ Excel (.xlsx)</button>' +
      '<button type="button" class="btn" data-exf="csv">ไฟล์ CSV</button></div>' +
      '<p class="hint" style="margin:8px 0 0">' +
      (ty === 'round'
        ? 'ไฟล์เดียวมี 3 ชีต คือ สรุป · ชุดนำเข้า · รถในชุด · มีเอกสารของชุดครบทุกเลข ' +
          'และต้นทุนแยกรายการทั้งรายชุดและรายคัน'
        : ty === 'transit'
          ? 'ไฟล์เดียวมี 2 ชีต คือ สรุป · รถค้างด่าน · เรียงจากคันที่ค้างนานที่สุด ' +
            'มีเบอร์คนขับกับผู้ขนส่งฝั่งลาวไว้ตามเรื่องได้เลย'
        : 'ไฟล์เดียวมี 6 ชีต คือ สรุป · รายวัน · รับเข้า · ตัดขายออก · สรุปตามลูกค้า · รายการที่ลบไว้') +
      ' · ทุกชีตมีโลโก้กับช่วงวันที่ พิมพ์ออกมาใช้ได้เลย</p>' +
      '</div></div>';
  }

  function exBind(ty, redraw) {
    redraw = redraw || viewEntry;
    var g = exTag(ty), b = el('exBtn' + g);
    if (b) {
      b.addEventListener('click', function () {
        var opening = EXP.open !== ty;
        EXP.open = opening ? ty : '';
        if (opening && ty === 'transit') { EXP.mode = 'all'; }
        redraw();
      });
    }
    if (EXP.open !== ty) { return; }
    Array.prototype.forEach.call(document.querySelectorAll('[data-exm]'), function (x) {
      x.addEventListener('click', function () { EXP.mode = x.getAttribute('data-exm'); redraw(); });
    });
    if (el('exM' + g)) {
      el('exM' + g).addEventListener('change', function () { EXP.m = el('exM' + g).value; redraw(); });
    }
    if (el('exW' + g)) {
      el('exW' + g).addEventListener('change', function () { EXP.w = el('exW' + g).value; redraw(); });
    }
    if (el('exD1' + g)) {
      el('exD1' + g).addEventListener('change', function () { EXP.d1 = el('exD1' + g).value; redraw(); });
    }
    if (el('exD2' + g)) {
      el('exD2' + g).addEventListener('change', function () { EXP.d2 = el('exD2' + g).value; redraw(); });
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-exf]'), function (x) {
      x.addEventListener('click', function () { exRun(ty, x.getAttribute('data-exf'), redraw); });
    });
  }

  /* ================= ส่งออกชุดนำเข้าและต้นทุน · หัวข้อ 4 ================= */
  function exRoundDoc() {
    var r = exRange(), items = exItems(), tax = exTaxes();
    var who = (S.profile && S.profile.name) || '—';
    var role = (S.profile && S.profile.role) || '';
    var now = todayISO() + ' เวลา ' + sbNow().slice(0, 5) + ' น.';

    /* รถทุกคันของแต่ละชุด */
    var byRound = {};
    S.entries.forEach(function (e) {
      if (e.kind !== 'import' || !e.trucks) { return; }
      e.trucks.forEach(function (t, i) {
        if (!t.round) { return; }
        if (!byRound[t.round]) { byRound[t.round] = []; }
        byRound[t.round].push({ e: e, t: t, seq: i + 1, it: items[e.id + ':' + (i + 1)] || {},
                                tax: tax[t.round] || 0 });
      });
    });

    var sets = rdList().filter(function (e) { return exIn(r, e.date); })
      .sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });

    var T = { trucks: 0, done: 0, wait: 0, kgDoc: 0, kgReal: 0, diff: 0, f: 0, lao: 0, fr: 0,
              scan: 0, thai: 0, tax: 0, cost: 0, tons: 0, short: 0, expd: 0 };
    var sRows = [], tRows = [], tTone = [], n2 = 0;

    sets.forEach(function (e, i) {
      var p = e.trucks || {};
      var list = byRound[e.id] || [];
      var done = list.filter(function (x) { return !!dOnly(x.t.tSend); });
      var plan = num(p.fdTrucks);
      var kgReal = 0, f = 0, lao = 0, fr = 0, scan = 0, thai = 0, tons = 0;
      done.forEach(function (x) {
        var it = x.it;
        kgReal += num(it.tonsThai) * 1000;
        tons += num(it.tonsThai);
        f += num(it.fAmt);
        lao += num(it.shipAmt) - num(it.freightAmt);
        fr += num(it.freightAmt);
        scan += num(it.scan);
        thai += num(it.thaiAmt);
      });
      var tx = rdTax(p);
      var cost = f + lao + fr + scan + thai + tx;
      var exp = p.tisiExp ? daysSince(p.tisiExp) : null;
      var short = plan > 0 && done.length < plan;

      T.trucks += list.length; T.done += done.length; T.wait += list.length - done.length;
      T.kgDoc += num(p.kg); T.kgReal += kgReal;
      if (num(p.kg) > 0) { T.diff += num(p.kg) - kgReal; }   /* ชุดที่ยังไม่กรอกน้ำหนักเอกสาร ไม่เอามาคิดส่วนต่าง */
      T.f += f; T.lao += lao; T.fr += fr;
      T.scan += scan; T.thai += thai; T.tax += tx; T.cost += cost; T.tons += tons;
      if (short) { T.short += 1; }
      if (exp !== null && exp > 0) { T.expd += 1; }

      sRows.push([i + 1, p.inv || '', dOnly(p.invDate) || dOnly(e.date),
        typeTH(e.cementType === 'bag' ? 'bag' : 'powder'),
        p.fd || '', dOnly(p.fdDate), p.decl || '', dOnly(p.declDate),
        p.tisi || '', dOnly(p.tisiExp),
        plan || '', done.length,
        plan ? (short ? 'ขาด ' + (plan - done.length) + ' คัน' : 'ครบ') : 'ไม่ได้ระบุจำนวน',
        num(p.kg) || '', kgReal, num(p.kg) ? num(p.kg) - kgReal : '',
        f, lao, fr, scan, thai, tx, cost, tons > 0 ? cost / tons : 0,
        (p.docs || []).length]);

      list.sort(function (a, b) { return a.seq - b.seq; }).forEach(function (x) {
        var t = x.t, it = x.it;
        var at = dOnly(t.tSend);
        var tnT = num(it.tonsThai);
        var cst = num(it.fAmt) + num(it.shipAmt) + num(it.scan) + num(it.thaiAmt) + num(x.tax);
        n2 += 1;
        tRows.push([n2, p.inv || '', x.seq, at || '', exTime(t.tSend),
          (t.lao && t.lao.plate) || '', (t.thai && t.thai.plate) || '',
          typeTH(t.type || 'powder'),
          num(it.tons), tnT, num(it.loss),
          num(it.fRate), num(it.fAmt), num(it.shipAmt) - num(it.freightAmt), num(it.freightAmt),
          num(it.scan), num(it.thaiAmt), num(x.tax), cst, tnT > 0 ? cst / tnT : 0,
          (t.lao && t.lao.company) || '', (t.lao && t.lao.driver) || '',
          (t.thai && t.thai.company) || '', (t.thai && t.thai.driver) || '',
          t.mf || '', t.wb || '', at ? 'ผ่านด่านแล้ว' : 'ยังไม่ผ่านด่าน']);
        tTone.push(at ? '' : 'out');
      });
    });

    function L(title, extra) {
      return ['BLUE STONE TRADING CO., LTD.',
        (S.names && S.names.company) || 'บริษัท บลูสโตนเทรดดิ้ง จำกัด',
        title,
        'ช่วงข้อมูล ' + exLabel(r) + (extra ? ' · ' + extra : ''),
        'ออกเมื่อ ' + now + ' · โดย ' + who + (role ? ' (' + role + ')' : '')];
    }
    var sumRows = [
      [1, 'จำนวนชุดนำเข้า', sets.length, 'ชุด'],

  /* ================= ส่งออกรถที่ยังไม่ผ่านด่าน · หัวข้อ 3 ================= */
  function exTransitDoc() {
    var r = exRange(), items = exItems();
    var warn = num(S.rates && S.rates.transitWarn) || 3;
    var who = (S.profile && S.profile.name) || '—';
    var role = (S.profile && S.profile.role) || '';
    var now = todayISO() + ' เวลา ' + sbNow().slice(0, 5) + ' น.';

    var list = [];
    S.entries.forEach(function (e) {
      if (e.kind !== 'import' || !e.trucks) { return; }
      e.trucks.forEach(function (t, i) {
        var load = dOnly(t.tLoad);
        if (!load || dOnly(t.tSend)) { return; }        /* เอาเฉพาะรับปูนแล้วแต่ยังไม่ผ่านด่าน */
        if (!exIn(r, load)) { return; }
        list.push({ e: e, t: t, seq: i + 1, load: load, it: items[e.id + ':' + (i + 1)] || {},
                    days: daysSince(load) });
      });
    });
    list.sort(function (a, b) { return b.days - a.days; });   /* ค้างนานสุดอยู่บนสุด */

    var T = { n: 0, late: 0, powder: 0, bag: 0, tons: 0, bags: 0, amt: 0, max: 0 };
    var rows = [], tone = [];
    list.forEach(function (x, i) {
      var t = x.t, it = x.it, st = exSet(t.round);
      var ty = t.type || 'powder';
      var late = x.days >= warn;
      T.n += 1; T.tons += num(it.tons); T.amt += num(it.fAmt);
      if (late) { T.late += 1; }
      if (ty === 'bag') { T.bag += 1; T.bags += num(t.bags) || BAGS_TRUCK; } else { T.powder += 1; }
      if (x.days > T.max) { T.max = x.days; }
      rows.push([i + 1, x.load, x.days, late ? 'ค้างเกินกำหนด' : 'ยังอยู่ในกำหนด',
        (t.lao && t.lao.plate) || '', typeTH(ty),
        num(it.tons), ty === 'bag' ? (num(t.bags) || BAGS_TRUCK) : '',
        num(it.fRate), num(it.fAmt),
        t.wb || '', st.inv, st.fd, st.decl,
        (t.lao && t.lao.company) || '', (t.lao && t.lao.driver) || '', (t.lao && t.lao.phone) || '',
        t.dest || '', (t.thai && t.thai.plate) || '']);
      tone.push(late ? 'out' : '');
    });

    var head = ['ลำดับ', 'วันรับปูนจากโรงงาน', 'ค้างมา (วัน)', 'สถานะ', 'ทะเบียนรถลาว', 'ชนิดปูน',
      'น้ำหนักฝั่งลาว (ตัน)', 'จำนวนถุง', 'ค่าปูน ฿/ตัน', 'ตัดเงินโรงงานไปแล้ว',
      'ใบเก็บเงินโรงงาน', 'ชุดนำเข้า (Invoice)', 'Form D', 'ใบขนสินค้า',
      'ขนส่งฝั่งลาว', 'คนขับลาว', 'เบอร์คนขับลาว', 'ปลายทางที่จะส่ง', 'ทะเบียนรถไทยที่จับคู่ไว้'];
    var fmt = ['n0', 'd', 'n0', '', '', '', 'n2', 'n0', 'n2', 'n2', '', '', '', '', '', '', '', '', ''];
    var w = [6, 19, 13, 17, 16, 9, 19, 11, 13, 19, 18, 20, 17, 19, 20, 16, 15, 22, 22];
    var tot = ['รวม', '', '', T.n + ' คัน', '', '', T.tons, T.bags || '', '', T.amt,
      '', '', '', '', '', '', '', '', ''];

    var sumRows = [
      [1, 'รถที่ยังไม่ผ่านด่าน', T.n, 'คัน'],
      [2, 'ในนั้นค้างเกิน ' + warn + ' วัน', T.late, 'คัน'],
      [3, 'ค้างนานที่สุด', T.max, 'วัน'],
      [4, 'ปูนผง', T.powder, 'คัน'],
      [5, 'ปูนถุง', T.bag, 'คัน'],
      [6, 'น้ำหนักฝั่งลาวรวม', T.tons, 'ตัน'],
      [7, 'จำนวนถุงรวม (เฉพาะปูนถุง)', T.bags, 'ถุง'],
      [8, 'ตัดเงินโรงงานไปแล้วทั้งหมด', T.amt, 'บาท']
    ];

    function L(title, extra) {
      return ['BLUE STONE TRADING CO., LTD.',
        (S.names && S.names.company) || 'บริษัท บลูสโตนเทรดดิ้ง จำกัด',
        title,
        'ช่วงข้อมูล ' + exLabel(r) + (extra ? ' · ' + extra : ''),
        'ออกเมื่อ ' + now + ' · โดย ' + who + (role ? ' (' + role + ')' : '')];
    }
    return {
      fname: 'รถที่ยังไม่ผ่านด่าน-' + r.tag,
      sheets: [
        { frz: 2, name: 'สรุป', lines: L('สรุปรถที่ยังไม่ผ่านด่าน',
            T.n + ' คัน · ค้างเกินกำหนด ' + T.late + ' คัน'), land: false,
          blocks: [{ head: ['ลำดับ', 'หัวข้อ', 'ค่า', 'หน่วย'],
                     fmt: function (i) {
                       var u = (sumRows[i] || [])[3];
                       return ['n0', '', (u === 'คัน' || u === 'วัน' || u === 'ถุง') ? 'n0' : 'n2', ''];
                     },
                     w: [7, 38, 16, 11], rows: sumRows }] },
        { frz: 3, name: 'รถค้างด่าน', lines: L('รถที่เบิกปูนแล้วแต่ยังไม่ผ่านด่าน',
            'เรียงจากค้างนานที่สุด · ถือว่าค้างเมื่อเกิน ' + warn + ' วัน'), land: true,
          blocks: [{ head: head, fmt: fmt, w: w, rows: rows, tone: tone, toneAt: [1, 2, 3],
                     total: rows.length ? tot : null }] }
      ]
    };
  }

  function stkDonut(pct, mid, cap, cRest, cMain) {
    var R = 52, C = 2 * Math.PI * R;
    var p = Math.max(0, Math.min(1, pct || 0));
    var dash = C * p;
    return '<svg viewBox="0 0 140 140" style="width:100%;height:auto;display:block" role="img" ' +
      'aria-label="' + esc(cap) + ' ' + Math.round(p * 100) + ' เปอร์เซ็นต์">' +
      '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + cRest + '" stroke-width="18"></circle>' +
      '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + cMain + '" stroke-width="18" ' +
      'stroke-dasharray="' + dash.toFixed(1) + ' ' + (C - dash).toFixed(1) + '" ' +
      'stroke-dashoffset="' + (C * 0.25).toFixed(1) + '" stroke-linecap="butt"></circle>' +
      '<text x="70" y="66" text-anchor="middle" style="font-family:var(--num);font-size:21px;' +
      'font-weight:700;fill:var(--head)">' + esc(mid) + '</text>' +
      '<text x="70" y="86" text-anchor="middle" style="font-size:10px;fill:var(--muted)">' + esc(cap) + '</text>' +

  function stkBig(title, donut, big, bigTone, unit, lead, items, table, warn, img) {
    return '<section class="card" style="position:relative;overflow:hidden' +
      (warn ? ';border-color:var(--warn-bd)' : '') + '">' +
      (img
        ? '<span aria-hidden="true" style="position:absolute;top:0;right:0;height:268px;width:38%;' +
          'background-image:url(' + img + ');background-size:cover;background-position:center;' +
          '-webkit-mask-image:linear-gradient(90deg,transparent,#000 78%),linear-gradient(180deg,#000 55%,transparent);' +
          'mask-image:linear-gradient(90deg,transparent,#000 78%),linear-gradient(180deg,#000 55%,transparent);' +
          '-webkit-mask-composite:source-in;mask-composite:intersect;' +
          'opacity:.34;pointer-events:none"></span>'
        : '') +
      '<div class="card-b kpi" style="position:relative">' +
        '<p class="t">' + esc(title) + '</p>' +
        '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0 2px">' +
          '<div style="flex:0 0 132px;max-width:132px;min-width:110px">' + donut + '</div>' +
          '<div style="flex:1 1 180px;min-width:0">' +
            '<p class="v" style="color:' + bigTone + '">' + big + '</p>' +
            '<p class="u" style="margin-bottom:8px">' + esc(unit) + '</p>' +
            '<p style="margin:0;font-size:12.5px;color:var(--muted);line-height:1.8">' + lead + '</p>' +
          '</div>' +
        '</div>' +
        '<dl class="dl" style="margin-top:12px;padding-right:' + (img ? '92px' : '0') + '">' +
        items.map(function (it) {
          var tone = it[2] === 'in' ? 'var(--ok)' : (it[2] === 'out' ? 'var(--bad)' : 'var(--head)');
          return '<div><dt style="font-size:12.5px">' +
            '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;' +
            'background:' + tone + '"></span>' + esc(it[0]) + '</dt>' +
            '<dd class="num" style="font-size:18px;font-weight:700;color:' + tone + '">' + it[1] + '</dd></div>';
        }).join('') +
        '</dl>' + (table || '') +
      '</div></section>';
  }


  /* ================= เอกสารแนบของรอบนำเข้า =================
     ไฟล์เก็บสองที่ ตัวไฟล์อยู่ใน IndexedDB ของเครื่องนี้ เปิดได้ทันทีแม้ไม่มีเน็ต
     และอัปขึ้นถัง round-docs ของ Supabase ให้เครื่องอื่นเปิดได้ด้วย
     รายชื่อเอกสารเก็บในตัวรอบเอง จึงซิงก์ไปพร้อมข้อมูลรอบ */
  var DOC_KINDS = ['Invoice', 'Form D', 'ใบอนุญาต สมอ.', 'ใบขนสินค้า', 'Car Manifest',
                   'ใบชั่งน้ำหนัก', 'ใบเสร็จ/สลิปโอนเงิน', 'เอกสารอื่น'];
  var DOC_NEED = ['Invoice', 'Form D', 'ใบอนุญาต สมอ.', 'ใบขนสินค้า'];
  var DOC_BUCKET = 'round-docs';
  var dbP = null;

  function docDB() {
    if (dbP) { return dbP; }
    dbP = new Promise(function (ok, no) {
      if (!window.indexedDB) { no(new Error('เครื่องนี้ไม่รองรับ IndexedDB')); return; }
      var rq = indexedDB.open('bluestone-docs', 1);
      rq.onupgradeneeded = function () {
        if (!rq.result.objectStoreNames.contains('f')) { rq.result.createObjectStore('f'); }
      };
      rq.onsuccess = function () { ok(rq.result); };
      rq.onerror = function () { no(rq.error); };
    });
    return dbP;
  }
  function docPut(id, blob) {
    return docDB().then(function (db) {
      return new Promise(function (ok, no) {
        var tx = db.transaction('f', 'readwrite');
        tx.objectStore('f').put(blob, id);
        tx.oncomplete = function () { ok(true); };
        tx.onerror = function () { no(tx.error); };
      });
    });
  }
  function docGet(id) {
    return docDB().then(function (db) {
      return new Promise(function (ok) {
        var rq = db.transaction('f', 'readonly').objectStore('f').get(id);
        rq.onsuccess = function () { ok(rq.result || null); };
        rq.onerror = function () { ok(null); };
      });
    }).catch(function () { return null; });
  }
  function docDel(id) {
    return docDB().then(function (db) {
      return new Promise(function (ok) {
        var tx = db.transaction('f', 'readwrite');
        tx.objectStore('f').delete(id);
        tx.oncomplete = function () { ok(true); };
        tx.onerror = function () { ok(false); };
      });
    }).catch(function () { return false; });
  }

  function docUp(d, blob) {
    var cl = SB.client || sbConnect();
    if (!cl) { return; }
    var path = (RF.id || 'new') + '/' + d.id + '_' + d.name.replace(/[^\w.\-]/g, '_');
    cl.storage.from(DOC_BUCKET).upload(path, blob, { contentType: d.type || 'application/octet-stream', upsert: true })
      .then(function (res) {
        if (res && res.error) { return; }
        d.up = path;
        save();

  function bindDocs(redraw) {
    redraw = redraw || viewStock;
    if (el('rfFile')) {
      el('rfFile').addEventListener('change', function () {
        var fs = Array.prototype.slice.call(el('rfFile').files || []);
        if (!fs.length) { return; }
        var left = fs.length;
        fs.forEach(function (file) {
          var d = { id: 'd' + Date.now() + Math.random().toString(36).slice(2, 7),
                    name: file.name, kind: docGuess(file.name), size: file.size,
                    type: file.type || '', at: sbNow() };
          RF.docs = RF.docs || [];
          RF.docs.push(d);
          docPut(d.id, file).then(function () {
            docUp(d, file);
            left -= 1;
            if (left <= 0) { rdSnap(); redraw(); toast('แนบเอกสารแล้ว ' + fs.length + ' ไฟล์'); }
          }).catch(function () {
            left -= 1;
            if (left <= 0) { redraw(); toast('แนบไฟล์ไม่สำเร็จ'); }
          });
        });
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-dk]'), function (s) {
      s.addEventListener('change', function () {
        var d = (RF.docs || []).filter(function (x) { return x.id === s.getAttribute('data-dk'); })[0];
        if (d) { d.kind = s.value; rdSnap(); redraw(); }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-dopen]'), function (b) {
      b.addEventListener('click', function () { docOpen(b.getAttribute('data-dopen')); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ddel]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-ddel');
        if (b.dataset.armed !== '1') {
          b.dataset.armed = '1'; b.classList.add('pri'); b.textContent = 'กดอีกครั้ง';
          toast('กดอีกครั้งเพื่อลบเอกสารนี้'); return;
        }
        RF.docs = (RF.docs || []).filter(function (x) { return x.id !== id; });
        docDel(id);
        rdSnap(); redraw(); toast('ลบเอกสารแล้ว');
      });
    });
  }

  /* เดาชนิดเอกสารจากชื่อไฟล์ ผู้ใช้แก้ทีหลังได้ */
  function docGuess(name) {
    var n = String(name || '').toLowerCase();
    if (n.indexOf('tisi') >= 0 || n.indexOf('สมอ') >= 0) { return 'ใบอนุญาต สมอ.'; }
    if (n.indexOf('manifest') >= 0) { return 'Car Manifest'; }
    if (n.indexOf('formd') >= 0 || n.indexOf('form-d') >= 0 || n.indexOf('form_d') >= 0 || n.indexOf('e-co') >= 0) { return 'Form D'; }
    if (n.indexOf('ใบขน') >= 0 || n.indexOf('decl') >= 0) { return 'ใบขนสินค้า'; }
    if (n.indexOf('ใบชั่ง') >= 0 || n.indexOf('weight') >= 0) { return 'ใบชั่งน้ำหนัก'; }
    if (n.indexOf('slip') >= 0 || n.indexOf('สลิป') >= 0 || n.indexOf('ktb') >= 0) { return 'ใบเสร็จ/สลิปโอนเงิน'; }
    if (n.indexOf('invoice') >= 0 || n.indexOf('fcr') >= 0) { return 'Invoice'; }
    return 'เอกสารอื่น';
  }

    }).join('');

            : 'ไม่มีรถค้างเกิน ' + warnDays + ' วัน'),
      [['เบิกจากโรงงานแล้ว', m0(nLoad) + ' คัน', ''],
       ['ผ่านด่านไทยแล้ว', m0(nCross) + ' คัน', 'in'],

    /* ---------- วงที่ 2 ปูนถุงที่รับเข้าโกดัง ขายออกไปแล้วกี่ส่วน ---------- */
    var pct2 = c.whIn > 0 ? c.bags / c.whIn : 0;

    var card2 = stkBig(
      'ปูนถุงใน' + whOf('bag'),

       ['ขายออกสะสม', m0(c.whOut) + ' ถุง', 'out'],
       ['คงเหลือ', m0(c.bags) + ' ถุง', ''],
       ['ยอดขายสะสม', m2(c.whAmt) + ' ฿', '']],
      '<div class="tbox" style="margin-top:10px"><table><thead><tr><th>ขายล่าสุด</th><th>ลูกค้า</th>' +
      '<th class="n">ถุง</th><th class="n">เป็นเงิน</th></tr></thead><tbody>' + outRows + '</tbody></table></div>' +
      '<p class="note" style="margin-top:7px">ราคาที่บันทึกเป็นราคารวมภาษีแล้ว ตัดสตอกตอนรถมารับจริง</p>',
      c.bags < 0, IMG_BAG);

    var cards = card1 + card2;

    var transitRows = c.transit.length
      ? c.transit.map(function (t) {
          var d = daysSince(t.load);
          return '<tr><td class="muted" style="white-space:nowrap">' + esc(dtTH(t.load)) + '</td>' +
            '<td class="str">' + esc(t.lao || '—') + '</td>' +
            '<td>' + (t.type === 'bag' ? 'ปูนถุง' : 'ปูนผง') + '</td>' +
            '<td class="n">' + m2(t.tonsL) + '</td>' +
            '<td class="muted">' + esc(t.wb || '—') + '</td>' +
            '<td class="muted">' + esc(rdName(t.round) || '—') + '</td>' +
            '<td class="c"><button type="button" class="btn sm" data-ied="' + esc(t.eid) + '">แก้</button></td>' +
            '<td class="c">' + (d >= warnDays
              ? '<span class="badge b-d">ค้าง ' + d + ' วัน</span>'
              : '<span class="badge b-w">' + d + ' วัน</span>') + '</td></tr>';
        }).join('')
      : '<tr><td colspan="8" class="muted" style="padding:20px;text-align:center">ไม่มีรถค้างด่าน รถที่เบิกปูนแล้วผ่านด่านครบทุกคัน</td></tr>';

    var whRows = c.moves.length
      ? c.moves.slice().reverse().map(function (m) {
          var isOut = m.dir === 'out';
          return '<tr><td class="muted" style="white-space:nowrap">' + esc(dtTH(m.at)) + '</td>' +
            '<td>' + (isOut ? '<span class="badge b-w">จ่ายออก</span>' : '<span class="badge b-s">รับเข้า</span>') + '</td>' +
            '<td class="str">' + esc(m.who || '—') + (m.plate ? ' <span class="muted">· ' + esc(m.plate) + '</span>' : '') + '</td>' +
            '<td class="n">' + (isOut ? '-' : '+') + m0(m.bags) + '</td>' +
            '<td class="n">' + (isOut ? '-' : '+') + m2(m.tons) + '</td>' +
            '<td class="n">' + (isOut && m.price ? m2(m.price) : '—') + '</td>' +
            '<td class="n">' + (isOut && m.amount ? m2(m.amount) : '—') + '</td>' +
            '<td class="n"><b>' + m0(m.bal) + '</b></td>' +
            '<td class="c">' + (m.entry ? dotsBtn('wh:' + m.entry.id) : '') + '</td></tr>';
        }).join('')
      : '<tr><td colspan="9" class="muted" style="padding:20px;text-align:center">ยังไม่มีความเคลื่อนไหวในโกดัง</td></tr>';


    return {
      cards: cards,
      transit: section(3, 'รถที่ยังไม่ผ่านด่าน', 'เบิกปูนจากโรงงานลาวแล้ว ตัดเครดิตไปแล้ว แต่ยังไม่มีวันเวลาเข้า STOCK',
        exPanel('transit') +
        '<div class="tbox"><table><thead><tr><th>วันรับปูน</th><th>ทะเบียนลาว</th><th>ชนิด</th>' +
        '<th class="c">น้ำหนัก (ตัน)</th><th>เลขที่ใบขน</th><th>รอบนำเข้า</th>' +
        '<th class="c">จัดการ</th><th class="c">ค้างมา</th>' +
        '</tr></thead><tbody>' + transitRows + '</tbody></table></div>' +
        '<p class="hint" style="margin-top:9px">เติมช่อง “วันเวลาเข้า STOCK” ในหน้าคุมนำเข้าและ STOCK แล้วรถจะหายจากตารางนี้เอง · ' +
        'ตั้งจำนวนวันที่ถือว่าค้างได้ที่หน้าตั้งค่าอัตรา (ตอนนี้ ' + warnDays + ' วัน)</p>', exBtn('transit')),
      pw: pwSection(pwCalc(), 1),
      wh: section(2, 'โกดังปูนถุง' + whTail('bag') + ' · ตัดสตอก',
        'รับเข้าอัตโนมัติจากรถปูนถุงที่ผ่านด่านเข้า' + whOf('bag') + ' · จ่ายออกบันทึกเองตอนรถลูกค้ามารับ',
        exPanel('bag') +
        '<div class="actions" style="margin-bottom:10px">' +
        '<button type="button" class="btn" id="whAdd" style="' + SX_PINK + '">' + SX_IC_BAG +
        (WF.open ? 'ปิดฟอร์ม' : 'บันทึกขายปูนถุง') + '</button>' +
        '<span class="badge ' + (c.bags < 0 ? 'b-d' : 'b-i') + '" style="align-self:center">คงเหลือ ' +
        m0(c.bags) + ' ถุง · ' + m2(c.tons) + ' ตัน</span></div>' +
        (WF.open ? whForm() : '') +
        '<div class="tbox" style="margin-top:10px"><table><thead><tr><th>วันที่</th><th>รายการ</th><th>ลูกค้า/ที่มา</th>' +
        '<th class="c">ถุง</th><th class="c">ตัน</th><th class="c">ราคา/ถุง</th><th class="c">เป็นเงิน</th>' +
        '<th class="c">คงเหลือ (ถุง)</th><th class="c"></th></tr></thead><tbody>' + whRows + '</tbody></table></div>' +
        (c.bags < 0 ? '<p class="hint w" style="margin-top:9px">ยอดคงเหลือติดลบ แปลว่าบันทึกขายมากกว่าที่รับเข้า ' +
          'ตรวจว่าลืมกรอกวันเวลาผ่านด่านของรถปูนถุงหรือเปล่า</p>' : ''), exBtn('bag')),
      month: stkMonthSection()
    };
  }

  function viewStock() { location.hash = '#entry'; viewEntry(); }

  function bindStock() {
    exBind('transit', viewEntry);
    Array.prototype.forEach.call(document.querySelectorAll('[data-ied]'), function (b) {
      b.addEventListener('click', function () {
        if (sxOpenKey('e:' + b.getAttribute('data-ied'))) {
          viewEntry();
          var ed = el('sxEd');
          if (ed && ed.scrollIntoView) { ed.scrollIntoView({ block: 'start' }); }
        }
      });
    });
    if (el('myYear')) {
      el('myYear').addEventListener('change', function () { MY.year = el('myYear').value; viewEntry(); });
    }
    if (el('myCsv')) { el('myCsv').addEventListener('click', stkMonthCsv); }
  }

  function bindSell(redraw) {
    bindPw(redraw);
    exBind('bag', redraw || viewEntry);
    if (el('whAdd')) {
      el('whAdd').addEventListener('click', function () { WF.open = !WF.open; WF.editId = null; redraw(); });
    }
    if (el('wfCancel')) {
      el('wfCancel').addEventListener('click', function () { WF.open = false; WF.editId = null; redraw(); });
    }
    if (el('wfCid')) {
      el('wfCid').addEventListener('change', function () {
        var pr = crPrice(el('wfCid').value, 'bag');
        if (el('wfCid').value && pr > 0 && !num(el('wfPB').value)) {
          el('wfPB').value = m2(pr / BAGS_TON);
          el('wfPT').value = m2(pr);
        }
      });
    }

    /* ราคาต่อถุงกับต่อตัน กรอกช่องไหนก็ได้ อีกช่องคำนวณให้ */
    if (el('wfPB') && el('wfPT')) {
      el('wfPB').addEventListener('input', function () {
        var v = num(el('wfPB').value);
        el('wfPT').value = v ? m2(v * BAGS_TON) : '';
      });
      el('wfPT').addEventListener('input', function () {
        var v = num(el('wfPT').value);
        el('wfPB').value = v ? m2(v / BAGS_TON) : '';
      });
    }
    if (el('wfSave')) {
      el('wfSave').addEventListener('click', function () {
        var bags = Math.round(num(el('wfBags').value));
        if (bags <= 0) { toast('กรอกจำนวนถุงก่อน'); return; }
        var edw = WF.editId ? sxFind(WF.editId, 'whOut') : null;
        var have = stkCalc().bags + (edw ? num((edw.trucks || {}).bags) : 0);
        if (bags > have) {
          toast('ในโกดังเหลือ ' + m0(have) + ' ถุง บันทึกขาย ' + m0(bags) + ' ถุงไม่ได้');
          return;
        }
        var wdate = dOnly(el('wfDate').value) || todayISO();
        if (isLocked(wdate) || (edw && isLocked(edw.date))) { toast('วันที่นี้อยู่ในงวดที่ปิดแล้ว บันทึกไม่ได้'); return; }
        var wrec = edw || { id: newId(), kind: 'whOut' };
        wrec.date = wdate; wrec.cementType = 'bag'; wrec.who = el('wfWho').value.trim();
        wrec.price = num(el('wfPB').value); wrec.tons = bags / BAGS_TON;
        wrec.trucks = { bags: bags, plate: el('wfPlate').value.trim(),
                        cid: el('wfCid') ? el('wfCid').value : '' };
        if (!edw) { S.entries.push(wrec); }
        WF.open = false; WF.editId = null;
        save();
        logIt('จ่ายปูนถุงออกจากโกดัง', m0(bags) + ' ถุง · ' + (el('wfWho').value.trim() || 'ไม่ระบุลูกค้า'));
        redraw();
        toast('บันทึกแล้ว · คงเหลือ ' + m0(stkCalc().bags) + ' ถุง');
      });
    }
  }

  /* ================= เราเตอร์ ================= */
  var VIEWS = { ledger: viewLedger, entry: viewEntry, shipping: viewShipping,
                stock: viewStock, rates: viewRates, export: viewExport };

  var curView = '';

  function render() {
    var name = (location.hash || '#ledger').replace('#', '');
    if (name === 'stock') { name = 'entry'; }
    if (!VIEWS[name]) { name = 'ledger'; }
    /* ออกจากหน้าตั้งค่าอัตราทั้งที่ยังแก้ค้าง ให้ถามก่อน */
    if (curView === 'rates' && name !== 'rates' && rDirty() && !el('rAsk')) {
      RD.nav = name;
      location.hash = '#rates';
      rAsk(true);
      return;
    }
    curView = name;
    Object.keys(VIEWS).forEach(function (k) { el('v-' + k).hidden = (k !== name); });
    Array.prototype.forEach.call(el('nav').querySelectorAll('a'), function (a) {
      if (a.getAttribute('href') === '#' + name) { a.setAttribute('aria-current', 'page'); } else { a.removeAttribute('aria-current'); }
    });
    VIEWS[name]();
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);

  /* ปิดแท็บหรือรีเฟรชทั้งที่ยังแก้ค้าง ให้เบราว์เซอร์ถามก่อน */
  window.addEventListener('beforeunload', function (ev) {
    if (!rDirty()) { return; }
    ev.preventDefault();
    ev.returnValue = '';
    return '';
  });

  /* ดักทุกการพิมพ์ในหน้า แล้วเก็บร่างให้เองแบบหน่วงเวลา จะได้ไม่เขียนทุกตัวอักษร */
  document.addEventListener('input', dfTouch, true);
  document.addEventListener('change', dfTouch, true);

  dfRestore();
  renderWho();
  render();

  if (SB.url && SB.key) {
    sbConnect();
    if (SB.client) {
      SB.client.auth.getSession().then(function (r) {
        var has = r && r.data && r.data.session;
        if (!has) { location.replace('login.html'); return; }
        SB.email = r.data.session.user ? r.data.session.user.email : '';
        renderWho();
        sbPull(function (err) { sbBadge(); if (!err) { render(); } });
      }, function () {
        sbPull(function (err) { sbBadge(); if (!err) { render(); } });
      });
    }
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () { /* ข้ามไป */ });
    });
  }
})();

</script>

</body>
</html>
