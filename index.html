  /* ---- ล็อกหัวข้อ 7 ด้วยรหัส ----
     เก็บเฉพาะค่าแฮชทางเดียว (SHA-256 + salt) ไว้ใน S.rates.lkH / lkS
     ซึ่งซิงก์ขึ้นฐานข้อมูลพร้อมกับอัตราอื่น ทุกเครื่องจึงล็อกตามกันเอง
     นี่เป็นการกันการแก้โดยไม่ตั้งใจ ไม่ใช่ระบบความปลอดภัยเต็มรูปแบบ */
  var SBU = { open: false, armed: false };

  function sbLockOn() { return !!(S.rates && S.rates.lkH); }

  function sbSalt() {
    var a = 'abcdefghijklmnopqrstuvwxyz0123456789', s = '', i;
    for (i = 0; i < 12; i += 1) { s += a.charAt(Math.floor(Math.random() * a.length)); }
    return s;
  }

  function sbHashWeak(txt) {
    var h1 = 2166136261, h2 = 16777619, i, c;
    for (i = 0; i < txt.length; i += 1) {
      c = txt.charCodeAt(i);
      h1 = ((h1 ^ c) * 16777619) >>> 0;
      h2 = ((h2 + c * (i + 7)) * 2654435761) >>> 0;
    }
    return 'w1:' + ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8);
  }

  function sbHash(pw, salt) {
    var txt = 'bluestone|' + salt + '|' + pw;
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      try {
        return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt))
          .then(function (buf) {
            var a = Array.prototype.slice.call(new Uint8Array(buf));
            return 's2:' + a.map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
          }, function () { return sbHashWeak(txt); });
      } catch (err) { /* เบราว์เซอร์ไม่รองรับ ใช้วิธีสำรอง */ }
    }
    return Promise.resolve(sbHashWeak(txt));
  }

  function sbLockBar() {
    var on = sbLockOn();
    return '<hr style="border:0;border-top:1px solid var(--line-soft);margin:14px 0">' +
      '<div class="grid g2">' +
        '<div><label class="fl" for="sbNewPw">' + (on ? 'เปลี่ยนรหัสล็อกหัวข้อนี้' : 'ตั้งรหัสล็อกหัวข้อนี้') + '</label>' +
        '<input id="sbNewPw" type="password" autocomplete="new-password" placeholder="รหัสใหม่ อย่างน้อย 4 ตัว"></div>' +
        '<div><label class="fl" for="sbNewPw2">พิมพ์รหัสใหม่อีกครั้ง</label>' +
        '<input id="sbNewPw2" type="password" autocomplete="new-password" placeholder="ให้ตรงกับช่องซ้าย"></div>' +
      '</div>' +
      '<div class="actions" style="margin-top:12px">' +
        '<button type="button" class="btn pri" id="sbLockSet">' + (on ? 'เปลี่ยนรหัส' : 'ตั้งรหัสและล็อก') + '</button>' +
        (on ? '<button type="button" class="btn" id="sbLockNow">ล็อกทันที</button>' +
              '<button type="button" class="btn" id="sbLockOff">ยกเลิกการล็อก</button>' : '') +
      '</div>' +
      '<p class="hint" style="margin-top:8px">' + (on
        ? 'หัวข้อนี้ล็อกอยู่ · เก็บเฉพาะค่าแฮชของรหัส ไม่ได้เก็บตัวรหัสจริง และซิงก์ให้ทุกเครื่องเมื่อส่งข้อมูลขึ้น'
        : 'ตั้งรหัสแล้วเครื่องที่ดึงข้อมูลลงจะล็อกหัวข้อนี้ตามด้วย · พนักงานทั่วไปจะไม่เห็นค่าเชื่อมต่อและไม่มีปุ่มบันทึกทับ') + '</p>' +
      '<p class="hint" style="margin-top:4px">การล็อกนี้กันการกดแก้โดยไม่ตั้งใจและกันคนในที่ไม่เกี่ยวข้อง ไม่ใช่ระบบความปลอดภัยเต็มรูปแบบ · ' +
      'คนที่เปิดเครื่องมือพัฒนาของเบราว์เซอร์ยังอ่านค่าที่เก็บในเครื่องได้ · ' +
      'ด่านกันคนนอกจริง ๆ คือการเข้าสู่ระบบและ Row Level Security บนฐานข้อมูล</p>';
  }

  function bindSBLock() {
    if (el('sbUnlock')) {
      var go = function () {
        var pw = el('sbPw').value;
        if (!pw) { toast('กรอกรหัสก่อน'); return; }
        sbHash(pw, S.rates.lkS || '').then(function (h) {
          if (h === S.rates.lkH) {
            SBU.open = true; viewRates(); toast('ปลดล็อกหัวข้อฐานข้อมูลแล้ว');
          } else {
            el('sbPw').value = ''; el('sbPw').focus(); toast('รหัสไม่ถูกต้อง');
          }
        });
      };
      el('sbUnlock').addEventListener('click', go);
      el('sbPw').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); go(); }
      });
    }
    if (el('sbLockSet')) {
      el('sbLockSet').addEventListener('click', function () {
        var p1 = el('sbNewPw').value, p2 = el('sbNewPw2').value;
        if (p1.length < 4) { toast('รหัสสั้นเกินไป ใส่อย่างน้อย 4 ตัว'); return; }
        if (p1 !== p2) { toast('รหัสสองช่องไม่ตรงกัน'); return; }
        var salt = sbSalt(), first = !sbLockOn();
        sbHash(p1, salt).then(function (h) {
          S.rates.lkS = salt; S.rates.lkH = h;
          SBU.open = true; SBU.armed = false;
          save(); logIt(first ? 'ตั้งรหัสล็อกหัวข้อฐานข้อมูล' : 'เปลี่ยนรหัสล็อกหัวข้อฐานข้อมูล', 'หัวข้อ 7 ฐานข้อมูลกลาง');
          viewRates();
          toast(first ? 'ตั้งรหัสแล้ว · เปิดหน้านี้ใหม่จะต้องใส่รหัสก่อน' : 'เปลี่ยนรหัสแล้ว');
        });
      });
    }
    if (el('sbLockNow')) {
      el('sbLockNow').addEventListener('click', function () {
        SBU.open = false; SBU.armed = false; viewRates(); toast('ล็อกหัวข้อฐานข้อมูลแล้ว');
      });
    }
    if (el('sbLockOff')) {
      el('sbLockOff').addEventListener('click', function () {
        var b = el('sbLockOff');
        if (!SBU.armed) {
          SBU.armed = true;
          b.textContent = 'กดอีกครั้งเพื่อยืนยันการยกเลิก';
          b.classList.add('pri');
          toast('ยกเลิกแล้วทุกคนที่เปิดหน้านี้จะแก้ค่าเชื่อมต่อได้ · กดอีกครั้งถ้าแน่ใจ');
          return;
        }
        delete S.rates.lkH; delete S.rates.lkS;
        SBU.open = true; SBU.armed = false;
        save(); logIt('ยกเลิกรหัสล็อกหัวข้อฐานข้อมูล', 'หัวข้อ 7 ฐานข้อมูลกลาง');
        viewRates(); toast('ยกเลิกการล็อกแล้ว');
      });
    }
  }

  /* ---- ชั้นที่ 2 ของหน้าตั้งค่าอัตราและขั้นราคา ----
     ชั้นที่ 1 คือการเข้าสู่ระบบด้วยอีเมลหรือบัญชี Google
     ชั้นที่ 2 คือ PIN 6 หลักที่ผู้บริหารถือไว้ ใส่ก่อนจึงจะเห็นและแก้หน้านี้ได้
     เก็บเฉพาะค่าแฮช SHA-256 + salt ไว้ใน S.rates.pnH กับ pnS เหมือนรหัสล็อกหัวข้อ 7
     จึงซิงก์ขึ้นฐานข้อมูลและล็อกตามกันทุกเครื่อง
     ข้อจำกัดที่ต้องรู้ไว้ นี่กันคนในที่ไม่มีหน้าที่ ไม่ได้กันคนที่เปิดเครื่องมือพัฒนาของเบราว์เซอร์
     ด่านที่กันคนนอกได้จริงคือการเข้าสู่ระบบกับ Row Level Security บนฐานข้อมูล */
  var RLK = { open: false, pin: '', fail: 0, until: 0 };

  function rlOn() { return !!(S.rates && S.rates.pnH); }

  function rlWait() {
    return RLK.until > Date.now() ? Math.ceil((RLK.until - Date.now()) / 60000) : 0;
  }

  function rlDots() {
    var i, d = '';
    for (i = 0; i < 6; i += 1) {
      d += '<span class="rl-dot' + (i < RLK.pin.length ? ' on' : '') + '"></span>';
    }
    return '<div id="rlDots" class="rl-dots">' + d + '</div>';
  }

  function rlNote() {
    var w = rlWait();
    if (w) { return 'ใส่ผิดครบ 5 ครั้ง ต้องรออีก ' + w + ' นาที'; }
    if (RLK.fail) { return 'PIN ไม่ถูกต้อง เหลืออีก ' + (5 - RLK.fail) + ' ครั้ง'; }
    return 'PIN 6 หลัก · ใส่ผิดครบ 5 ครั้ง ล็อก 15 นาที';
  }

  function rlScreen() {
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'B'];
    var pad = keys.map(function (k) {
      var lab = k === 'B' ? '&#9003;' : (k === 'C' ? 'ล้าง' : k);
      var big = /[0-9]/.test(k);
      return '<button type="button" class="rl-key' + (big ? '' : ' fn') + '" data-pin="' + k +
        '" aria-label="' + (k === 'B' ? 'ลบหนึ่งตัว' : (k === 'C' ? 'ล้างทั้งหมด' : k)) + '">' +
        lab + '</button>';
    }).join('');

    return '<div class="rl-wrap">' +
      '<div id="rlPad" class="rl-card">' +
        '<div class="rl-ico">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" aria-hidden="true">' +
          '<rect x="4" y="10.5" width="16" height="10" rx="2.5"></rect>' +
          '<path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"></path></svg></div>' +
        '<h2 class="rl-h">ปลดล็อกชั้นที่ 2</h2>' +
        '<p class="rl-sub">ใส่ PIN ของผู้บริหาร เพื่อเปิดสิทธิ์ดูและแก้อัตราและขั้นราคา</p>' +
        rlDots() +
        '<p id="rlMsg" class="rl-note">' + esc(rlNote()) + '</p>' +
        '<div class="rl-pad">' + pad + '</div>' +
        '<p class="rl-foot"><button type="button" id="rlBack" class="rl-back">กลับหน้าแรก</button></p>' +
        '<p class="rl-help">ลืม PIN ให้เปิด Supabase ไปที่ตาราง app_settings แถว default ' +
        'แล้วลบคีย์ pnH กับ pnS ออกจากช่อง rates จากนั้นกลับมากดดึงข้อมูลลง</p>' +
      '</div></div>';
  }

  function rlPaint() {
    var d = el('rlDots'), m = el('rlMsg');
    if (d) { d.outerHTML = rlDots(); }
    if (m) { m.textContent = rlNote(); }
  }

  function rlTry() {
    var pin = RLK.pin;
    sbHash(pin, S.rates.pnS || '').then(function (h) {
      if (h === S.rates.pnH) {
        RLK.open = true; RLK.pin = ''; RLK.fail = 0;
        logIt('ปลดล็อกชั้นที่ 2 ของหน้าอัตรา', 'ผู้ใช้ ' + ((S.profile && S.profile.name) || ''));
        viewRates();
        toast('ปลดล็อกแล้ว · เปิดไว้จนกว่าจะกดล็อกทันทีหรือปิดหน้าเว็บ');
        return;
      }
      RLK.pin = '';
      RLK.fail += 1;
      if (RLK.fail >= 5) {
        RLK.fail = 0;
        RLK.until = Date.now() + 15 * 60000;
        toast('ใส่ PIN ผิดครบ 5 ครั้ง ล็อก 15 นาที');
      } else {
        toast('PIN ไม่ถูกต้อง เหลืออีก ' + (5 - RLK.fail) + ' ครั้ง');
      }
      rlPaint();
    });
  }

  function rlKey(k) {
    if (rlWait()) { rlPaint(); toast('ยังอยู่ในช่วงล็อก รออีก ' + rlWait() + ' นาที'); return; }
    if (k === 'C') { RLK.pin = ''; rlPaint(); return; }
    if (k === 'B') { RLK.pin = RLK.pin.slice(0, -1); rlPaint(); return; }
    if (RLK.pin.length >= 6) { return; }
    RLK.pin += k;
    rlPaint();
    if (RLK.pin.length === 6) { rlTry(); }
  }

  function rlSection() {
    var on = rlOn();
    return section(9, 'รหัสชั้นที่ 2 ของหน้านี้',
      'PIN 6 หลักของผู้บริหาร ตั้งแล้วหน้าตั้งค่าอัตราและขั้นราคาจะถามก่อนทุกครั้ง',
      '<div class="grid g2">' +
        '<div><label class="fl" for="rlNew">' + (on ? 'เปลี่ยน PIN' : 'ตั้ง PIN') + '</label>' +

        'placeholder="ตัวเลข 6 หลัก"></div>' +
        '<div><label class="fl" for="rlNew2">พิมพ์ PIN อีกครั้ง</label>' +
        '<input id="rlNew2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" ' +
        'placeholder="ให้ตรงกับช่องซ้าย"></div>' +
      '</div>' +
      '<div class="actions" style="margin-top:12px">' +
        '<button type="button" class="btn pri" id="rlSet">' + (on ? 'เปลี่ยน PIN' : 'ตั้ง PIN และเปิดใช้') + '</button>' +
        (on ? '<button type="button" class="btn" id="rlNow">ล็อกทันที</button>' +
              '<button type="button" class="btn" id="rlOff">ยกเลิกการล็อก</button>' : '') +

  function bindRL() {
    if (el('rlPad')) {
      Array.prototype.forEach.call(el('rlPad').querySelectorAll('[data-pin]'), function (b) {
        b.addEventListener('click', function () { rlKey(b.getAttribute('data-pin')); });
      });
      el('rlBack').addEventListener('click', function () { location.hash = '#ledger'; });
      if (!RLK.keyed) {
        RLK.keyed = true;
        document.addEventListener('keydown', function (ev) {
          if (!el('rlPad')) { return; }
          if (/^[0-9]$/.test(ev.key)) { ev.preventDefault(); rlKey(ev.key); return; }
          if (ev.key === 'Backspace') { ev.preventDefault(); rlKey('B'); return; }
          if (ev.key === 'Escape') { ev.preventDefault(); rlKey('C'); }
        });
      }
      return;
    }
    if (el('rlSet')) {
      el('rlSet').addEventListener('click', function () {
        var a = el('rlNew').value.trim(), b = el('rlNew2').value.trim();
        if (!/^[0-9]{6}$/.test(a)) { toast('PIN ต้องเป็นตัวเลข 6 หลัก'); return; }
        if (a !== b) { toast('PIN สองช่องไม่ตรงกัน'); return; }
        var salt = sbSalt(), first = !rlOn();
        sbHash(a, salt).then(function (h) {
          S.rates.pnS = salt; S.rates.pnH = h;
          RLK.open = true; RLK.armed = false; RLK.pin = ''; RLK.fail = 0;
          save();
          logIt(first ? 'ตั้ง PIN ชั้นที่ 2 ของหน้าอัตรา' : 'เปลี่ยน PIN ชั้นที่ 2 ของหน้าอัตรา', 'หน้าตั้งค่าอัตราและขั้นราคา');
          viewRates();
          toast(first ? 'ตั้ง PIN แล้ว · เปิดหน้านี้ครั้งหน้าจะต้องใส่ PIN ก่อน' : 'เปลี่ยน PIN แล้ว');
        });
      });
    }
    if (el('rlNow')) {
      el('rlNow').addEventListener('click', function () {
        RLK.open = false; RLK.pin = ''; viewRates(); toast('ล็อกหน้านี้แล้ว');
      });
    }
    if (el('rlOff')) {
      el('rlOff').addEventListener('click', function () {
        var b = el('rlOff');
        if (!RLK.armed) {
          RLK.armed = true;
          b.textContent = 'กดอีกครั้งเพื่อยืนยันการยกเลิก';
          b.classList.add('pri');
          toast('ยกเลิกแล้วทุกคนที่เข้าระบบได้จะแก้ราคาได้ · กดอีกครั้งถ้าแน่ใจ');
          return;
        }
        delete S.rates.pnH; delete S.rates.pnS;
        RLK.open = true; RLK.armed = false;
        save(); logIt('ยกเลิก PIN ชั้นที่ 2 ของหน้าอัตรา', 'หน้าตั้งค่าอัตราและขั้นราคา');
        viewRates(); toast('ยกเลิกการล็อกแล้ว');
      });
    }
  }

  function mapTruck(t) {
    function side(o) {
      o = o || {};
      return { company: (o.company || '').trim(), plate: (o.plate || '').trim(),
               plate2: (o.plate2 || '').trim(),
               driver: (o.driver || '').trim(), phone: (o.phone || '').trim(), tons: num(o.tons) };
    }
    return { type: t.type || 'powder', brand: (t.brand || '').trim(), nation: t.nation || 'thai',
             scan: t.scan === undefined ? true : !!t.scan, dest: (t.dest || '').trim(),
             destId: t.destId || '', job: t.job || '', tok: t.tok || null,
             tLoad: t.tLoad || '', tSend: t.tSend || '', tDeliver: t.tDeliver || '',
             wb: t.wb || '', mf: t.mf || '', round: t.round || '', wh: !!t.wh,
             sp: num(t.sp) || '', jp: !!t.jp, bags: num(t.bags) || BAGS_TRUCK,

             dw: (t.dw || '').trim(), dp: num(t.dp) || '', dcid: t.dcid || '', sid: t.sid || '', dt: num(t.dt) || '',
             lao: side(t.lao), thai: side(t.thai) };

  /* ดึงรายการปูนเข้าที่บันทึกไปแล้วกลับมาแก้ในฟอร์มเดิม */
  function loadImport(id) {
    var e = S.entries.filter(function (x) { return String(x.id) === String(id) && x.kind === 'import'; })[0];
    if (!e) { toast('ไม่พบรายการนี้'); return false; }
    function side(o) {
      o = o || {};
      return { company: o.company || '', plate: o.plate || '', plate2: o.plate2 || '',
               driver: o.driver || '', phone: o.phone || '', tons: t2(num(o.tons)) };
    }
    form.kind = 'import';
    form.editId = e.id;
    form.date = e.date;
    form.trucks = (e.trucks || []).map(function (t) {
      return { type: t.type || 'powder', brand: t.brand || '', nation: t.nation || 'thai',
               scan: t.scan === undefined ? true : !!t.scan,
               dest: t.dest || '', destId: t.destId || '', job: t.job || '', tok: t.tok || null,
               tLoad: t.tLoad || '', tSend: t.tSend || '', tDeliver: t.tDeliver || '',
               wb: t.wb || '', mf: t.mf || '', round: t.round || '', wh: !!t.wh,
               sp: num(t.sp) || '', jp: !!t.jp, bags: num(t.bags) || BAGS_TRUCK,
               lao: side(t.lao), thai: side(t.thai) };
    });
    if (!form.trucks.length) { toast('รายการนี้ไม่มีคู่รถ'); return false; }
    form.mode = form.trucks[0].type === 'bag' ? 'bag' : 'powder';
    return true;

             decl: sxS(p.decl), declDate: sxS(p.declDate),

             goods: p.goods ? String(p.goods) : '', kg: p.kg ? String(p.kg) : '',

  function sxNewTruck(type) {
    var t = newTruck();
    t.type = type === 'bag' ? 'bag' : 'powder';
    t.tTake = ''; t.dw = ''; t.dp = ''; t.dcid = ''; t.sid = ''; t.fi = ''; t.dt = '';
    if (t.type === 'bag') {
      t.nation = 'lao'; t.wh = true; t.bags = BAGS_TRUCK;
      t.lao.tons = t2(BAGS_TRUCK / BAGS_TON); t.thai.tons = t.lao.tons;

  function sxTFrom(t) {
    function side(o) {
      o = o || {};
      return { company: o.company || '', plate: o.plate || '', plate2: o.plate2 || '',
               driver: o.driver || '', phone: o.phone || '', tons: t2(num(o.tons)) };
    }
    var out = { type: t.type === 'bag' ? 'bag' : 'powder', brand: t.brand || '', nation: t.nation || 'thai',
                scan: t.scan === undefined ? true : !!t.scan,
                dest: t.dest || '', destId: t.destId || '', job: t.job || '', tok: t.tok || null,
                tLoad: t.tLoad || '', tTake: t.tTake || '', tSend: t.tSend || '', tDeliver: t.tDeliver || '',
                wb: t.wb || '', mf: t.mf || '', fi: t.fi || '', round: t.round || '', wh: !!t.wh,
                sp: num(t.sp) || '', jp: !!t.jp,
                /* รถปูนถุงรุ่นเก่าไม่ได้เก็บจำนวนถุง คิดย้อนจากน้ำหนักที่บันทึกไว้ ยอดเดิมจะได้ไม่ขยับ */

                  ? Math.round(num(t.lao.tons) * BAGS_TON) : BAGS_TRUCK),
                dw: t.dw || '', dp: t.dp ? String(t.dp) : '', dcid: t.dcid || '', sid: t.sid || '', dt: t.dt || '',
                lao: side(t.lao), thai: side(t.thai) };
    /* รายการขายที่เคยสร้างให้อัตโนมัติ ถ้าถูกลบไปจากตารางขายแล้ว ก็ล้างช่องขายปลายทางตาม */
    if (out.sid && !sxFind(out.sid, 'pwOut')) { out.sid = ''; out.dw = ''; out.dp = ''; out.dcid = ''; }

  function sxFind(id, kind) {
    var hit = null;

      if (!hit && String(e.id) === String(id) && (!kind || e.kind === kind)) { hit = e; }
    });
    return hit;
  }
  function sxEntryOf(rid) {
    var hit = null;
    S.entries.forEach(function (e) {
      if (hit || e.kind !== 'import' || !e.trucks) { return; }
      if (e.trucks.some(function (t) { return String(t.round) === String(rid); })) { hit = e; }
    });
    return hit;

    S.entries = S.entries.filter(function (e) { return String(e.id) !== String(id); });
    if (S.trash && S.trash.entries && S.trash.entries.indexOf(Number(id)) < 0) { S.trash.entries.push(Number(id)); }

  /* ================= ถังเก็บของที่ลบ · กดกู้คืนได้ =================

  var BIN_MAX = 300;

  function binList() {
    return S.entries.filter(binIs).slice().sort(function (a, b) {
      var x = binPay(a).at || '', y = binPay(b).at || '';

    S.entries.push({ id: newId(), date: todayISO(), kind: 'bin',
      trucks: { v: 1, at: todayISO() + ' ' + sbNow(), who: (S.profile && S.profile.name) || '',
                label: label || 'รายการ', sub: sub || '', items: keep } });
    var over = binList().slice(BIN_MAX);

  function binRestore(id) {
    var b = sxFind(id, 'bin');

      S.entries.push(copy);
      if (S.trash && S.trash.entries) {

    var mw = 214, mh = m.offsetHeight;
    var left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
    var top = r.bottom + 6;

  /* ================= คู่ค้าวางเงินล่วงหน้า =================

  /* คู่ค้าที่ควรมีการ์ดในหน้าคุมการตัดเงิน · รายที่ปิดใช้งานแล้วแต่ยังมียอด ก็ยังต้องเห็น */

  function sxAllSets() {

                 p: r.trucks || {}, trucks: [] });

    SX.more = false; SX.moreT = {}; SX.docs = false; SX.dirty = false;
    return true;
  }

  /* ---------- ตัวเลขของชุดที่กำลังกรอก ---------- */
  function sxCalc() {
    var r = S.rates, p = SX.p || {}, bag = SX.type === 'bag';
    var tks = SX.trucks || [], n = tks.length;
    var decl = num(p.fdTrucks) || n;
    var docTons = decl * num(r.truckTon);
    if (num(p.kg) > 0) { docTons = num(p.kg) / 1000; }
    else if (bag) {
      /* ปูนถุงนับตามจำนวนถุงที่กรอก คันที่ยังไม่ได้กรอกคิดเต็มคันไปก่อน */
      docTons = Math.max(decl - n, 0) * num(r.truckTon);
      tks.forEach(function (t) { docTons += num(t.bags) / BAGS_TON; });
    }
    var na = bag ? 'lao' : ((tks[0] && tks[0].nation) || 'thai');
    var lane = laneOf(SX.type, na);
    var cnt = decl;
    if ((r.tierCount || 'set') !== 'set') {
      /* โหมดเก่า นับรวมทั้งวัน ต้องเอารถของชุดอื่นในวันเดียวกันมานับด้วย */
      cnt = n;
      S.entries.forEach(function (e) {
        if (e.kind !== 'import' || dOnly(e.date) !== dOnly(SX.date) || String(e.id) === String(SX.eid)) { return; }
        (e.trucks || []).forEach(function (t) {
          var ty = t.type === 'bag' ? 'bag' : 'powder';
          if (r.tierCount === 'all' || (r.tierCount === 'type' && ty === SX.type) ||
              (r.tierCount === 'lane' && laneOf(ty, t.nation || 'thai') === lane)) { cnt += 1; }
        });
      });
    }
    var tier = r.tiers[lane][Math.min(Math.max(cnt, 1), 5) - 1];
    var fr = bag ? num(r.frBag) : num(r.frPowder);
    var fRate = bag ? num(r.fBag) : num(r.fPowder);
    var tonsL = 0, tonsT = 0, inStock = 0, sold = 0, bags = 0;
    tks.forEach(function (t) {
      var a = num(t.lao.tons), b = num(t.thai.tons);
      tonsL += a; tonsT += b;
      if (t.tSend) { inStock += b; if (!bag && (t.dw || '').trim()) { sold += b; } }
      if (bag) { bags += num(t.bags); }
    });
    return { n: n, decl: decl, declared: num(p.fdTrucks) > 0, docTons: docTons, cnt: cnt, tier: tier, fr: fr,
             bill: (tier + fr) * docTons, tonsL: tonsL, tonsT: tonsT, inStock: inStock, sold: sold,
             bags: bags, fRate: fRate, fAmt: fRate * tonsL };
  }

        '<p style="margin:0 0 4px;font-weight:700;color:var(--head)">วันที่ ' + esc(thDate(day)) + ' ยังไม่มีชุดนำเข้า</p>' +
        '<p class="hint" style="margin:0">กด “บันทึกนำเข้าปูนผง” หรือ “บันทึกนำเข้าปูนถุง” ด้านบนเพื่อเริ่มกรอก · Form D หนึ่งฉบับคือหนึ่งชุด วันเดียวมีได้หลายชุด</p>' +
        '</div></section>';
    }
    /* ปุ่มวันที่นำเข้าเป็นตัวตั้งของทั้งหน้า จึงทำให้เด่นกว่าปุ่มอื่น พื้นเขียวอ่อนมีแสงเรืองรอบ */
    var dateBtn = dtField('sxDate', SX.date, false, '', true)
      .replace('background:var(--card);border:1px solid var(--line);',
               'background:#e6ffec;border:2px solid #22c55e;font-weight:700;' +
               'box-shadow:0 0 0 4px rgba(34,197,94,.20),0 0 16px rgba(34,197,94,.55);')
      .replace("font-size:12.5px;", "font-size:14.5px;")
      .replace('min-height:38px;', 'min-height:46px;');
    return '<div style="display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px">' +
      '<div style="flex:0 0 250px;min-width:210px">' +
      '<span style="display:block;font-size:13px;font-weight:700;color:#0a5c3e;margin-bottom:6px">' +
      'วันที่นำเข้า <span style="font-weight:500;color:var(--muted)">· กดเพื่อเปลี่ยนวัน</span></span>' +
      dateBtn + '</div>' +
      '<span class="badge b-i" style="font-size:12px;padding:6px 12px;margin-bottom:8px">' + (day === todayISO() ? 'วันนี้ ' : 'วันที่เลือก ') +
      sets.length + ' ชุด · ' + nTr + ' คัน</span>' +
      '<span style="flex:1 1 auto"></span>' +
      (SX.open ? '' : '<button type="button" class="btn" data-sxguide="1" style="' + sxGreen(SX.guide) + ';min-height:46px">' +
        (SX.guide ? 'ซ่อนตัวอย่าง' : 'ดูตัวอย่างการกรอก') + '</button>') +
      '<button type="button" class="btn" data-sxnew="powder" style="' + SX_PINK + '">' + SX_IC_POWDER + 'บันทึกนำเข้าปูนผง</button>' +
      '<button type="button" class="btn" data-sxnew="bag" style="' + SX_PINK + '">' + SX_IC_BAG + 'บันทึกนำเข้าปูนถุง</button></div>' +
      (SX.guide && !SX.open ? sxGuide() : '') + body;
  }

  /* ---------- แฟ้มเอกสารรายวัน ---------- */
  function sxFolder() {
    var F = SX.fold;
    if (!F.ym) { F.ym = String(SX.date || todayISO()).slice(0, 7); }
    var q = (F.q || '').trim().toLowerCase();
    var all = sxAllSets();
    var list = all.filter(function (s) {
      if (!q) { return s.date.slice(0, 7) === F.ym; }
      var p = s.p || {};
      var hay = [p.inv, p.fd, p.decl, p.tisi].concat(s.trucks.map(function (t) {
        return [t.lao && t.lao.plate, t.lao && t.lao.plate2, t.thai && t.thai.plate, t.thai && t.thai.plate2, t.mf].join(' ');
      })).join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });
    var days = {}, order = [];
    list.forEach(function (s) {
      if (!days[s.date]) { days[s.date] = []; order.push(s.date); }
      days[s.date].push(s);
    });
    order.sort().reverse();
    var rows = order.map(function (d) {
      var ss = days[d], nTr = 0, miss = 0, ty = {};
      ss.forEach(function (s) {
        nTr += s.trucks.length; ty[s.type] = 1;
        miss += sxDocStat(s.p, sxSetN(s.p, s.trucks)).miss.length;
      });
      var on = F.day === d;
      var h = '<button type="button" data-sxfd="' + d + '" style="font:inherit;cursor:pointer;display:grid;' +
        'grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;' +
        'padding:10px 13px;border-radius:11px;margin-bottom:7px;font-size:13px;color:var(--ink);' +
        (on ? 'border:2px solid var(--brand);background:var(--tint-weak)' : 'border:1px solid var(--line);background:var(--card)') + '">' +
        '<b style="color:var(--head)">' + esc(thDate(d)) + '</b>' +
        '<span>' + ss.length + ' ชุด · ' + nTr + ' คัน · ' +
        (ty.powder && ty.bag ? 'ปูนผงและปูนถุง' : (ty.bag ? 'ปูนถุง' : 'ปูนผง')) + '</span>' +
        '<span class="badge ' + (miss ? 'b-w' : 'b-s') + '">' + (miss ? 'ขาด ' + miss : 'ครบ') + '</span></button>';
      if (on) {
        h += '<div style="margin:0 0 12px 14px;padding-left:13px;border-left:2px solid var(--tint)">' +
          ss.map(function (s) {
            var p = s.p || {}, st = sxDocStat(p, sxSetN(p, s.trucks));
            var files = (p.docs || []).map(function (dd) {
              return '<button type="button" class="btn sm" data-sxfo="' + esc((s.r ? s.r.id : '') + '|' + dd.id) + '" ' +
                'style="min-height:28px;font-size:11.5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
                esc(dd.name) + '</button>';
            }).join(' ');
            return '<div style="padding:8px 0;border-bottom:1px dotted var(--line-soft)">' +
              '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
              '<b style="color:var(--head);font-size:13px">' + esc((p.inv || '').trim() || 'ยังไม่มีเลข Invoice') + '</b>' +
              '<span class="muted" style="font-size:12.5px">' + (s.type === 'bag' ? 'ปูนถุง' : 'ปูนผง') + ' · ' + s.trucks.length + ' คัน' +
              (p.decl ? ' · ใบขน ' + esc(p.decl) : '') + '</span>' +
              '<span style="flex:1 1 auto"></span>' +
              '<span class="badge ' + (st.miss.length ? 'b-w' : 'b-s') + '">' +
              (st.miss.length ? 'ขาด ' + st.miss.length : 'ครบ ' + st.have + '/' + st.total) + '</span>' +
              '<button type="button" class="btn sm" data-sxo="' + esc(s.key) + '" style="min-height:30px">' +
              (st.miss.length ? 'เปิดแนบเพิ่ม' : 'เปิดดู') + '</button></div>' +
              (st.miss.length ? '<p class="hint w" style="margin:5px 0 0">ขาด ' +
                esc(st.miss.map(function (k) { return sxSlotLabel(k); }).join(' · ')) + '</p>' : '') +
              (files ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">' + files + '</div>' : '') +
              '</div>';
          }).join('') +
          '<div class="actions" style="margin-top:9px"><button type="button" class="btn sm sec" data-sxfp="' + d + '">' +
          'พิมพ์ใบปะหน้าแฟ้มของวันนี้</button></div></div>';
      }
      return h;
    }).join('');

    return section(5, 'แฟ้มเอกสารรายวัน', 'เปิดย้อนดูเอกสารนำเข้าได้ทุกวัน วันไหนเอกสารขาดขึ้นป้ายสีส้ม',
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">' +
      '<button type="button" class="btn sm" data-sxfm="-1" aria-label="เดือนก่อนหน้า">‹</button>' +
      '<b style="min-width:140px;text-align:center;color:var(--head)">' + esc(ymFull(F.ym)) + '</b>' +
      '<button type="button" class="btn sm" data-sxfm="1" aria-label="เดือนถัดไป">›</button>' +
      '<input id="sxFq" type="text" value="' + esc(F.q || '') + '" placeholder="ค้นเลข Invoice · ใบขน · ทะเบียนรถ แล้วกด Enter" ' +
      'style="flex:1 1 240px;min-height:38px"></div>' +
      (q ? '<p class="hint" style="margin:0 0 9px">ผลค้นหา “' + esc(F.q) + '” จากทุกเดือน พบ ' + list.length + ' ชุด</p>' : '') +
      (rows || '<p class="muted" style="margin:0;padding:18px;text-align:center">' +
        (q ? 'ไม่พบชุดนำเข้าที่ตรงกับคำค้น' : 'เดือนนี้ยังไม่มีชุดนำเข้า') + '</p>'));
  }

  /* ใบปะหน้าแฟ้มประจำวัน พิมพ์ผ่าน iframe ซ่อน จึงไม่ต้องเปิดหน้าต่างใหม่ */
  function sxPrintDay(d) {
    var ss = sxAllSets().filter(function (s) { return s.date === d; });
    ss.sort(function (a, b) { return Number((a.e || a.r).id) - Number((b.e || b.r).id); });
    var body = ss.map(function (s, i) {
      var p = s.p || {}, st = sxDocStat(p, sxSetN(p, s.trucks));
      var tr = s.trucks.map(function (t, k) {
        return '<tr><td>' + (k + 1) + '</td><td>' + esc((t.lao && t.lao.plate) || '—') + '</td>' +
          '<td class="r">' + t2(num(t.lao && t.lao.tons)) + '</td><td>' + esc((t.thai && t.thai.plate) || '—') + '</td>' +
          '<td class="r">' + t2(num(t.thai && t.thai.tons)) + '</td><td>' + esc(dtTH(t.tSend) || '—') + '</td>' +
          '<td>' + esc(t.mf || '—') + '</td></tr>';
      }).join('');
      var docs = st.keys.map(function (k) {
        var dd = st.cov[k];
        return '<tr><td style="width:26px;text-align:center">' + (dd ? '☑' : '☐') + '</td><td>' + esc(sxSlotLabel(k)) + '</td>' +
          '<td>' + (dd ? esc(dd.name) : '<i>ยังไม่มีไฟล์แนบ</i>') + '</td></tr>';
      }).join('');
      return '<h2>ชุดที่ ' + (i + 1) + ' · ' + esc((p.inv || '').trim() || 'ยังไม่มีเลข Invoice') + ' · ' +
        (s.type === 'bag' ? 'ปูนถุง' : 'ปูนผง') + ' ' + s.trucks.length + ' คัน</h2>' +
        '<table><tr><th>Invoice</th><td>' + esc(p.inv || '—') + '</td><th>Form D</th><td>' + esc(p.fd || '—') + '</td></tr>' +
        '<tr><th>ใบขนสินค้า</th><td>' + esc(p.decl || '—') + '</td><th>ใบอนุญาต สมอ.</th><td>' + esc(p.tisi || '—') +
        (p.tisiExp ? ' (หมดอายุ ' + esc(thDate(p.tisiExp)) + ')' : '') + '</td></tr>' +
        '<tr><th>จำนวนคันตาม Form D</th><td>' + (num(p.fdTrucks) || '—') + '</td><th>จ่ายกรมศุลกากร</th><td>' +
        (rdTax(p) > 0 ? m2(rdTax(p)) + ' บาท' : '—') + '</td></tr></table>' +
        '<table><tr><th>ที่</th><th>รถลาว</th><th>ใบชั่งโรงงาน (ตัน)</th><th>รถไทย</th><th>ชั่งฝั่งไทย (ตัน)</th>' +
        '<th>เข้า STOCK</th><th>Car Manifest</th></tr>' + (tr || '<tr><td colspan="7">ยังไม่ได้ใส่รถ</td></tr>') + '</table>' +
        '<table><tr><th></th><th>เอกสาร</th><th>ไฟล์ที่แนบ</th></tr>' + docs + '</table>';
    }).join('');
    var html = '<!doctype html><html lang="th"><head><meta charset="utf-8"><title>ใบปะหน้าแฟ้ม ' + esc(thDate(d)) + '</title>' +
      '<style>body{font-family:"IBM Plex Sans Thai","Sarabun","Tahoma",sans-serif;font-size:12px;color:#111;margin:18mm 14mm}' +
      'h1{font-size:17px;margin:0 0 2px}h2{font-size:13.5px;margin:16px 0 6px;border-bottom:1.5px solid #111;padding-bottom:3px}' +
      'p{margin:0 0 8px}table{width:100%;border-collapse:collapse;margin-bottom:8px}' +
      'th,td{border:1px solid #777;padding:4px 6px;text-align:left;vertical-align:top}th{background:#eee;white-space:nowrap}' +
      '.r{text-align:right}</style></head><body>' +
      '<h1>ใบปะหน้าแฟ้มเอกสารนำเข้า ประจำวันที่ ' + esc(thDate(d)) + '</h1>' +
      '<p>' + esc(nm.ownCompany) + ' · รวม ' + ss.length + ' ชุด</p>' + body + '</body></html>';
    var old = el('sxPrintFrame');
    if (old) { old.parentNode.removeChild(old); }
    var fr = document.createElement('iframe');
    fr.id = 'sxPrintFrame';
    fr.setAttribute('aria-hidden', 'true');
    fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
    document.body.appendChild(fr);
    var doc = fr.contentWindow.document;
    doc.open(); doc.write(html); doc.close();
    setTimeout(function () {
      try { fr.contentWindow.focus(); fr.contentWindow.print(); }
      catch (e) { toast('เครื่องนี้สั่งพิมพ์จากหน้านี้ไม่ได้'); }
    }, 350);
  }

  /* ---------- บันทึกชุด ---------- */
  function sxSave() {
    if (isLocked(SX.date)) {
      toast('วันที่ ' + SX.date + ' อยู่ในงวดที่ปิดแล้ว · เปิดงวดก่อนจึงจะบันทึกได้');
      return;
    }
    var bag = SX.type === 'bag';
    var tks = SX.trucks.filter(function (t) { return !sxBlankTruck(t); });
    var bad = '';
    tks.forEach(function (t, i) {
      if (bad || t.type === 'bag') { return; }
      if ((t.dw || '').trim()) {
        if (!(num(t.dp) > 0)) { bad = 'คันที่ ' + (i + 1) + ' ใส่ลูกค้าปลายทางแล้ว ต้องใส่ราคาขายต่อตันด้วย'; }
        else if (!t.tSend) { bad = 'คันที่ ' + (i + 1) + ' จะขายปลายทางได้ ต้องใส่วันเวลาเข้า STOCK ก่อน'; }
        else if (!(num(t.thai.tons) > 0)) { bad = 'คันที่ ' + (i + 1) + ' ยังไม่มีน้ำหนักชั่งฝั่งไทย'; }
      }
    });
    if (bad) { toast(bad); return; }
    var pIn = SX.p;
    if (!tks.length && !(pIn.inv || '').trim() && !(pIn.fd || '').trim() && !(pIn.decl || '').trim()) {
      toast('ยังไม่มีข้อมูลให้บันทึก ใส่เลขเอกสารหรือรถอย่างน้อยหนึ่งคันก่อน');
      return;
    }

    /* 1) รายการเอกสารของชุด */
    var r = SX.rid ? rdFind(SX.rid) : null;
    var p = {}, k;
    if (r && r.trucks) { for (k in r.trucks) { if (Object.prototype.hasOwnProperty.call(r.trucks, k)) { p[k] = r.trucks[k]; } } }
    p.inv = (pIn.inv || '').trim(); p.invDate = dOnly(pIn.invDate);
    p.fd = (pIn.fd || '').trim(); p.fdDate = dOnly(pIn.fdDate);
    p.fdTrucks = num(pIn.fdTrucks);
    p.tisi = (pIn.tisi || '').trim(); p.tisiDate = dOnly(pIn.tisiDate); p.tisiExp = dOnly(pIn.tisiExp);
    p.decl = (pIn.decl || '').trim(); p.declDate = dOnly(pIn.declDate);
    p.pay = num(pIn.pay); p.bank = num(pIn.bank); p.payRef = (pIn.payRef || '').trim();
    p.goods = num(pIn.goods); p.kg = num(pIn.kg);
    p.docs = pIn.docs || [];
    if (r) { r.trucks = p; r.date = SX.date; r.cementType = SX.type; }
    else {
      r = { id: newId(), date: SX.date, kind: 'round', cementType: SX.type, trucks: p };
      S.entries.push(r);
    }
    SX.rid = r.id;

    /* 2) รายการรถของชุด */
    var e = SX.eid ? sxFind(SX.eid, 'import') : null;
    var oldSids = [];
    if (e) { (e.trucks || []).forEach(function (t) { if (t.sid) { oldSids.push(String(t.sid)); } }); }
    if (!tks.length) {
      if (e) { sxKill(e.id); }
      oldSids.forEach(function (id) { if (sxFind(id, 'pwOut')) { sxKill(id); } });
      SX.eid = null;
    } else {
      if (!e) { e = { id: newId(), date: SX.date, kind: 'import', trucks: [] }; S.entries.push(e); }
      e.date = SX.date;
      SX.eid = e.id;
      var decl = num(p.fdTrucks) || tks.length;
      var docTons = p.kg > 0 ? p.kg / 1000 : decl * num(S.rates.truckTon);
      var keep = {};
      tks.forEach(function (t, i) {
        var tb = t.type === 'bag';   /* รายการเก่าบางใบมีผงกับถุงปนกัน จึงดูชนิดเป็นรายคัน ไม่ทับด้วยชนิดของชุด */
        if (!t.round || String(t.round) === String(r.id) || !rdFind(t.round)) { t.round = r.id; }
        t.wb = p.decl || t.wb || '';
        t.dt = p.kg > 0 ? Math.round((docTons / decl) * 1000) / 1000
          : (tb ? num(t.bags) / BAGS_TON : num(S.rates.truckTon));
        if (tb) {
          t.nation = 'lao'; t.wh = true;
          t.dw = ''; t.dp = ''; t.dcid = '';
        } else { t.wh = false; }
        /* 3) ขายปลายทาง เข้า STOCK ก่อนแล้วตัดขายให้ในคราวเดียว */
        var want = !tb && (t.dw || '').trim();
        var ex = t.sid ? sxFind(t.sid, 'pwOut') : null;
        if (!want) { if (ex) { sxKill(ex.id); } t.sid = ''; t.dcid = ''; return; }
        var who = t.dw.trim();
        var rec = { date: dOnly(t.tSend) || SX.date, kind: 'pwOut', cementType: 'powder', who: who,
                    price: num(t.dp), tons: num(t.thai.tons),
                    trucks: { plate: (t.thai.plate || '').trim(), cid: t.dcid || '', auto: 1, src: e.id + ':' + (i + 1) } };
        if (ex) { for (var kk in rec) { if (Object.prototype.hasOwnProperty.call(rec, kk)) { ex[kk] = rec[kk]; } } }
        else { rec.id = newId(); S.entries.push(rec); t.sid = rec.id; }
        keep[String(t.sid)] = 1;
      });
      oldSids.forEach(function (id) { if (!keep[id] && sxFind(id, 'pwOut')) { sxKill(id); } });
      e.trucks = tks.map(mapTruck);
    }

    S.demo = false; save();
    logIt('บันทึกชุดนำเข้า', (p.inv || 'ไม่มีเลข Invoice') + ' · ' + tks.length + ' คัน · ' + thDate(SX.date));
    var soldN = tks.filter(function (t) { return !!t.sid; }).length;
    SX.open = false; SX.dirty = false; dfClear();
    viewEntry();
    toast('บันทึกชุด ' + (p.inv || '') + ' แล้ว · ' + tks.length + ' คัน' + (soldN ? ' · ตัดขายปลายทาง ' + soldN + ' คัน' : ''));
  }

  function sxDeleteKey(key) {
    var kind = String(key).charAt(0), id = String(key).slice(2), e = null, r = null;
    if (kind === 'e') {
      e = sxFind(id, 'import');
      var rid = '';
      ((e && e.trucks) || []).forEach(function (t) { if (!rid && t.round) { rid = t.round; } });
      r = rid ? rdFind(rid) : null;
    } else { r = rdFind(id); e = sxEntryOf(id); }
    if (e && isLocked(e.date)) { toast('ชุดนี้อยู่ในงวดที่ปิดแล้ว ลบไม่ได้'); return; }
    var name = (r && r.trucks && r.trucks.inv) || 'ชุดนี้';
    var tk = (e && e.trucks) || [];
    var sales = tk.map(function (t) { return t.sid ? sxFind(t.sid, 'pwOut') : null; })
                  .filter(function (x) { return !!x; });
    var ty = (e && e.cementType === 'bag') || (r && r.cementType === 'bag') ? 'ปูนถุง' : 'ปูนผง';
    var when = (e && e.date) || (r && r.date) || todayISO();
    askBox({
      title: 'ลบชุดนำเข้านี้ใช่ไหม',
      lede: 'ลบทั้งชุด ทั้งเอกสารของชุดและรถทุกคันในชุด',
      box: '<b>ชุดนำเข้า ' + esc(name) + '</b> · ' + ty + ' ' + tk.length + ' คัน<br>' +
        (r && r.trucks && r.trucks.decl ? 'ใบขน ' + esc(r.trucks.decl) + '<br>' : '') +
        'ของวันที่ ' + esc(thDate(when)),
      warn: 'ปูนของชุดนี้จะออกจากสตอก และเครดิตโรงงาน ค่าชิปปิ้งลาว ค่าชิปปิ้งไทย ' +
        'ค่าเอกซเรย์ กับภาษีของชุดนี้จะถูกหักออกจากยอดรวมทั้งหมด',
      hint: sales.length
        ? 'ชุดนี้มีรายการขายปลายทาง ' + sales.length + ' รายการผูกอยู่ จะลบไปพร้อมกัน และกู้คืนพร้อมกันทั้งชุด'
        : '',
      ok: 'ลบทั้งชุด',
      go: function () {
        binAdd('ชุดนำเข้า ' + name + ' · ' + ty + ' ' + tk.length + ' คัน',
               'ของวันที่ ' + thDate(when), [e, r].concat(sales));
        sales.forEach(function (s) { sxKill(s.id); });
        if (e) { sxKill(e.id); }
        /* เอกสารของชุดจะลบก็ต่อเมื่อไม่มีรถของรายการอื่นผูกอยู่แล้ว */
        if (r && !sxEntryOf(r.id)) { sxKill(r.id); }
        if (SX.open && ((e && String(SX.eid) === String(e.id)) || (r && String(SX.rid) === String(r.id)))) { sxClose(); }
        save(); logIt('ลบชุดนำเข้า', name);
        reNow(); toast('ลบชุด ' + name + ' แล้ว · กู้คืนได้ที่ประวัติการลบ');
      }
    });
  }

  /* ---------- ผูกปุ่มและช่องกรอก ---------- */
  function sxRefresh() {
    if (el('sxChecks')) { el('sxChecks').innerHTML = sxChecks(); }
    if (el('sxFoot')) { el('sxFoot').innerHTML = sxFoot(); }
    (SX.trucks || []).forEach(function (t, i) {
      if (el('sxTb' + i)) { el('sxTb' + i).innerHTML = sxTruckBadges(i); }
    });
  }

  function sxBind() {
    var root = el('v-entry');
    function all(sel, fn) { Array.prototype.forEach.call(root.querySelectorAll(sel), fn); }
    function arm(b, msg) {
      if (b.dataset.armed === '1') { return true; }
      b.dataset.armed = '1'; b.classList.add('pri'); b.textContent = 'กดอีกครั้ง';
      toast(msg);
      setTimeout(function () { if (b && b.dataset) { b.dataset.armed = ''; } }, 5000);
      return false;
    }

    if (el('sxDate')) {
      el('sxDate').addEventListener('change', function () {
        SX.date = dOnly(el('sxDate').value) || todayISO();
        if (SX.open) { SX.dirty = true; }
        SX.fold.ym = SX.date.slice(0, 7);
        viewEntry();
      });
    }
    all('[data-sxguide]', function (b) {
      b.addEventListener('click', function () { SX.guide = !SX.guide; viewEntry(); });
    });
    all('[data-sxnew]', function (b) {
      b.addEventListener('click', function () {
        if (sxNew(b.getAttribute('data-sxnew'))) {
          viewEntry();
          var f = el('sxp_inv'); if (f) { f.focus(); }
        }
      });
    });
    all('[data-sxo]', function (b) {
      b.addEventListener('click', function () {
        if (sxOpenKey(b.getAttribute('data-sxo'))) {
          viewEntry();
          var ed = el('sxEd'); if (ed && ed.scrollIntoView) { ed.scrollIntoView({ block: 'start' }); }
        }
      });
    });
    all('[data-sxdel]', function (b) {
      b.addEventListener('click', function () {
        if (!arm(b, 'กดอีกครั้งเพื่อลบชุดนี้ทั้งชุด รวมรถและรายการขายปลายทางของชุด')) { return; }
        sxDeleteKey(b.getAttribute('data-sxdel'));
      });
    });

    /* แฟ้มรายวัน */
    all('[data-sxfm]', function (b) {
      b.addEventListener('click', function () {
        var y = parseInt(SX.fold.ym.slice(0, 4), 10), m = parseInt(SX.fold.ym.slice(5, 7), 10) + parseInt(b.getAttribute('data-sxfm'), 10);
        if (m < 1) { m = 12; y -= 1; } if (m > 12) { m = 1; y += 1; }
        SX.fold.ym = y + '-' + (m < 10 ? '0' : '') + m; SX.fold.day = '';
        viewEntry();
      });
    });
    all('[data-sxfd]', function (b) {
      b.addEventListener('click', function () {
        var d = b.getAttribute('data-sxfd');
        SX.fold.day = SX.fold.day === d ? '' : d;
        viewEntry();
      });
    });
    all('[data-sxfp]', function (b) {
      b.addEventListener('click', function () { sxPrintDay(b.getAttribute('data-sxfp')); });
    });
    all('[data-sxfo]', function (b) {
      b.addEventListener('click', function () {
        var a = b.getAttribute('data-sxfo').split('|');
        var r = rdFind(a[0]);
        var d = ((r && r.trucks && r.trucks.docs) || []).filter(function (x) { return x.id === a[1]; })[0];
        sxDocOpen(d);
      });
    });
    if (el('sxFq')) {
      el('sxFq').addEventListener('change', function () { SX.fold.q = el('sxFq').value; SX.fold.day = ''; viewEntry(); });
    }

    if (!SX.open || !el('sxEd')) { return; }

    el('sxClose').addEventListener('click', function () {
      if (SX.dirty && !arm(el('sxClose'), 'ชุดนี้ยังไม่ได้บันทึก กดอีกครั้งถ้าต้องการปิดโดยไม่บันทึก')) { return; }
      sxClose(); viewEntry();
    });
    el('sxGuideT').addEventListener('click', function () { SX.guide = !SX.guide; viewEntry(); });
    el('sxMore').addEventListener('click', function () { SX.more = !SX.more; viewEntry(); });
    el('sxAdd').addEventListener('click', function () {
      var last = SX.trucks[SX.trucks.length - 1];
      var t = sxNewTruck(SX.type);
      if (last) {
        t.lao.company = last.lao.company; t.thai.company = last.thai.company;
        t.nation = SX.type === 'bag' ? 'lao' : last.nation; t.scan = last.scan;
        t.tSend = last.tSend;   /* รถในชุดเดียวกันผ่านด่านพร้อมกันตามใบขนใบเดียว เวลาอื่นต่างกันรายคัน จึงไม่ลอกให้ */
      }
      SX.trucks.push(t); SX.dirty = true;
      viewEntry();
      var f = el('sxt_lao_plate_' + (SX.trucks.length - 1)); if (f) { f.focus(); }
    });
    el('sxSave').addEventListener('click', sxSave);
    el('sxChecks').addEventListener('click', function (ev) {
      var b = ev.target && ev.target.closest ? ev.target.closest('#sxDocT') : null;
      if (b) { SX.docs = !SX.docs; viewEntry(); }
    });

    all('[data-sxmt]', function (b) {
      b.addEventListener('click', function () {
        var i = parseInt(b.getAttribute('data-sxmt'), 10);
        SX.moreT[i] = !SX.moreT[i]; viewEntry();
      });
    });
    all('[data-sxrm]', function (b) {
      b.addEventListener('click', function () {
        if (SX.trucks.length <= 1) { toast('ต้องมีอย่างน้อยหนึ่งคัน ถ้ารถยังไม่มาให้เว้นช่องรถว่างไว้ได้'); return; }
        if (b.dataset.armed !== '1') {
          b.dataset.armed = '1';
          b.innerHTML = ICON_TRASH + '<span style="margin-left:6px;font-size:12px;font-weight:600">กดอีกครั้งเพื่อลบ</span>';
          b.style.width = 'auto'; b.style.padding = '0 10px'; b.style.color = '#c0392b';
          setTimeout(function () { if (b && b.dataset) { b.dataset.armed = ''; } }, 5000);
          return;
        }
        var i = parseInt(b.getAttribute('data-sxrm'), 10);
        SX.trucks.splice(i, 1);
        /* เอกสารรายคันอ้างลำดับรถ ลบคันกลางแล้วต้องเลื่อนเลขตาม */
        (SX.p.docs || []).forEach(function (d) {
          if (!Array.isArray(d.covers)) { return; }
          d.covers = d.covers.map(function (k) {
            var a = String(k).split('#');
            if (!a[1]) { return k; }
            var n = parseInt(a[1], 10);
            if (n === i + 1) { return null; }
            return n > i + 1 ? a[0] + '#' + (n - 1) : k;
          }).filter(function (k) { return !!k; });
        });
        SX.moreT = {}; SX.dirty = true;
        viewEntry(); toast('ลบคันที่ ' + (i + 1) + ' แล้ว');
      });
    });

    all('[data-sxp]', function (inp) {
      var k = inp.getAttribute('data-sxp');
      var ev = inp.type === 'hidden' ? 'change' : 'input';
      inp.addEventListener(ev, function () {
        SX.p[k] = inp.value; SX.dirty = true;
        if (k === 'inv') {
          var hd = el('sxEd').querySelector('b');
          if (hd) { hd.textContent = hd.textContent.split(' · ')[0] + ' · ' + (inp.value.trim() || 'ชุดใหม่ ยังไม่มีเลข Invoice'); }
        }
        sxRefresh();
      });
    });

    all('[data-sxt]', function (inp) {
      var parts = inp.getAttribute('data-sxt').split(':');
      var path = parts[0].split('.'), i = parseInt(parts[1], 10);
      var key = path[path.length - 1];
      function target() { var t = SX.trucks[i]; return path.length > 1 ? t[path[0]] : t; }

      if (inp.type === 'checkbox') {
        inp.addEventListener('change', function () { target()[key] = inp.checked; SX.dirty = true; sxRefresh(); });
        return;
      }
      if (inp.tagName === 'SELECT' || inp.type === 'hidden') {
        inp.addEventListener('change', function () { target()[key] = inp.value; SX.dirty = true; sxRefresh(); });
        return;
      }
      if (key === 'phone') {
        inp.addEventListener('input', function () {
          var side = inp.getAttribute('data-ph') || 'thai', mx = phMax(side);
          var dg = phDigits(inp.value).slice(0, mx);
          if (inp.value !== dg) { inp.value = dg; }
          target()[key] = dg; SX.dirty = true;
          var cEl = el(inp.id + 'c');
          if (cEl) { cEl.innerHTML = phCount(side, dg); }
        });
        return;
      }
      if (key === 'bags') {
        inp.addEventListener('input', function () {
          var dg = String(inp.value).replace(/[^0-9]/g, '');
          if (inp.value !== dg) { inp.value = dg; }
          var t = SX.trucks[i], tn = t2(num(dg) / BAGS_TON);
          t.bags = dg; t.lao.tons = tn; t.thai.tons = tn; SX.dirty = true;
          if (el('sxBt' + i)) { el('sxBt' + i).textContent = tn; }
          sxRefresh();
        });
        return;
      }
      inp.addEventListener('input', function () {
        target()[key] = inp.value; SX.dirty = true;
        sxRefresh();
      });
      if (key === 'driver') {
        inp.addEventListener('change', function () {
          var known = book().drivers[(inp.value || '').trim()];
          var o = target();
          if (known && !(o.phone || '').trim()) {
            o.phone = phDigits(known).slice(0, phMax(path[0]));
            var pe = el('sxt_' + path[0] + '_phone_' + i);
            if (pe) { pe.value = o.phone; }
            var pc = el('sxt_' + path[0] + '_phone_' + i + 'c');
            if (pc) { pc.innerHTML = phCount(path[0], o.phone); }
          }
        });
      }
    });

    /* เอกสารแนบ */
    if (el('sxFile')) {
      el('sxFile').addEventListener('change', function () { sxAttach(el('sxFile').files, []); });
    }
    all('[data-sxslot]', function (inp) {
      inp.addEventListener('change', function () { sxAttach(inp.files, [inp.getAttribute('data-sxslot')]); });
    });
    all('[data-sxtick]', function (b) {
      b.addEventListener('click', function () {
        var a = b.getAttribute('data-sxtick').split('|');
        var d = (SX.p.docs || []).filter(function (x) { return x.id === a[0]; })[0];
        if (!d) { return; }
        var cv = docCovers(d).slice(), at = cv.indexOf(a[1]);
        if (at >= 0) { cv.splice(at, 1); } else { cv.push(a[1]); }
        d.covers = cv; SX.dirty = true;
        viewEntry();
      });
    });
    all('[data-sxdo]', function (b) {
      b.addEventListener('click', function () {
        sxDocOpen((SX.p.docs || []).filter(function (x) { return x.id === b.getAttribute('data-sxdo'); })[0]);
      });
    });
    all('[data-sxdd]', function (b) {
      b.addEventListener('click', function () {
        if (!arm(b, 'กดอีกครั้งเพื่อลบเอกสารนี้')) { return; }
        var id = b.getAttribute('data-sxdd');
        SX.p.docs = (SX.p.docs || []).filter(function (x) { return x.id !== id; });
        docDel(id); SX.dirty = true;
        viewEntry(); toast('ลบเอกสารแล้ว');
      });
    });
  }

  /* หน้าคุมนำเข้าและ STOCK ฉบับชุดนำเข้า */
  function viewEntry() {
    var afId = '', afPos = -1, sy = -1;
    try {
      var af = document.activeElement;
      if (af && af.id && el('v-entry').contains(af)) {
        afId = af.id;
        if (typeof af.selectionStart === 'number') { afPos = af.selectionStart; }

      }
    } catch (eFocus) { afId = ''; }
    var c = compute();
    var P = stkParts();
    var block = sxDayBlock();

      '<div class="head-row"><div><h1>คุมนำเข้าและ STOCK</h1>' +
      '<p class="lede">กรอกปูนที่รับเข้าเป็นชุด ชุดละหนึ่ง Form D ปูนทุกคันเข้าสตอกก่อน ' +
      'แล้วบันทึกขายออกตัดสตอกในหน้าเดียวกันนี้ · รายการรับ-จ่ายเงินอยู่ที่หน้าคุมการตัดเงิน</p></div>' +
      '<div class="actions"><a class="btn" href="#ledger">กลับหน้าคุมการตัดเงิน</a></div></div>' +
      '<div class="grid g2" style="margin-bottom:14px">' + P.cards + '</div>' +
      exBanner('E') +
      binBanner('E') +
      dfBanner() +
      block +
      '<div class="stack" style="margin-top:14px">' +
      P.pw + P.wh + P.transit + rdSection() + sxFolder() + P.month + '</div>' +
      importHistory(c);

    sxBind();
    exBind('round', viewEntry);
    bindEx('E', viewEntry);
    bindBin('E', viewEntry);
    bindSell(viewEntry);
    bindStock();

      el('dfDrop').addEventListener('click', function () {
        sxClose(); viewEntry(); toast('ล้างสิ่งที่กรอกค้างแล้ว');
      });

      var back = el(afId);
      if (back && typeof back.focus === 'function') {
        try { back.focus({ preventScroll: true }); } catch (eF) { back.focus(); }
        try { if (afPos >= 0 && typeof back.setSelectionRange === 'function') { back.setSelectionRange(afPos, afPos); } } catch (eSel) { /* ข้าม */ }

  /* หัวข้อรอบนำเข้า อยู่ในหน้าบันทึกปูนเข้า เพราะสร้างรอบแล้วผูกกับรถในหน้าเดียวกันได้เลย */
  function rdSection() {
    var c = stkCalc();
    var CM = tripCostMap();
    var rdRows = c.rounds.length
      ? c.rounds.map(function (r) {
          var ok = r.plan && r.crossed >= r.plan;
          var exp = r.p.tisiExp ? daysSince(r.p.tisiExp) : null;
          var done = r.trips.filter(function (t) { return !!t.cross; });
          var ship = done.reduce(function (s, t) { return s + thaiShipOf(t); }, 0);
          var shipTons = done.reduce(function (s, t) { return s + num(t.tonsT); }, 0);
          var shipTon = shipTons > 0 ? ship / shipTons : 0;
          var tax = rdTax(r.p);
          var taxTon = shipTons > 0 ? tax / shipTons : 0;
          var allCost = tax + done.reduce(function (s, t) {
            var k = CM[t.eid + ':' + t.seq];
            return s + (k ? k.fAmt + k.ship + k.scan + k.thai : 0);
          }, 0);
          var costTon = shipTons > 0 ? allCost / shipTons : 0;
          /* รวมช่องที่เกี่ยวกันไว้ด้วยกัน ให้ทั้งตารางพอดีจอ ไม่ต้องเลื่อนไปทางขวา */
          return '<tr><td class="str" style="white-space:nowrap">' + esc(r.p.inv || '—') +
            ' <span class="badge b-n">' + (r.e.cementType === 'bag' ? 'ปูนถุง' : 'ปูนผง') + '</span><br>' +
            '<span class="muted" style="font-size:11px;font-weight:400">' + esc(dtTH(r.p.invDate)) + '</span></td>' +
            '<td class="muted" style="white-space:nowrap;font-size:12px">' + esc(r.p.fd || '—') + '<br>' + esc(r.p.decl || '—') + '</td>' +
            '<td class="c" style="white-space:nowrap">' + (r.plan ? r.crossed + ' / ' + r.plan : r.crossed + ' / —') +
            (ok ? ' <span class="badge b-s">ครบ</span>'
                : (r.plan ? ' <span class="badge b-w">ขาด ' + (r.plan - r.crossed) + '</span>' : '')) + '</td>' +
            '<td class="n">' + (r.kgDoc ? m0(r.kgDoc) : '—') +
            '<br><span class="muted" style="font-size:11px">ชั่งไทย ' + (r.kgReal ? m0(r.kgReal) : '—') + '</span></td>' +
            '<td class="n">' + (ship > 0 ? m2(ship) : '—') +
            (shipTon > 0 ? '<br><span class="muted" style="font-size:11px">' + m2(shipTon) + '/ตัน</span>' : '') + '</td>' +
            '<td class="n">' + (tax > 0 ? m0(tax) : '—') +
            (taxTon > 0 ? '<br><span class="muted" style="font-size:11px">' + m2(taxTon) + '/ตัน</span>' : '') + '</td>' +
            '<td class="n" style="font-weight:700">' + (costTon > 0 ? m2(costTon) : '—') + '</td>' +
            '<td class="c">' + sxDocBadge(r.p, r.trips) + '</td>' +
            '<td class="c">' + (exp === null ? '—'
              : (exp > 0 ? '<span class="badge b-d">หมดอายุแล้ว</span>'
                         : '<span class="badge ' + (exp > -14 ? 'b-w' : 'b-n') + '">' + (-exp) + ' วัน</span>')) + '</td>' +
            '<td class="c">' + dotsBtn('st:r:' + r.e.id) + '</td></tr>';
        }).join('')
      : '<tr><td colspan="10" class="muted" style="padding:20px;text-align:center">ยังไม่มีชุดนำเข้า กด “บันทึกนำเข้าปูนผง” หรือ “บันทึกนำเข้าปูนถุง” ด้านบนเพื่อเริ่ม</td></tr>';

    return '<section class="card"><div class="card-h">' +
      '<span class="secnum" aria-hidden="true">4</span>' +
      '<div><h2>ชุดนำเข้าและต้นทุน</h2>' +
      '<p class="note">หนึ่งชุดคือ Form D หนึ่งฉบับ พร้อม Invoice ใบขน และใบอนุญาต สมอ. ของชุดนั้น · ' +
      'ต้นทุนรวมต่อตันคิดจากค่าปูน ค่าชิปปิ้งลาว ค่าขนส่งและประกัน ค่าชิปปิ้งไทย ค่าเอกซเรย์ และภาษีที่จ่ายกรมศุลกากร</p></div>' +
      exBtn('round') + '</div>' +
      '<div class="card-b">' + exPanel('round') +
      '<div class="tbox"><table><thead><tr><th>ชุดนำเข้า</th><th>Form D · ใบขน</th>' +
      '<th class="c">ผ่านด่าน</th><th class="n">เอกสาร (กก.)</th>' +
      '<th class="n">ชิปปิ้งไทย</th>' +
      '<th class="n">ภาษี+ธรรมเนียม</th><th class="n">ต้นทุนรวม/ตัน</th>' +
      '<th class="c">เอกสารแนบ</th>' +
      '<th class="c">สมอ. เหลือ</th><th class="c">จัดการ</th>' +
      '</tr></thead><tbody>' + rdRows + '</tbody></table></div>' +
      '</div></section>';
  }

  /* ผูกปุ่มของหัวข้อรอบนำเข้า ใช้ได้ทุกหน้าที่เอาหัวข้อนี้ไปวาง */
  function bindRounds(redraw) {
    exBind('round', redraw || viewEntry);
    bindDocs(redraw);
    if (el('rdAdd')) {
      el('rdAdd').addEventListener('click', function () {
        if (RF.open && !RF.id) { RF.open = false; } else { RF.open = true; RF.id = null; RF.docs = []; RF.vals = null; }
        redraw();
      });
    }
    if (el('rfCancel')) {
      el('rfCancel').addEventListener('click', function () {
        RF.open = false; RF.id = null; RF.docs = []; RF.vals = null; redraw();
      });
    }
    if (el('rfGoods')) {
      var vatTouched = false;
      function taxSum() {
        var tot = num(el('rfVat').value) + num(el('rfFee').value) + num(el('rfBank').value);
        var tons = 0;
        if (RF.id) {
          stkTrips().forEach(function (t) {
            if (String(t.round) === String(RF.id) && t.cross) { tons += num(t.tonsT); }
          });
        }
        el('rfTaxSum').textContent = tot > 0
          ? 'รวมที่จ่ายจริง ' + m2(tot) + ' บาท' +
            (tons > 0 ? ' · ภาษีและค่าธรรมเนียมต่อตัน ' + m2(tot / tons) + ' บาท (จาก ' + m2(tons) + ' ตัน)'
                      : ' · ยังไม่มีรถผ่านด่านในรอบนี้ จึงยังคิดต่อตันไม่ได้')
          : 'กรอกมูลค่าสินค้าแล้วระบบจะคิดภาษี 7% ให้เอง';
      }
      el('rfGoods').addEventListener('input', function () {
        if (!vatTouched) {
          var g = num(el('rfGoods').value);
          el('rfVat').value = g > 0 ? m2(g * 0.07) : '';
        }
        taxSum();
      });
      el('rfVat').addEventListener('input', function () { vatTouched = true; taxSum(); });
      el('rfFee').addEventListener('input', taxSum);
      el('rfBank').addEventListener('input', taxSum);
      taxSum();
    }
    if (el('rfSave')) {
      el('rfSave').addEventListener('click', function () {
        var p = {
          inv: el('rfInv').value.trim(), invDate: dOnly(el('rfInvD').value),
          fd: el('rfFd').value.trim(), fdDate: dOnly(el('rfFdD').value),
          fdTrucks: num(el('rfFdT').value),
          tisi: el('rfTisi').value.trim(), tisiDate: dOnly(el('rfTisiD').value),
          tisiExp: dOnly(el('rfTisiX').value), kg: num(el('rfKg').value),
          decl: el('rfDecl').value.trim(), declDate: dOnly(el('rfDeclD').value),
          vat: num(el('rfVat').value), payRef: el('rfPay').value.trim(),
          goods: num(el('rfGoods') && el('rfGoods').value),
          fee: num(el('rfFee') && el('rfFee').value),
          bank: num(el('rfBank') && el('rfBank').value),
          docs: (RF.docs || []).slice()
        };
        if (!p.inv) { toast('กรอกเลขที่ Invoice ก่อน'); return; }
        if (RF.id) {
          var r = rdFind(RF.id);
          if (r) { r.trucks = p; r.date = p.invDate || r.date; r.cementType = el('rfType').value; }
          logIt('แก้รอบนำเข้า', p.inv);
        } else {
          S.entries.push({ id: newId(), date: p.invDate || todayISO(), kind: 'round',
                           cementType: el('rfType').value, trucks: p });
          logIt('เพิ่มรอบนำเข้า', p.inv + ' · ' + (p.fdTrucks || '?') + ' คัน');
        }
        RF.open = false; RF.id = null; RF.docs = []; RF.vals = null;
        save(); redraw(); toast('บันทึกรอบนำเข้าแล้ว');
      });
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-rde]'), function (b) {
      b.addEventListener('click', function () {
        RF.open = true; RF.id = b.getAttribute('data-rde'); RF.vals = null;
        var rr = rdFind(RF.id);
        RF.docs = ((rr && rr.trucks && rr.trucks.docs) || []).slice();
        redraw();
        var f = el('rfInv'); if (f) { f.scrollIntoView({ block: 'center' }); }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rdd]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-rdd');
        var used = stkTrips().filter(function (t) { return String(t.round) === String(id); }).length;
        if (b.dataset.armed !== '1') {
          b.dataset.armed = '1'; b.classList.add('pri'); b.textContent = 'กดอีกครั้ง';
          toast(used ? 'รอบนี้มีเที่ยวรถผูกอยู่ ' + used + ' เที่ยว · กดอีกครั้งถ้าแน่ใจ'
                     : 'กดอีกครั้งเพื่อลบรอบนำเข้านี้');
          return;
        }
        S.entries = S.entries.filter(function (e) { return String(e.id) !== String(id); });
        if (S.trash && S.trash.entries && S.trash.entries.indexOf(Number(id)) < 0) { S.trash.entries.push(Number(id)); }
        save(); logIt('ลบรอบนำเข้า', 'id ' + id);
        redraw(); toast('ลบแล้ว');
      });
    });
  }


  /* ---- ปูนผงในสตอก ----
     รถปูนผงที่ผ่านด่านไทยแล้วและไม่ได้เข้าโกดัง ถือว่าเข้าสตอกปูนผง
     จะตัดออกก็ต่อเมื่อบันทึกขายในหน้านี้ เหมือนปูนถุงที่ตัดตอนจ่ายออกจากโกดัง */
  var PF = { open: false, editId: null };

  function pwList() {
    return S.entries.filter(function (e) { return e.kind === 'pwOut'; });
  }

  function pwCalc() {
    var moves = [];
    stkTrips().forEach(function (t) {
      if (t.type !== 'powder' || !t.cross || t.wh) { return; }
      moves.push({ at: t.cross, dir: 'in', tons: t.tonsT,
                   who: 'รถ ' + (t.thai || t.lao || '—'),
                   note: 'ผ่านด่านไทยแล้ว เข้าสตอกปูนผง' });
    });
    pwList().forEach(function (e) {
      var p = e.trucks || {};
      moves.push({ at: e.date, dir: 'out', tons: num(e.tons),
                   who: e.who || '', plate: p.plate || '', cid: crOf(e), auto: !!p.auto,
                   price: num(e.price), amount: num(e.price) * num(e.tons), entry: e });
    });
    moves.sort(function (a, b) { return (a.at || '').localeCompare(b.at || ''); });
    var bal = 0, inSum = 0, outSum = 0, amt = 0;
    moves.forEach(function (m) {
      bal += (m.dir === 'in' ? m.tons : -m.tons);
      m.bal = bal;
      if (m.dir === 'in') { inSum += m.tons; } else { outSum += m.tons; amt += m.amount; }
    });
    return { moves: moves, bal: bal, inSum: inSum, outSum: outSum, amount: amt };
  }

  function pwForm() {
    var cus = cusOpts();
    var ed = PF.editId ? sxFind(PF.editId, 'pwOut') : null;
    var ep = (ed && ed.trucks) || {};

      '<div class="card-b">' +
      (ed ? '<p style="margin:0 0 10px;font-size:13.5px;font-weight:700;color:var(--head);' +
            'display:flex;align-items:center;gap:8px"><span class="ms" aria-hidden="true" ' +
            'style="font-size:19px;color:var(--accent)">edit</span>แก้ไขรายการขายปูนผง' +
            '<span class="badge b-n">บันทึกไว้เมื่อ ' + esc(thDate(ed.date)) + '</span></p>' : '') +
      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px">' +
        '<div><label class="fl" for="pfDate">วันที่รถมารับ</label>' + dtField('pfDate', ed ? ed.date : todayISO(), false, '', false) + '</div>' +
        '<div><label class="fl" for="pfTons">จำนวนตันที่ขาย</label>' +
        '<input id="pfTons" class="n" type="text" inputmode="decimal" value="' + (ed ? esc(t2(num(ed.tons))) : '') + '" placeholder="32.00" style="min-height:38px"></div>' +
        '<div><label class="fl" for="pfPT">ราคาต่อตัน (รวม VAT)</label>' +
        '<input id="pfPT" class="n" type="text" inputmode="decimal" value="' + (ed ? esc(m2(num(ed.price))) : '') + '" placeholder="1450" style="min-height:38px"></div>' +
        '<div><label class="fl" for="pfWho">ลูกค้า/ปลายทางจัดส่ง</label>' +
        '<input id="pfWho" type="text" list="pfCus" value="' + (ed ? esc(ed.who || '') : '') + '" placeholder="ชื่อลูกค้า" style="min-height:38px">' +
        '<datalist id="pfCus">' + cus + '</datalist></div>' +
        '<div><label class="fl" for="pfPlate">ทะเบียนรถที่มารับ</label>' +
        '<input id="pfPlate" type="text" list="pfPlt" value="' + esc(ep.plate || '') + '" placeholder="73-3415 สระบุรี" style="min-height:38px">' +
        '<datalist id="pfPlt">' + pltOpts() + '</datalist></div>' +
        crSelect('pfCid', ed ? crOf(ed) : '', 'เลือกตัดเครดิต') +
      '</div>' +
      '<p class="hint" id="pfCalc" style="margin:9px 0 0">กรอกตันกับราคาต่อตัน ระบบคิดเป็นเงินให้เอง</p>' +
      '<div class="actions" style="margin-top:10px">' +
        '<button type="button" class="btn pri" id="pfSave">' + (ed ? 'บันทึกการแก้ไข' : 'บันทึกการขาย') + '</button>' +
        '<button type="button" class="btn" id="pfCancel">ยกเลิก</button>' +
      '</div></div></div>';
  }

  function pwSection(pc, n) {

      ? pc.moves.slice().reverse().map(function (m) {

      ' · ขายออกบันทึกเองตอนลูกค้ามารับ',
      exPanel('powder') +
      '<div class="actions" style="margin-bottom:10px">' +
      '<button type="button" class="btn" id="pwAdd" style="' + SX_PINK + '">' + SX_IC_POWDER +
      (PF.open ? 'ปิดฟอร์ม' : 'บันทึกขายปูนผง') + '</button>' +
      '<span class="badge ' + (pc.bal < -0.001 ? 'b-d' : 'b-i') + '" style="align-self:center">คงเหลือ ' +
      m2(pc.bal) + ' ตัน</span></div>' +
      (PF.open ? pwForm() : '') +
      '<div class="tbox" style="margin-top:10px"><table><thead><tr><th>วันที่</th><th>รายการ</th>' +
      '<th>ลูกค้า/ที่มา</th><th class="c">ตัน</th><th class="c">ราคา/ตัน</th><th class="c">เป็นเงิน</th>' +
      '<th class="c">คงเหลือ (ตัน)</th><th class="c"></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (pc.bal < -0.001
        ? '<p class="hint w" style="margin-top:9px">ยอดคงเหลือติดลบ แปลว่าบันทึกขายมากกว่าที่ผ่านด่านเข้ามา ' +
          'ตรวจว่าลืมกรอกวันเวลาผ่านด่านของรถคันไหนหรือเปล่า</p>'
        : ''), exBtn('powder'));
  }

  function bindPw(redraw) {
    redraw = redraw || viewEntry;
    exBind('powder', redraw);
    if (el('pwAdd')) {
      el('pwAdd').addEventListener('click', function () { PF.open = !PF.open; PF.editId = null; redraw(); });
    }
    if (el('pfCancel')) {
      el('pfCancel').addEventListener('click', function () { PF.open = false; PF.editId = null; redraw(); });
    }
    if (el('pfCid')) {
      el('pfCid').addEventListener('change', function () {
        var pr = crPrice(el('pfCid').value, 'powder');
        if (el('pfCid').value && pr > 0 && !num(el('pfPT').value)) { el('pfPT').value = m2(pr); }
        if (el('pfCalc')) { el('pfCalc').dispatchEvent(new Event('x')); }
        var ev = document.createEvent('Event'); ev.initEvent('input', true, true);
        if (el('pfTons')) { el('pfTons').dispatchEvent(ev); }
      });
    }
    if (el('pfTons') && el('pfPT')) {
      function calc() {
        var t = num(el('pfTons').value), r = num(el('pfPT').value);
        el('pfCalc').textContent = (t > 0 && r > 0)
          ? m2(t) + ' ตัน × ' + m2(r) + ' = ' + m2(t * r) + ' บาท (รวมภาษีแล้ว)'
          : 'กรอกตันกับราคาต่อตัน ระบบคิดเป็นเงินให้เอง';
      }
      el('pfTons').addEventListener('input', calc);
      el('pfPT').addEventListener('input', calc);
    }
    if (el('pfSave')) {
      el('pfSave').addEventListener('click', function () {
        var tons = num(el('pfTons').value);
        if (tons <= 0) { toast('กรอกจำนวนตันก่อน'); return; }
        var ed = PF.editId ? sxFind(PF.editId, 'pwOut') : null;
        var have = pwCalc().bal + (ed ? num(ed.tons) : 0);
        if (tons > have + 0.001) {
          toast('ขายเกินที่มีในสตอก · ตอนนี้เหลือ ' + m2(have) + ' ตัน');
          return;
        }
        var date = dOnly(el('pfDate').value) || todayISO();
        if (isLocked(date) || (ed && isLocked(ed.date))) { toast('วันที่นี้อยู่ในงวดที่ปิดแล้ว บันทึกไม่ได้'); return; }
        var rec = ed || { id: newId(), kind: 'pwOut' };
        rec.date = date; rec.cementType = 'powder'; rec.who = el('pfWho').value.trim();
        rec.price = num(el('pfPT').value); rec.tons = tons;
        rec.trucks = { plate: el('pfPlate').value.trim(), cid: el('pfCid') ? el('pfCid').value : '' };
        if (!ed) { S.entries.push(rec); }
        PF.open = false; PF.editId = null;
        save(); logIt(ed ? 'แก้ไขรายการขายปูนผง' : 'ขายปูนผงจากสตอก', m2(tons) + ' ตัน');
        redraw(); toast((ed ? 'แก้ไขแล้ว' : 'บันทึกแล้ว') + ' · คงเหลือ ' + m2(pwCalc().bal) + ' ตัน');
      });
    }
  }


  /* ค่าชิปปิ้งไทยของเที่ยวรถหนึ่งคัน คิดตามฐานที่ตั้งไว้ในหน้าตั้งค่าอัตรา */
  function thaiShipOf(t) {
    var r = S.rates;
    var per = (t.type === 'bag') ? num(r.tBag) : num(r.tPowder);
    if (r.thaiBasis === 'ton') {
      var perTon = num(r.truckTon) > 0 ? per / num(r.truckTon) : 0;
      return perTon * num(t.tonsT);
    }
    return per;
  }

  /* สรุปค่าชิปปิ้งไทยรายใบขน ใช้ตรวจกับใบวางบิลของชิปปิ้งฝั่งไทย */
  function declRows() {
    var map = {};
    stkCalc().rounds.forEach(function (r) {
      var key = (r.p.decl || '').trim() || '(ยังไม่ได้กรอกเลขใบขน)';
      if (!map[key]) {
        map[key] = { decl: key, inv: r.p.inv || '', dates: [], trucks: 0, tons: 0, amt: 0, plates: [] };
      }
      var g = map[key];
      if (r.p.inv && g.inv.indexOf(r.p.inv) < 0) { g.inv += (g.inv ? ' · ' : '') + r.p.inv; }
      r.trips.forEach(function (t) {
        if (!t.cross) { return; }
        g.trucks += 1;
        g.tons += num(t.tonsT);
        g.amt += thaiShipOf(t);
        g.dates.push(dOnly(t.cross));
        if (t.thai) { g.plates.push(t.thai); }
      });
    });
    return Object.keys(map).map(function (k) {
      var g = map[k];
      g.dates.sort();
      g.from = g.dates[0] || '';
      g.to = g.dates[g.dates.length - 1] || '';
      g.perTon = g.tons > 0 ? g.amt / g.tons : 0;
      g.perTruck = g.trucks > 0 ? g.amt / g.trucks : 0;
      return g;
    }).filter(function (g) { return g.trucks > 0; })
      .sort(function (a, b) { return (b.from || '').localeCompare(a.from || ''); });
  }


  /* ต้นทุนรายคันจากหน้าคุมการตัดเงิน เอามาใช้ซ้ำ จะได้ไม่คิดเลขคนละทางกัน */
  function tripCostMap() {
    var map = {};
    compute().rows.forEach(function (w) {
      if (!w.e || w.e.kind !== 'import' || !w.items) { return; }
      w.items.forEach(function (it) {
        map[w.e.id + ':' + it.seq] = {
          fAmt: it.fAmt, ship: it.shipAmt, scan: it.scan, thai: it.thaiAmt, tons: it.tonsThai
        };
      });
    });
    return map;
  }

  /* ภาษีและค่าธรรมเนียมของรอบหนึ่ง รวมสามก้อนตามที่จ่ายจริง */
  function rdTax(p) {
    if (num(p.pay) > 0) { return num(p.pay) + num(p.bank); }
    return num(p.vat) + num(p.fee) + num(p.bank);
  }


  /* เลือกชนิดปูนทั้งใบบันทึก ปูนผงจับคู่รถ ปูนถุงคันเดียว สลับได้โดยไม่ล้างข้อมูลที่พิมพ์ไว้ */
  function applyMode() {
    var m = form.mode === 'bag' ? 'bag' : 'powder';
    form.trucks.forEach(function (t) {
      t.type = m;
      if (m === 'bag') {
        t.nation = 'lao';
        t.wh = true;
        if (!num(t.bags)) { t.bags = BAGS_TRUCK; }
        var tn = t2(num(t.bags) / BAGS_TON);
        t.lao.tons = tn; t.thai.tons = tn;
      } else {
        t.wh = false;
      }
    });
  }

  function modePicker() {
    var bag = form.mode === 'bag';
    function card(id, title, sub, tone, on) {
      return '<button type="button" data-mode="' + id + '" ' +

    function tab(id, label, tone, on) {
